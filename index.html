<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050b14">

<title>UTRUX ROCKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#030810;
    --bg2:#07121e;
    --panel:#0a1625;
    --line:rgba(255,255,255,.065);

    --blue:#258cff;
    --blue2:#58b0ff;

    --green:#20d486;
    --green2:#59eeaa;

    --red:#ff4e67;
    --red2:#ff7a89;

    --yellow:#ffc94d;

    --muted:#78899f;
}

html,
body{
    min-height:100%;
}

body{
    min-height:100vh;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -15%,
            #19416e 0%,
            transparent 44%
        ),
        linear-gradient(
            180deg,
            var(--bg2),
            var(--bg)
        );

    overflow-x:hidden;
}

button,
input{
    font:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    background:
        rgba(3,9,17,.95);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:
        blur(18px);

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;

    padding:
        7px
        12px;

    border-radius:999px;

    background:#0d1928;

    border:
        1px solid
        rgba(255,255,255,.06);

    font-size:15px;
    font-weight:900;
}

.coin{
    width:23px;
    height:23px;
    flex:none;
}


/* =====================================================
   MAIN
===================================================== */

.container{
    width:min(920px,100%);
    margin:auto;
    padding:12px;
}


/* =====================================================
   GAME
===================================================== */

.game{
    position:relative;

    width:100%;
    height:480px;

    overflow:hidden;

    border-radius:24px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 50% 54%,
            rgba(38,140,255,.19),
            transparent 36%
        ),
        linear-gradient(
            180deg,
            #081a2e,
            #040a12
        );

    isolation:isolate;
}


/* =====================================================
   BACKGROUND
===================================================== */

.stars{
    position:absolute;
    inset:0;

    opacity:.21;

    background-image:
        radial-gradient(
            circle,
            #fff 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            #61b6ff 1px,
            transparent 1px
        );

    background-size:
        89px 93px,
        145px 131px;

    background-position:
        12px 18px,
        42px 60px;

    z-index:0;
}

.grid{
    position:absolute;

    left:-20%;
    right:-20%;

    bottom:-125px;

    height:340px;

    opacity:.13;

    transform:
        perspective(390px)
        rotateX(58deg);

    background-image:

        linear-gradient(
            rgba(38,140,255,.65)
            1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(38,140,255,.65)
            1px,
            transparent 1px
        );

    background-size:45px 45px;

    z-index:1;
}


/* =====================================================
   TOP TEXT
===================================================== */

.status{
    position:absolute;

    top:18px;
    left:50%;

    transform:
        translateX(-50%);

    color:var(--muted);

    font-size:11px;
    font-weight:900;

    letter-spacing:1.5px;

    z-index:30;

    white-space:nowrap;
}

.round-id{
    position:absolute;

    top:18px;
    left:17px;

    color:
        rgba(255,255,255,.34);

    font-size:10px;
    font-weight:800;

    z-index:30;
}


/* =====================================================
   CENTER MULTIPLIER
===================================================== */

.multiplier{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:76px;

    line-height:1;

    font-weight:900;

    letter-spacing:-3px;

    color:#fff;

    z-index:35;

    user-select:none;

    text-shadow:
        0 0 25px
        rgba(38,140,255,.24),

        0 0 60px
        rgba(38,140,255,.13);
}

.multiplier.crashed{
    color:
        var(--red);

    text-shadow:
        0 0 30px
        rgba(255,78,103,.55);
}


/* =====================================================
   ROCKET
===================================================== */

/*
   شروع:
   پایین چپ

   پایان مسیر:
   مرکز

   در مرکز:
   رو به بالا-راست و در حالت پرواز
*/

.rocket-wrap{
    position:absolute;

    left:50%;
    top:50%;

    width:124px;
    height:124px;

    opacity:0;

    z-index:24;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        translate(-350px,185px);

    transition:
        transform 1.8s
        cubic-bezier(.16,.80,.22,1),

        opacity .30s;
}


/* ورود به مرکز */

.rocket-wrap.entering{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translate(0,0);
}


/* در مرکز */

.rocket-wrap.hovering{

    opacity:1;
}


/* پرواز داخلی */

.rocket-flight{
    position:absolute;

    inset:0;
}


/* =====================================================
   ROCKET BODY
===================================================== */

.rocket{
    position:absolute;

    left:40px;
    top:22px;

    width:42px;
    height:92px;

    border-radius:
        50%
        50%
        44%
        44%;

    /*
        جهت بالا-راست
    */

    transform:
        rotate(35deg);

    background:
        linear-gradient(
            90deg,
            #70879b 0%,
            #edf6ff 34%,
            #fff 54%,
            #8399aa 100%
        );

    box-shadow:
        inset
        -6px
        0
        10px
        rgba(0,0,0,.2),

        0
        0
        22px
        rgba(255,255,255,.12);
}


/* nose */

.rocket::before{

    content:"";

    position:absolute;

    left:0;
    top:-18px;

    width:42px;
    height:37px;

    border-radius:
        50%
        50%
        19%
        19%;

    background:
        linear-gradient(
            90deg,
            #91a6b7,
            #fff 50%,
            #8195a7
        );
}


/* window */

.window{

    position:absolute;

    left:12px;
    top:21px;

    width:17px;
    height:17px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e7f8ff,
            #268fff 44%,
            #064c91
        );

    border:
        3px solid
        #526a81;

    box-shadow:
        0 0 13px
        rgba(38,140,255,.9);
}


/* body line */

.body-line{

    position:absolute;

    left:19px;
    top:17px;

    width:4px;
    height:57px;

    border-radius:10px;

    background:
        rgba(78,109,134,.32);
}


/* fins */

.fin-left{

    position:absolute;

    left:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            135deg,
            #3b566d,
            #7890a4
        );

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.fin-right{

    position:absolute;

    right:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            225deg,
            #3b566d,
            #7890a4
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}


/* engine */

.engine{

    position:absolute;

    left:8px;
    bottom:-9px;

    width:26px;
    height:17px;

    border-radius:
        0 0 12px 12px;

    background:#354b60;
}


/* flame */

.flame{

    position:absolute;

    left:8px;
    bottom:-65px;

    width:27px;
    height:67px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #ffe15a 20%,
            #ff9c21 52%,
            #ff3d5d 100%
        );

    clip-path:
        polygon(
            50% 100%,
            5% 35%,
            30% 48%,
            39% 0,
            61% 48%,
            95% 35%
        );

    filter:
        drop-shadow(
            0 0 13px
            #ff7b28
        );

    animation:
        flame .07s
        infinite
        alternate;
}


/* =====================================================
   CENTER HOVER
===================================================== */

.rocket-wrap.hovering .rocket-flight{

    animation:
        rocketFloat
        .72s
        ease-in-out
        infinite;
}


@keyframes rocketFloat{

    0%{
        transform:
            translate(0,2px);
    }

    25%{
        transform:
            translate(2px,-2px);
    }

    50%{
        transform:
            translate(1px,-6px);
    }

    75%{
        transform:
            translate(-2px,-2px);
    }

    100%{
        transform:
            translate(0,2px);
    }
}


@keyframes flame{

    from{
        transform:
            scaleY(.88);
    }

    to{
        transform:
            scaleY(1.12);
    }
}


/* =====================================================
   EXPLOSION
===================================================== */

.explosion{

    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:210px;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    border-radius:50%;

    z-index:70;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            #fff 0 5%,
            #ffe56b 8%,
            #ff9e22 25%,
            #ff4e3d 45%,
            rgba(255,55,65,.15) 67%,
            transparent 73%
        );
}

.explosion.active{

    animation:
        explode .9s
        ease-out
        forwards;
}

@keyframes explode{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    45%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.9);
    }
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(2,7,13,.53);

    backdrop-filter:
        blur(5px);

    z-index:90;
}

.count-number{

    font-size:145px;

    font-weight:900;

    text-shadow:
        0 0 55px
        rgba(38,140,255,.75);

    animation:
        countPop
        .65s
        ease;
}

@keyframes countPop{

    from{
        transform:
            scale(1.30);

        opacity:0;
    }

    to{
        transform:
            scale(1);

        opacity:1;
    }
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    margin-top:10px;
}


/* BETTING / WITHDRAW */

.betting-btn{

    width:100%;

    border:0;

    border-radius:15px;

    padding:17px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #268cff,
            #1767ca
        );

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 28px
        rgba(38,140,255,.18);

    transition:
        transform .15s,
        opacity .15s,
        background .2s;
}

.betting-btn:active{
    transform:
        scale(.99);
}

.betting-btn.withdraw{

    background:
        linear-gradient(
            135deg,
            #ffc94d,
            #e69a12
        );

    color:#241700;
}

.betting-btn:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* =====================================================
   BET PANEL
===================================================== */

.bet-panel{

    display:none;

    margin-top:8px;

    padding:13px;

    border-radius:16px;

    background:
        var(--panel);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.bet-panel.show{
    display:block;
}

.bet-row{

    display:flex;

    gap:8px;
}

.amount{

    flex:1;

    min-width:0;

    padding:14px;

    color:#fff;

    background:#050c15;

    border:
        1px solid
        #263c55;

    border-radius:11px;

    outline:none;

    font-weight:800;
}

.amount:focus{

    border-color:
        var(--blue);
}

.start{

    min-width:100px;

    border:0;

    border-radius:11px;

    background:
        var(--green);

    color:#03140c;

    font-weight:900;

    cursor:pointer;
}

.start:disabled{
    opacity:.45;
}

.message{

    min-height:20px;

    padding-top:8px;

    text-align:center;

    color:
        var(--muted);

    font-size:12px;
}


/* =====================================================
   PLAYERS
===================================================== */

.players{

    margin-top:10px;

    overflow:hidden;

    border-radius:18px;

    background:
        var(--panel);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.players-head{

    display:grid;

    grid-template-columns:
        1fr
        95px
        125px;

    gap:8px;

    align-items:center;

    padding:
        13px
        14px;

    color:
        #617087;

    font-size:10px;

    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.player{

    display:grid;

    grid-template-columns:
        1fr
        95px
        125px;

    gap:8px;

    align-items:center;

    min-height:47px;

    padding:
        12px
        14px;

    font-size:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);

    transition:
        background .25s,
        color .25s;
}

.player:last-child{
    border-bottom:0;
}


/* YOU */

.player.you{

    background:
        rgba(38,140,255,.08);
}


/* ACTIVE */

.player.active .player-value{

    color:
        var(--blue2);
}


/* GREEN */

.player.cashed{

    background:
        rgba(32,212,134,.10);
}

.player.cashed .player-name,
.player.cashed .player-value{

    color:
        var(--green2);
}


/* RED */

.player.crashed{

    background:
        rgba(255,78,103,.10);
}

.player.crashed .player-name,
.player.crashed .player-value{

    color:
        var(--red2);
}


/* player text */

.player-name{

    font-weight:900;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.player-bet{

    color:
        #a4b1c0;

    text-align:right;
}

.player-value{

    color:
        var(--blue2);

    text-align:right;

    font-weight:900;

    white-space:nowrap;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        padding:
            0 12px;
    }

    .container{
        padding:
            10px;
    }

    .game{
        height:425px;
        border-radius:20px;
    }

    .multiplier{
        font-size:58px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{

        grid-template-columns:
            1fr
            72px
            105px;

        padding:
            12px 10px;
    }

    .player{
        font-size:11px;
    }

    .rocket-wrap{

        transform:
            translate(-50%,-50%)
            translate(-275px,160px);

    }

    .rocket-wrap.entering{

        transform:
            translate(-50%,-50%)
            translate(0,0);

    }

}
</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        UTRUX
    </div>


    <div class="balance">

        <span id="balance">
            100.00
        </span>


        <!-- TON STYLE COIN -->

        <svg
            class="coin"
            viewBox="0 0 100 100">

            <defs>

                <linearGradient
                    id="tonGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0%"
                        stop-color="#38a8ff"/>

                    <stop
                        offset="100%"
                        stop-color="#0875d8"/>

                </linearGradient>

            </defs>


            <circle
                cx="50"
                cy="50"
                r="47"
                fill="url(#tonGradient)"/>


            <!-- TON-like geometric symbol -->

            <path
                d="
                    M21 28
                    L39 28
                    L50 47
                    L61 28
                    L79 28
                    L50 77
                    Z
                "
                fill="#fff"/>


            <path
                d="
                    M39 28
                    L50 47
                    L50 77
                    L21 28
                    Z
                "
                fill="#dff2ff"/>


            <path
                d="
                    M61 28
                    L50 47
                    L50 77
                    L79 28
                    Z
                "
                fill="#b9ddff"/>

        </svg>

    </div>

</header>


<main class="container">


<!-- =====================================================
     GAME
===================================================== -->

<section class="game">


    <div class="stars"></div>

    <div class="grid"></div>


    <div
        class="round-id"
        id="roundId">

        ROUND #1

    </div>


    <div
        class="status"
        id="status">

        BETTING OPEN

    </div>


    <!-- ضریب همیشه وسط -->

    <div
        class="multiplier"
        id="multiplier">

        1.00x

    </div>


    <!-- ROCKET -->

    <div
        class="rocket-wrap"
        id="rocketWrap">


        <div class="rocket-flight">


            <div class="rocket">


                <div
                    class="body-line">
                </div>


                <div
                    class="window">
                </div>


                <div
                    class="fin-left">
                </div>


                <div
                    class="fin-right">
                </div>


                <div
                    class="engine">
                </div>


                <div
                    class="flame">
                </div>


            </div>


        </div>


    </div>


    <!-- EXPLOSION -->

    <div
        class="explosion"
        id="explosion">
    </div>


    <!-- COUNTDOWN -->

    <div
        class="countdown"
        id="countdown">


        <div
            class="count-number"
            id="countNumber">

            10

        </div>


    </div>


</section>


<!-- =====================================================
     CONTROL
===================================================== -->

<section class="controls">


    <!--
        BETTING
        ↓
        WITHDRAW
    -->

    <button
        id="bettingBtn"
        class="betting-btn">

        BETTING

    </button>


    <!-- مقدار TON -->

    <div
        id="betPanel"
        class="bet-panel">


        <div class="bet-row">


            <input
                id="amountInput"
                class="amount"
                type="number"
                min="0.1"
                step="0.1"
                inputmode="decimal"
                placeholder="Amount TON">


            <button
                id="startBtn"
                class="start">

                START

            </button>


        </div>


        <div
            id="message"
            class="message">
        </div>


    </div>


</section>


<!-- =====================================================
     PLAYERS
===================================================== -->

<section class="players">


    <div class="players-head">

        <div>
            PLAYER
        </div>


        <div
            style="text-align:right">

            BET

        </div>


        <div
            style="text-align:right">

            VALUE

        </div>

    </div>


    <div
        id="playersList">
    </div>


</section>


</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
    document.getElementById(
        "balance"
    );

const bettingBtn =
    document.getElementById(
        "bettingBtn"
    );

const betPanel =
    document.getElementById(
        "betPanel"
    );

const amountInput =
    document.getElementById(
        "amountInput"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const multiplierEl =
    document.getElementById(
        "multiplier"
    );

const roundIdEl =
    document.getElementById(
        "roundId"
    );

const rocketWrap =
    document.getElementById(
        "rocketWrap"
    );

const explosion =
    document.getElementById(
        "explosion"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const countNumber =
    document.getElementById(
        "countNumber"
    );

const playersList =
    document.getElementById(
        "playersList"
    );


/* =====================================================
   BALANCE
===================================================== */

let balance =
    parseFloat(
        localStorage.getItem(
            "utruxRocketBalance"
        )
    );


if(
    !Number.isFinite(balance) ||
    balance < 0
){

    balance = 100;

}


function saveBalance(){

    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );

}


function updateBalance(){

    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();

}


updateBalance();


/* =====================================================
   STATE
===================================================== */

let phase =
    "idle";

let multiplier =
    1;

let crashPoint =
    0;

let roundNumber =
    0;

let roundTimer =
    null;

let bettingTimer =
    null;

let countdownTimer =
    null;

let hasBet =
    false;

let betAmount =
    0;


/* =====================================================
   TIMER CLEANUP
===================================================== */

function clearTimers(){

    if(
        roundTimer !== null
    ){

        clearInterval(
            roundTimer
        );

        roundTimer =
            null;

    }


    if(
        bettingTimer !== null
    ){

        clearInterval(
            bettingTimer
        );

        bettingTimer =
            null;

    }


    if(
        countdownTimer !== null
    ){

        clearInterval(
            countdownTimer
        );

        countdownTimer =
            null;

    }

}


/* =====================================================
   PLAYERS
===================================================== */

const names = [

    "Dark",
    "Nexus",
    "Hunter",
    "Titan",
    "Neo",
    "Storm",
    "Viper",
    "Alex",
    "Shadow",
    "Phoenix",
    "Nova",
    "Ghost",
    "Zero",
    "Wolf",
    "Blaze",
    "Lucky",
    "King",
    "Max"

];


let players = [];


/* =====================================================
   FAKE BET
===================================================== */

function fakeBet(){

    const r =
        Math.random();


    /*
        80%
        0.1 - 1
    */

    if(
        r < .80
    ){

        return (
            .1 +
            Math.random() * .9
        );

    }


    /*
        13%
        1 - 10
    */

    if(
        r < .93
    ){

        return (
            1 +
            Math.random() * 9
        );

    }


    /*
        5%
        10 - 100
    */

    if(
        r < .98
    ){

        return (
            10 +
            Math.random() * 90
        );

    }


    /*
        2%
        100 - 1000
    */

    return (
        100 +
        Math.random() * 900
    );

}


/* =====================================================
   FAKE CASHOUT
===================================================== */

function fakeCashoutPoint(){

    const r =
        Math.random();


    if(
        r < .18
    ){

        return (
            1.15 +
            Math.random() * .55
        );

    }


    if(
        r < .43
    ){

        return (
            1.70 +
            Math.random() * 1.10
        );

    }


    if(
        r < .68
    ){

        return (
            2.50 +
            Math.random() * 1.80
        );

    }


    if(
        r < .85
    ){

        return (
            4.50 +
            Math.random() * 3
        );

    }


    /*
        تا Crash می‌ماند
    */

    return null;

}


/* =====================================================
   CRASH POINT
===================================================== */

function generateCrash(){

    const r =
        Math.random();


    if(
        r < .40
    ){

        return (
            1 +
            Math.random() * .30
        );

    }


    if(
        r < .75
    ){

        return (
            1.30 +
            Math.random() * 1.20
        );

    }


    if(
        r < .845
    ){

        return (
            2.50 +
            Math.random() * 2.50
        );

    }


    if(
        r < .945
    ){

        return (
            5 +
            Math.random() * 2
        );

    }


    if(
        r < .95
    ){

        return (
            100 +
            Math.random() * 100
        );

    }


    return (
        7 +
        Math.random() * 18
    );

}


/* =====================================================
   CREATE PLAYERS
===================================================== */

function createPlayers(){

    players = [];


    const shuffled =
        [...names].sort(
            () =>
                Math.random() -
                .5
        );


    for(
        let i = 0;
        i < 7;
        i++
    ){

        players.push({

            name:
                shuffled[i],

            bet:
                fakeBet(),

            cashoutAt:
                fakeCashoutPoint(),

            cashed:false,

            crashed:false,

            finalMultiplier:0,

            finalValue:0

        });

    }

}


/* =====================================================
   RENDER PLAYERS
===================================================== */

function renderPlayers(){

    let html = "";


    /* USER */

    if(
        hasBet
    ){

        html += `

        <div class="player you">

            <div class="player-name">
                YOU
            </div>

            <div class="player-bet">
                ${betAmount.toFixed(2)}
            </div>

            <div
                class="player-value"
                id="userValue">

                ${(betAmount * multiplier).toFixed(2)}

            </div>

        </div>

        `;

    }


    /* FAKE */

    players.forEach(
        (
            player,
            index
        ) => {


            let rowClass =
                "player";


            if(
                player.cashed
            ){

                rowClass +=
                    " cashed";

            }


            if(
                player.crashed
            ){

                rowClass +=
                    " crashed";

            }


            let value;


            if(
                player.cashed
            ){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · "
                    +
                    player.finalMultiplier.toFixed(2)
                    +
                    "x";

            }


            else if(
                player.crashed
            ){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · CRASH";

            }


            else{

                value =
                    (
                        player.bet *
                        multiplier
                    ).toFixed(2);

            }


            html += `

            <div
                class="${rowClass}"
                data-row="${index}">

                <div class="player-name">

                    ${player.name}

                </div>


                <div class="player-bet">

                    ${player.bet.toFixed(2)}

                </div>


                <div
                    class="player-value"
                    data-value="${index}">

                    ${value}

                </div>

            </div>

            `;

        }
    );


    playersList.innerHTML =
        html;

}


/* =====================================================
   UPDATE ACTIVE PLAYERS
===================================================== */

function updatePlayers(){

    players.forEach(
        (
            player,
            index
        ) => {


            /*
                قبلاً برداشت کرده
                یا Crash شده:
                دیگر تغییر نکند.
            */

            if(
                player.cashed ||
                player.crashed
            ){

                return;

            }


            /*
                زمان برداشت فیک رسیده
            */

            if(
                player.cashoutAt !== null &&
                multiplier >=
                player.cashoutAt
            ){

                player.cashed =
                    true;


                player.finalMultiplier =
                    player.cashoutAt;


                player.finalValue =
                    player.bet *
                    player.cashoutAt;


                const row =
                    document.querySelector(
                        `[data-row="${index}"]`
                    );


                if(
                    row
                ){

                    row.classList.remove(
                        "active"
                    );

                    row.classList.add(
                        "cashed"
                    );

                }


                const valueEl =
                    document.querySelector(
                        `[data-value="${index}"]`
                    );


                if(
                    valueEl
                ){

                    valueEl.textContent =
                        player.finalValue
                            .toFixed(2)
                        +
                        " · "
                        +
                        player.finalMultiplier
                            .toFixed(2)
                        +
                        "x";

                }


                return;

            }


            /*
                هنوز فعال است
            */

            const valueEl =
                document.querySelector(
                    `[data-value="${index}"]`
                );


            if(
                valueEl
            ){

                valueEl.textContent =
                    (
                        player.bet *
                        multiplier
                    ).toFixed(2);

            }

        }
    );


    /*
        مقدار کاربر
    */

    if(
        hasBet
    ){

        const userValue =
            document.getElementById(
                "userValue"
            );


        if(
            userValue
        ){

            userValue.textContent =
                (
                    betAmount *
                    multiplier
                ).toFixed(2);

        }

    }

}


/* =====================================================
   BETTING BUTTON
===================================================== */

bettingBtn.addEventListener(
    "click",
    () => {


        /*
            اگر WITHDRAW است
        */

        if(
            hasBet
        ){

            withdraw();

            return;

        }


        /*
            اگر Betting نیست
        */

        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Wait for the next round.";

            return;

        }


        /*
            باز کردن پنل
        */

        betPanel.classList.toggle(
            "show"
        );


        if(
            betPanel.classList.contains(
                "show"
            )
        ){

            amountInput.focus();

        }

    }
);


/* =====================================================
   START BET
===================================================== */

startBtn.addEventListener(
    "click",
    () => {


        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Betting is closed.";

            return;

        }


        if(
            hasBet
        ){

            return;

        }


        let amount =
            parseFloat(
                amountInput.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.textContent =
                "Enter a valid amount.";

            return;

        }


        if(
            amount < .1
        ){

            message.textContent =
                "Minimum is 0.1 TON.";

            return;

        }


        amount =
            Math.round(
                amount * 100
            ) / 100;


        if(
            amount >
            balance + 0.000001
        ){

            message.textContent =
                "Not enough TON.";

            return;

        }


        /*
            کم کردن موجودی
        */

        balance -=
            amount;


        if(
            balance < 0
        ){

            balance = 0;

        }


        betAmount =
            amount;


        hasBet =
            true;


        updateBalance();


        /*
            پنل بسته شود
        */

        betPanel.classList.remove(
            "show"
        );


        /*
            BETTING -> WITHDRAW
        */

        bettingBtn.textContent =
            "WITHDRAW";


        bettingBtn.classList.add(
            "withdraw"
        );


        message.textContent =
            "";


        renderPlayers();

    }
);


/* =====================================================
   WITHDRAW
===================================================== */

function withdraw(){

    if(
        !hasBet
    ){

        return;

    }


    /*
        مقدار فعلی
    */

    const currentValue =
        betAmount *
        multiplier;


    /*
        افزایش موجودی دمو
    */

    balance +=
        currentValue;


    /*
        شرط بسته
    */

    hasBet =
        false;


    betAmount =
        0;


    updateBalance();


    /*
        دوباره BETTING
    */

    bettingBtn.textContent =
        "BETTING";


    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value =
        "";


    message.textContent =
        "Withdraw " +
        currentValue.toFixed(2) +
        " TON";


    renderPlayers();

}


/* =====================================================
   CRASH RESET USER
===================================================== */

/*
    طبق چیزی که گفتی:

    اگر کاربر تا Crash برداشت نکرده باشد،
    بعد از ترکیدن اصل مبلغ به موجودی دمو
    برمی‌گردد و همان لحظه دکمه
    دوباره BETTING می‌شود.
*/

function resetUserAfterCrash(){

    if(
        hasBet
    ){

        balance +=
            betAmount;

    }


    hasBet =
        false;


    betAmount =
        0;


    updateBalance();


    bettingBtn.textContent =
        "BETTING";


    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value =
        "";

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

    clearTimers();


    phase =
        "betting";


    roundNumber++;


    multiplier =
        1;


    crashPoint =
        generateCrash();


    /*
        UI reset
    */

    roundIdEl.textContent =
        "ROUND #" +
        roundNumber;


    multiplierEl.textContent =
        "1.00x";


    multiplierEl.classList.remove(
        "crashed"
    );


    statusEl.textContent =
        "BETTING OPEN";


    /*
        راکت:
        دوباره پایین چپ
    */

    rocketWrap.classList.remove(
        "entering"
    );

    rocketWrap.classList.remove(
        "hovering"
    );


    rocketWrap.style.opacity =
        "0";


    /*
        انفجار پاک
    */

    explosion.classList.remove(
        "active"
    );


    /*
        بازیکنان جدید
    */

    createPlayers();

    renderPlayers();


    /*
        Betting window
    */

    let seconds =
        5;


    bettingTimer =
        setInterval(
            () => {


                seconds--;


                if(
                    seconds <= 0
                ){

                    clearInterval(
                        bettingTimer
                    );

                    bettingTimer =
                        null;


                    startFlight();

                }

            },
            1000
        );

}


/* =====================================================
   START FLIGHT
===================================================== */

function startFlight(){

    if(
        phase !==
        "betting"
    ){

        return;

    }


    phase =
        "running";


    statusEl.textContent =
        "ROCKET FLYING";


    /*
        پنل مقدار بسته بماند
    */

    betPanel.classList.remove(
        "show"
    );


    /*
        اگر کاربر شرط ندارد،
        BETTING هنگام پرواز غیرفعال است.
    */

    if(
        !hasBet
    ){

        bettingBtn.disabled =
            true;

    }


    /*
        راکت هر دور:
        پایین چپ -> مرکز
    */

    rocketWrap.style.opacity =
        "1";


    requestAnimationFrame(
        () => {

            if(
                phase !==
                "running"
            ){

                return;

            }


            rocketWrap.classList.add(
                "entering"
            );

        }
    );


    /*
        بعد از رسیدن به مرکز
    */

    setTimeout(
        () => {

            if(
                phase ===
                "running"
            ){

                rocketWrap.classList.add(
                    "hovering"
                );

            }

        },
        1800
    );


    /*
        ==============================================
        SPEED
        ==============================================

        1.00 - 1.50
        0.035x / sec

        1.50 - 2.50
        0.06x / sec

        2.50 - 5
        0.08x / sec

        5 - 10
        0.10x / sec

        10+
        0.15x / sec
    */


    const tick =
        50;


    roundTimer =
        setInterval(
            () => {


                if(
                    phase !==
                    "running"
                ){

                    return;

                }


                let speedPerSecond;


                /*
                    1 -> 1.5
                */

                if(
                    multiplier < 1.5
                ){

                    speedPerSecond =
                        0.035;

                }


                /*
                    1.5 -> 2.5
                */

                else if(
                    multiplier < 2.5
                ){

                    speedPerSecond =
                        0.06;

                }


                /*
                    2.5 -> 5
                */

                else if(
                    multiplier < 5
                ){

                    speedPerSecond =
                        0.08;

                }


                /*
                    5 -> 10
                */

                else if(
                    multiplier < 10
                ){

                    speedPerSecond =
                        0.10;

                }


                /*
                    10+
                */

                else{

                    speedPerSecond =
                        0.15;

                }


                /*
                    تبدیل سرعت ثانیه‌ای
                    به مقدار هر Tick
                */

                multiplier +=
                    speedPerSecond *
                    (
                        tick /
                        1000
                    );


                /*
                    نمایش
                */

                multiplierEl.textContent =
                    multiplier.toFixed(2) +
                    "x";


                /*
                    بازیکن‌ها
                */

                updatePlayers();


                /*
                    Crash
                */

                if(
                    multiplier >=
                    crashPoint
                ){

                    crash();

                }


            },
            tick
        );

}


/* =====================================================
   CRASH
===================================================== */

function crash(){

    if(
        phase !==
        "running"
    ){

        return;

    }


    clearInterval(
        roundTimer
    );

    roundTimer =
        null;


    phase =
        "crashed";


    statusEl.textContent =
        "CRASH";


    multiplierEl.classList.add(
        "crashed"
    );


    /*
        کسانی که برداشت نکردند:
        قرمز شوند.
    */

    players.forEach(
        player => {

            if(
                !player.cashed
            ){

                player.crashed =
                    true;


                player.finalMultiplier =
                    multiplier;


                player.finalValue =
                    player.bet *
                    multiplier;

            }

        }
    );


    renderPlayers();


    /*
        اگر کاربر هنوز
        Withdraw نکرده باشد:

        اصل مبلغ دمو
        همان موقع برگردد.

        و دکمه بلافاصله
        BETTING شود.
    */

    resetUserAfterCrash();


    /*
        راکت از نمایش ناپدید
    */

    rocketWrap.style.opacity =
        "0";


    /*
        انفجار در مرکز
    */

    explosion.classList.remove(
        "active"
    );


    void explosion.offsetWidth;


    explosion.classList.add(
        "active"
    );


    /*
        بعد از انفجار countdown
    */

    setTimeout(
        startCountdown,
        900
    );

}


/* =====================================================
   COUNTDOWN 10 -> 1
===================================================== */

function startCountdown(){

    if(
        phase !==
        "crashed"
    ){

        return;

    }


    countdown.style.display =
        "flex";


    let number =
        10;


    countNumber.textContent =
        number;


    countdownTimer =
        setInterval(
            () => {


                number--;


                if(
                    number >= 1
                ){

                    countNumber.textContent =
                        number;


                    /*
                        انیمیشن دوباره
                    */

                    countNumber.style.animation =
                        "none";


                    void countNumber.offsetWidth;


                    countNumber.style.animation =
                        "countPop .65s ease";

                }


                else{

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer =
                        null;


                    countdown.style.display =
                        "none";


                    /*
                        دور بعد
                    */

                    startRound();

                }

            },
            1000
        );

}


/* =====================================================
   INITIAL
===================================================== */

startRound();

</script>
