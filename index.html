<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRAM CRASH - DEMO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 50% 20%,#172b55 0%,#091329 45%,#030711 100%);
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(3,8,20,.8);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#36a8ff;
}

.demo{
    color:#ffd45c;
    background:rgba(255,210,80,.1);
    border:1px solid rgba(255,210,80,.2);
    padding:8px 14px;
    border-radius:20px;
    font-size:12px;
}

.container{
    width:min(1100px,94%);
    margin:25px auto;
}

.topbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.box{
    background:rgba(10,20,42,.75);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:16px;
}

.label{
    color:#7f91b1;
    font-size:12px;
    margin-bottom:7px;
}

.balance{
    font-size:25px;
    font-weight:bold;
    color:#5fd6ff;
}

.game{
    position:relative;
    height:500px;
    overflow:hidden;
    border-radius:22px;
    background:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(#08172e,#030917);
    background-size:50px 50px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.multiplier{
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    text-align:center;
}

.number{
    font-size:clamp(55px,10vw,105px);
    font-weight:900;
    text-shadow:0 0 35px rgba(50,170,255,.4);
}

.number.crashed{
    color:#ff5265;
    text-shadow:0 0 35px rgba(255,60,80,.5);
}

.state{
    margin-top:7px;
    color:#8498b9;
    font-size:13px;
}

.plane{
    position:absolute;
    left:8%;
    bottom:12%;
    font-size:58px;
    transform:rotate(-12deg);
    z-index:4;
    filter:drop-shadow(0 0 15px rgba(60,180,255,.8));
    transition:left .05s linear,bottom .05s linear;
}

.plane::after{
    content:"";
    position:absolute;
    width:90px;
    height:8px;
    right:50px;
    top:30px;
    background:linear-gradient(
        90deg,
        transparent,
        #ffb52e,
        #fff
    );
    filter:blur(5px);
    border-radius:50%;
}

.explosion{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:100px;
    z-index:10;
    animation:boom .55s ease-out;
}

.explosion.show{
    display:block;
}

@keyframes boom{
    0%{
        transform:translate(-50%,-50%) scale(.2);
        opacity:0;
    }

    35%{
        transform:translate(-50%,-50%) scale(1.5);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(2.3);
        opacity:0;
    }
}

.controls{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

input{
    width:100%;
    height:55px;
    padding:0 16px;
    color:white;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#319cff;
}

button{
    height:55px;
    border:0;
    border-radius:14px;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.start{
    background:linear-gradient(135deg,#168cff,#5b55ff);
}

.cashout{
    background:linear-gradient(135deg,#00b879,#00d59a);
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

.history{
    margin-top:15px;
    padding:18px;
    background:rgba(10,20,42,.75);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
}

.history h3{
    font-size:14px;
    margin-bottom:12px;
}

.items{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.item{
    padding:8px 12px;
    border-radius:9px;
    background:rgba(255,255,255,.05);
    font-size:12px;
}

.low{
    color:#ff6878;
}

.high{
    color:#5be0a0;
}

.notice{
    text-align:center;
    color:#566985;
    font-size:11px;
    margin-top:18px;
}

@media(max-width:650px){

    header{
        padding:0 15px;
    }

    .topbar{
        grid-template-columns:1fr;
    }

    .game{
        height:420px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .plane{
        font-size:45px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        GRAM <span>CRASH</span>
    </div>

    <div class="demo">
        DEMO
    </div>

</header>


<div class="container">

    <div class="topbar">

        <div class="box">
            <div class="label">
                موجودی مجازی
            </div>

            <div class="balance">
                <span id="balance">100.00</span> GRAM
            </div>
        </div>


        <div class="box">
            <div class="label">
                وضعیت
            </div>

            <div id="status">
                آماده شروع
            </div>
        </div>

    </div>


    <div class="game" id="game">

        <div class="multiplier">

            <div
                class="number"
                id="multiplier"
            >
                1.00x
            </div>

            <div
                class="state"
                id="state"
            >
                برای شروع مقدار را وارد کنید
            </div>

        </div>


        <div
            class="plane"
            id="plane"
        >
            ✈️
        </div>


        <div
            class="explosion"
            id="explosion"
        >
            💥
        </div>

    </div>


    <div class="controls">

        <div>

            <input
                id="bet"
                type="number"
                min="0.01"
                step="0.01"
                value="10"
                placeholder="مقدار GRAM"
            >

            <button
                class="start"
                id="start"
                style="width:100%;margin-top:10px;"
            >
                شروع دور
            </button>

        </div>


        <div>

            <button
                class="cashout"
                id="cashout"
                disabled
                style="width:100%;"
            >
                برداشت
            </button>

        </div>

    </div>


    <div class="history">

        <h3>
            تاریخچه دورها
        </h3>

        <div
            class="items"
            id="history"
        ></div>

    </div>


    <div class="notice">
        این پروژه کاملاً آزمایشی است و GRAM موجود در آن هیچ ارزش واقعی ندارد.
    </div>

</div>


<script>

const balanceElement =
    document.getElementById("balance");

const betInput =
    document.getElementById("bet");

const startButton =
    document.getElementById("start");

const cashoutButton =
    document.getElementById("cashout");

const multiplierElement =
    document.getElementById("multiplier");

const stateElement =
    document.getElementById("state");

const statusElement =
    document.getElementById("status");

const plane =
    document.getElementById("plane");

const explosion =
    document.getElementById("explosion");

const historyElement =
    document.getElementById("history");


let balance =
    parseFloat(
        localStorage.getItem("gram_balance")
    );

if (isNaN(balance)) {

    balance = 100;

    localStorage.setItem(
        "gram_balance",
        balance
    );
}


let running = false;

let currentBet = 0;

let multiplier = 1;

let crashPoint = 0;

let startTime = 0;

let animationFrame = null;


function updateBalance(){

    balanceElement.textContent =
        balance.toFixed(2);

}


updateBalance();


function generateCrash(){

    const r = Math.random();

    if(r < .55)
        return 1.10 + Math.random()*1.2;

    if(r < .85)
        return 2.3 + Math.random()*2.5;

    if(r < .97)
        return 4.8 + Math.random()*6;

    return 10 + Math.random()*15;
}


function startGame(){

    if(running)
        return;


    const amount =
        parseFloat(betInput.value);


    if(
        isNaN(amount) ||
        amount <= 0
    ){

        alert("مقدار GRAM را درست وارد کنید.");

        return;
    }


    if(amount > balance){

        alert("موجودی GRAM کافی نیست.");

        return;
    }


    balance -= amount;

    updateBalance();


    currentBet = amount;

    crashPoint = generateCrash();

    multiplier = 1;

    startTime = performance.now();

    running = true;


    explosion.classList.remove("show");

    multiplierElement.classList.remove("crashed");

    plane.style.left = "8%";

    plane.style.bottom = "12%";


    stateElement.textContent =
        "در حال پرواز...";

    statusElement.textContent =
        "بازی در حال اجراست";


    startButton.disabled = true;

    cashoutButton.disabled = false;


    animationFrame =
        requestAnimationFrame(loop);

}


function loop(time){

    if(!running)
        return;


    const elapsed =
        (time - startTime) / 1000;


    multiplier =
        Math.exp(elapsed * .20);


    multiplierElement.textContent =
        multiplier.toFixed(2) + "x";


    const progress =
        Math.min(
            multiplier /
            Math.max(crashPoint,2),
            1
        );


    plane.style.left =
        (8 + progress * 78) + "%";


    plane.style.bottom =
        (12 + progress * 68) + "%";


    if(multiplier >= crashPoint){

        crash();

        return;
    }


    animationFrame =
        requestAnimationFrame(loop);

}


function crash(){

    running = false;

    cancelAnimationFrame(animationFrame);

    multiplier = crashPoint;


    multiplierElement.textContent =
        multiplier.toFixed(2) + "x";


    multiplierElement.classList.add("crashed");


    stateElement.textContent =
        "💥 جنگنده منفجر شد";


    statusElement.textContent =
        "دور تمام شد";


    cashoutButton.disabled = true;

    startButton.disabled = false;


    explosion.classList.remove("show");

    void explosion.offsetWidth;

    explosion.classList.add("show");


    addHistory(
        multiplier,
        false
    );


    currentBet = 0;

}


function cashout(){

    if(!running)
        return;


    const result =
        currentBet * multiplier;


    balance += result;

    updateBalance();


    stateElement.textContent =
        "✓ برداشت موفق: " +
        result.toFixed(2) +
        " GRAM";


    statusElement.textContent =
        "برداشت انجام شد";


    addHistory(
        multiplier,
        true
    );


    running = false;

    cancelAnimationFrame(
        animationFrame
    );


    cashoutButton.disabled = true;

    startButton.disabled = false;

    currentBet = 0;

}


function addHistory(value, won){

    const item =
        document.createElement("div");


    item.className =
        "item " +
        (value >= 2 ? "high" : "low");


    item.textContent =
        (won ? "✓ " : "💥 ") +
        value.toFixed(2) +
        "x";


    historyElement.prepend(item);


    while(
        historyElement.children.length > 12
    ){

        historyElement.removeChild(
            historyElement.lastChild
        );

    }

}


startButton.addEventListener(
    "click",
    startGame
);


cashoutButton.addEventListener(
    "click",
    cashout
);

</script>

</body>
</html>
