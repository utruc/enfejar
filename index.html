<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UTRUX — CRASH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#030811;
    --panel:#071321;
    --panel2:#0a1929;
    --blue:#1c9bea;
    --blue2:#1471c8;
    --text:#ffffff;
    --muted:#8292a5;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(
            circle at 50% 10%,
            #123052 0%,
            #071524 38%,
            #02060c 100%
        );
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1080px;
    margin:auto;
    padding:12px;
}

/* ================= HEADER ================= */

.header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.logo{
    font-size:26px;
    font-weight:950;
    letter-spacing:2px;
    direction:ltr;
}

.mode{
    position:absolute;
    left:18px;
    top:18px;

    direction:ltr;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;

    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09);

    padding:9px 14px;
    border-radius:11px;
}

/* ================= COIN ================= */

.balance{
    display:flex;
    align-items:center;
    gap:8px;
    direction:ltr;
}

.balance-number{
    font-size:23px;
    font-weight:950;
    line-height:1;
}

.coin{
    width:32px;
    height:32px;
    flex:none;

    filter:
        drop-shadow(0 0 8px rgba(33,190,255,.28));
}

.coin svg{
    width:100%;
    height:100%;
    display:block;
}

/* ================= GAME ================= */

.game{
    position:relative;
    height:450px;
    overflow:hidden;

    border-radius:23px;

    background:
        linear-gradient(
            180deg,
            rgba(16,38,63,.78),
            rgba(2,9,17,.97)
        );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        inset 0 0 100px rgba(0,0,0,.3);
}

.game::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    pointer-events:none;
}

.game::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:150px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.35)
        );

    pointer-events:none;
}

/* ================= MULTIPLIER ================= */

.multiplier{
    position:absolute;
    z-index:30;

    top:24px;
    left:50%;

    transform:translateX(-50%);

    font-size:55px;
    font-weight:950;

    direction:ltr;

    text-shadow:
        0 5px 25px rgba(0,0,0,.7);
}

.status{
    position:absolute;
    z-index:30;

    top:91px;
    left:50%;

    transform:translateX(-50%);

    color:#9aaaba;

    font-size:14px;
}

/* ================= JET ================= */

/*
   جنگنده کاملاً خیالی و مخصوص بازی
*/

.jet{
    position:absolute;

    width:128px;
    height:72px;

    left:20px;
    bottom:18px;

    z-index:15;

    transform-origin:center;
    transition:none;
}

.jet-body{
    position:absolute;

    left:28px;
    top:29px;

    width:82px;
    height:17px;

    background:
        linear-gradient(
            180deg,
            #e8eef3 0%,
            #9ba8b3 45%,
            #4f5c68 100%
        );

    border-radius:
        65% 15% 15% 65%;

    transform:skewX(-12deg);

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.5),
        0 5px 8px rgba(0,0,0,.4);
}

.jet-nose{
    position:absolute;

    right:4px;
    top:29px;

    width:35px;
    height:17px;

    background:
        linear-gradient(
            180deg,
            #e9eef2,
            #75828d
        );

    clip-path:
        polygon(
            0 0,
            100% 50%,
            0 100%
        );
}

.jet-wing-top{
    position:absolute;

    left:41px;
    top:14px;

    width:70px;
    height:32px;

    background:
        linear-gradient(
            135deg,
            #9ba8b3,
            #4d5965
        );

    clip-path:
        polygon(
            0 100%,
            100% 0,
            62% 100%
        );
}

.jet-wing-bottom{
    position:absolute;

    left:39px;
    top:39px;

    width:66px;
    height:28px;

    background:
        linear-gradient(
            135deg,
            #66737f,
            #3b4651
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            58% 100%
        );
}

.jet-tail{
    position:absolute;

    left:27px;
    top:12px;

    width:25px;
    height:38px;

    background:
        linear-gradient(
            135deg,
            #7c8994,
            #414c57
        );

    clip-path:
        polygon(
            0 100%,
            50% 0,
            100% 100%
        );
}

.jet-tail2{
    position:absolute;

    left:20px;
    top:31px;

    width:25px;
    height:13px;

    background:#424e59;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%
        );
}

.jet-window{
    position:absolute;

    left:68px;
    top:30px;

    width:22px;
    height:8px;

    background:
        linear-gradient(
            90deg,
            #091b2d,
            #245d82
        );

    border-radius:70%;

    transform:skewX(-15deg);

    box-shadow:
        inset 0 1px rgba(255,255,255,.35);
}

.jet-detail{
    position:absolute;

    left:53px;
    top:40px;

    width:25px;
    height:3px;

    background:#26333f;

    border-radius:10px;
}

.flame{
    position:absolute;

    left:3px;
    top:33px;

    width:34px;
    height:13px;

    background:
        linear-gradient(
            90deg,
            #ffbd00,
            #ff5a00,
            transparent
        );

    clip-path:
        polygon(
            0 50%,
            100% 0,
            72% 50%,
            100% 100%
        );

    animation:flame .08s infinite alternate;
}

@keyframes flame{
    from{
        transform:scaleX(.72);
    }
    to{
        transform:scaleX(1.18);
    }
}

/* ================= EXPLOSION ================= */

.explosion{
    position:absolute;

    width:135px;
    height:135px;

    display:none;

    z-index:40;

    transform:translate(-50%,-50%);
}

.explosion.show{
    display:block;
    animation:explode .85s forwards;
}

.explosion::before{
    content:"";

    position:absolute;
    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0 7%,
            #fff000 8% 22%,
            #ff8200 23% 47%,
            #f32d00 48% 65%,
            transparent 66%
        );
}

.explosion::after{
    content:"";

    position:absolute;

    inset:-35px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            transparent 28%,
            rgba(255,120,0,.5) 29%,
            transparent 55%
        );
}

@keyframes explode{
    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.25);
    }

    45%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.55);
    }
}

/* ================= CONTROLS ================= */

.controls{
    margin-top:12px;

    padding:13px;

    border-radius:18px;

    background:rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.control-row{
    display:flex;
    gap:9px;
}

.amount-box{
    flex:1;
}

.amount-box input{
    width:100%;
    height:49px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:13px;

    background:#081321;

    color:white;

    outline:none;

    padding:0 14px;

    font-size:17px;

    direction:ltr;
}

.amount-box input:focus{
    border-color:#238bd1;
}

.join{
    height:49px;

    border:0;

    border-radius:13px;

    padding:0 23px;

    background:
        linear-gradient(
            135deg,
            #168bd9,
            #175fb7
        );

    color:white;

    font-weight:900;

    cursor:pointer;

    white-space:nowrap;
}

.join:active{
    transform:scale(.97);
}

.join:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.info{
    display:flex;
    justify-content:space-between;

    align-items:center;

    margin-top:10px;

    color:#8393a5;

    font-size:12px;
}

.your-entry{
    color:#4fc5ff;
}

/* ================= PLAYERS ================= */

.players{
    margin-top:12px;

    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.players-head{
    padding:14px;

    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.player{
    height:55px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);
}

.player:last-child{
    border-bottom:0;
}

.player-name{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:32px;
    height:32px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #263f5c,
            #101b29
        );

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:11px;

    font-weight:900;
}

.me .avatar{
    background:
        linear-gradient(
            135deg,
            #168bd8,
            #194d98
        );
}

.amount{
    direction:ltr;

    display:flex;

    align-items:center;

    gap:6px;

    font-weight:850;
}

.mini-coin{
    width:20px;
    height:20px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .app{
        padding:9px;
    }

    .header{
        height:58px;
    }

    .logo{
        font-size:21px;
    }

    .balance-number{
        font-size:20px;
    }

    .coin{
        width:28px;
        height:28px;
    }

    .mode{
        left:12px;
        top:12px;
        font-size:11px;
        padding:8px 11px;
    }

    .game{
        height:390px;
    }

    .multiplier{
        font-size:44px;
    }

    .control-row{
        flex-direction:column;
    }

    .join{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            UTRUX
        </div>

        <div class="balance">

            <span
                class="balance-number"
                id="balance"
            >
                100
            </span>

            <!-- TON / GRAM COIN ICON -->
            <div class="coin">

                <svg
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <defs>

                        <linearGradient
                            id="coinGradient"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop
                                offset="0"
                                stop-color="#78e7ff"
                            />

                            <stop
                                offset=".45"
                                stop-color="#24aee8"
                            />

                            <stop
                                offset="1"
                                stop-color="#0870b9"
                            />
                        </linearGradient>

                        <linearGradient
                            id="shine"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop
                                offset="0"
                                stop-color="#ffffff"
                                stop-opacity=".7"
                            />

                            <stop
                                offset=".5"
                                stop-color="#ffffff"
                                stop-opacity="0"
                            />
                        </linearGradient>

                    </defs>

                    <circle
                        cx="50"
                        cy="50"
                        r="46"
                        fill="#064c80"
                    />

                    <circle
                        cx="50"
                        cy="47"
                        r="42"
                        fill="url(#coinGradient)"
                    />

                    <circle
                        cx="50"
                        cy="47"
                        r="35"
                        fill="none"
                        stroke="#b8f3ff"
                        stroke-opacity=".35"
                        stroke-width="2"
                    />

                    <!-- stylized TON symbol -->
                    <path
                        d="
                        M31 29
                        H69
                        L61 44
                        L50 67
                        L39 44
                        Z
                        "
                        fill="none"
                        stroke="white"
                        stroke-width="5"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M31 29 L50 67 L69 29"
                        fill="none"
                        stroke="white"
                        stroke-width="4"
                        stroke-linejoin="round"
                    />

                    <ellipse
                        cx="34"
                        cy="24"
                        rx="20"
                        ry="9"
                        fill="url(#shine)"
                        opacity=".45"
                        transform="rotate(-25 34 24)"
                    />

                </svg>

            </div>

        </div>

        <div class="mode">
            CRASH
        </div>

    </header>


    <!-- GAME -->
    <main
        class="game"
        id="game"
    >

        <div
            class="multiplier"
            id="multiplier"
        >
            1.00x
        </div>

        <div
            class="status"
            id="status"
        >
            در انتظار شروع...
        </div>


        <!-- FICTIONAL REALISTIC-STYLE FIGHTER -->
        <div
            class="jet"
            id="jet"
        >

            <div class="flame"></div>

            <div class="jet-tail"></div>

            <div class="jet-tail2"></div>

            <div class="jet-wing-top"></div>

            <div class="jet-wing-bottom"></div>

            <div class="jet-body"></div>

            <div class="jet-nose"></div>

            <div class="jet-window"></div>

            <div class="jet-detail"></div>

        </div>


        <div
            class="explosion"
            id="explosion"
        ></div>

    </main>


    <!-- ENTRY -->
    <section class="controls">

        <div class="control-row">

            <div class="amount-box">

                <input
                    id="amount"
                    type="number"
                    min="1"
                    step="1"
                    value="10"
                    placeholder="مقدار"
                >

            </div>

            <button
                class="join"
                id="join"
            >
                ورود به دور
            </button>

        </div>

        <div class="info">

            <span id="roundInfo">
                دور بعدی به‌زودی
            </span>

            <span
                class="your-entry"
                id="entryText"
            >
                بدون ورود
            </span>

        </div>

    </section>


    <!-- PLAYERS -->
    <section class="players">

        <div class="players-head">
            بازیکنان
        </div>

        <div id="playersList"></div>

    </section>

</div>


<script>

/* ================= ELEMENTS ================= */

const balanceEl =
    document.getElementById("balance");

const amountEl =
    document.getElementById("amount");

const joinBtn =
    document.getElementById("join");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const jetEl =
    document.getElementById("jet");

const explosionEl =
    document.getElementById("explosion");

const playersList =
    document.getElementById("playersList");

const entryText =
    document.getElementById("entryText");

const roundInfo =
    document.getElementById("roundInfo");


/* ================= BALANCE ================= */

/*
   اگر کاربر اولین بار وارد شود:
   100 TON دریافت می‌کند.
*/

let balance =
    Number(
        localStorage.getItem(
            "utruxBalance"
        )
    );

if(
    !Number.isFinite(balance) ||
    localStorage.getItem("utruxStarted") !== "yes"
){

    balance = 100;

    localStorage.setItem(
        "utruxStarted",
        "yes"
    );

    localStorage.setItem(
        "utruxBalance",
        "100"
    );
}


let joinedAmount = 0;

let running = false;

let multiplier = 1;

let crashPoint = 1.2;

let animationFrame = null;


/* ================= RANDOM NAMES ================= */

const namePool = [

    "Shadow",
    "DarkX",
    "Ali",
    "Armin",
    "Nima",
    "Ghost",
    "Wolf",
    "Dragon",
    "Hunter",
    "Phoenix",
    "Neo",
    "Titan",
    "Viper",
    "Storm",
    "Rex",
    "Night",
    "Zero",
    "Cyber",
    "Max",
    "Legend",
    "Nova",
    "Blaze",
    "Alpha",
    "Omega",
    "Killer",
    "Master",
    "Sina",
    "Amir",
    "Reza",
    "Sam"

];


/* ================= SAVE ================= */

function saveBalance(){

    localStorage.setItem(
        "utruxBalance",
        String(balance)
    );

    balanceEl.textContent =
        Math.floor(balance);
}


/* ================= RANDOM ================= */

function randomNumber(min,max){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


/* ================= NEW PLAYERS ================= */

let currentPlayers = [];


function createPlayers(){

    const shuffled =
        [...namePool]
        .sort(
            () => Math.random() - .5
        );

    currentPlayers = [];

    for(let i=0;i<7;i++){

        currentPlayers.push({

            name:shuffled[i],

            base:randomNumber(3,35),

            current:0

        });

    }

}


/* ================= CRASH POINT ================= */

function generateCrash(){

    const r =
        Math.random();

    /*
       40% → 1.00 - 1.30
    */

    if(r < .40){

        return (
            1.00 +
            Math.random() * .30
        );

    }


    /*
       35% → 1.30 - 2.50
    */

    if(r < .75){

        return (
            1.30 +
            Math.random() * 1.20
        );

    }


    /*
       9.5% → 2.50 - 5
    */

    if(r < .845){

        return (
            2.50 +
            Math.random() * 2.50
        );

    }


    /*
       10% → 5 - 7
    */

    if(r < .945){

        return (
            5 +
            Math.random() * 2
        );

    }


    /*
       مقادیر بالاتر
    */

    if(
        Math.random() < .091
    ){

        return (
            100 +
            Math.random() * 100
        );

    }

    return (
        7 +
        Math.random() * 18
    );
}


/* ================= PLAYER LIST ================= */

function renderPlayers(){

    let html = "";


    /*
       USER
    */

    html += `

        <div class="player me">

            <div class="player-name">

                <div class="avatar">
                    U
                </div>

                <span>
                    شما
                </span>

            </div>

            <div
                class="amount"
                id="myAmount"
            >

                ${joinedAmount > 0
                    ? joinedAmount.toFixed(2)
                    : "—"
                }

                <svg
                    class="mini-coin"
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <circle
                        cx="50"
                        cy="50"
                        r="44"
                        fill="#20aee8"
                    />

                    <path
                        d="M31 29H69L61 44L50 67L39 44Z"
                        fill="none"
                        stroke="white"
                        stroke-width="6"
                    />

                </svg>

            </div>

        </div>

    `;


    /*
       FAKE PLAYERS
    */

    currentPlayers.forEach(
        (player,index) => {

            html += `

            <div
                class="player"
                data-player="${index}"
            >

                <div class="player-name">

                    <div class="avatar">

                        ${player.name
                            .charAt(0)
                            .toUpperCase()
                        }

                    </div>

                    <span>
                        ${player.name}
                    </span>

                </div>

                <div
                    class="amount player-amount"
                    id="playerAmount${index}"
                >

                    ${player.base.toFixed(2)}

                    <svg
                        class="mini-coin"
                        viewBox="0 0 100 100"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <circle
                            cx="50"
                            cy="50"
                            r="44"
                            fill="#20aee8"
                        />

                        <path
                            d="M31 29H69L61 44L50 67L39 44Z"
                            fill="none"
                            stroke="white"
                            stroke-width="6"
                        />

                    </svg>

                </div>

            </div>

            `;

        }
    );


    playersList.innerHTML =
        html;

}


/* ================= UPDATE PLAYERS ================= */

function updatePlayerValues(){

    currentPlayers.forEach(
        (player,index) => {

            /*
              رشد نمایشی همراه ضریب
            */

            const value =
                player.base *
                multiplier;

            player.current =
                value;

            const element =
                document.getElementById(
                    "playerAmount" + index
                );

            if(element){

                const coin =
                    element.querySelector(
                        ".mini-coin"
                    );

                element.textContent =
                    value.toFixed(2);

                if(coin){

                    element.appendChild(
                        coin
                    );

                }

            }

        }
    );


    /*
       مقدار بازیکن خودمان
       فقط مقدار نمایش داده‌شده
    */

    const myAmount =
        document.getElementById(
            "myAmount"
        );

    if(
        myAmount &&
        joinedAmount > 0
    ){

        const coin =
            myAmount.querySelector(
                ".mini-coin"
            );

        myAmount.textContent =
            (
                joinedAmount *
                multiplier
            ).toFixed(2);

        if(coin){

            myAmount.appendChild(
                coin
            );

        }

    }

}


/* ================= JOIN ================= */

joinBtn.addEventListener(
    "click",
    () => {

        if(running){

            alert(
                "این دور شروع شده؛ برای دور بعد وارد شوید."
            );

            return;
        }


        const amount =
            Number(
                amountEl.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            alert(
                "یک مقدار معتبر وارد کن."
            );

            return;
        }


        if(amount > balance){

            alert(
                "موجودی کافی نیست."
            );

            return;
        }


        /*
           فقط ثبت مقدار نمایشی دور
        */

        if(joinedAmount > 0){

            balance +=
                joinedAmount;

        }


        balance -= amount;

        joinedAmount =
            amount;

        saveBalance();


        entryText.textContent =
            `ورود: ${amount} TON`;


        renderPlayers();

    }
);


/* ================= RESET ================= */

function resetEntry(){

    if(joinedAmount > 0){

        balance +=
            joinedAmount;

        joinedAmount = 0;

        saveBalance();

    }


    entryText.textContent =
        "بدون ورود";

}


/* ================= JET ================= */

function animateJet(){

    const game =
        document.getElementById(
            "game"
        );

    const gameWidth =
        game.clientWidth;

    const gameHeight =
        game.clientHeight;


    const maxX =
        gameWidth - 145;

    const maxY =
        gameHeight - 120;


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (multiplier - 1) /
                Math.max(
                    .5,
                    crashPoint - 1
                )
            )
        );


    const x =
        20 +
        progress * maxX;


    const y =
        gameHeight -
        60 -
        progress * maxY;


    jetEl.style.left =
        x + "px";


    jetEl.style.bottom =
        (
            gameHeight -
            y -
            50
        ) + "px";

}


/* ================= START ================= */

function startRound(){

    running = true;

    multiplier = 1;

    crashPoint =
        generateCrash();


    createPlayers();

    renderPlayers();


    explosionEl.classList.remove(
        "show"
    );


    jetEl.style.display =
        "block";

    jetEl.style.left =
        "20px";

    jetEl.style.bottom =
        "18px";


    statusEl.textContent =
        "در حال پرواز...";


    roundInfo.textContent =
        "دور در حال اجرا";


    joinBtn.disabled =
        true;


    const start =
        performance.now();


    function frame(now){

        if(!running){

            return;
        }


        const elapsed =
            (now - start) /
            1000;


        multiplier =
            Math.pow(
                1.115,
                elapsed
            );


        multiplier =
            Math.max(
                1,
                multiplier
            );


        multiplierEl.textContent =
            multiplier.toFixed(2) +
            "x";


        animateJet();

        updatePlayerValues();


        if(
            multiplier >=
            crashPoint
        ){

            crash();

            return;
        }


        animationFrame =
            requestAnimationFrame(
                frame
            );

    }


    animationFrame =
        requestAnimationFrame(
            frame
        );

}


/* ================= CRASH ================= */

function crash(){

    running = false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    multiplierEl.textContent =
        crashPoint.toFixed(2) +
        "x";


    statusEl.textContent =
        "CRASH";


    const rect =
        jetEl.getBoundingClientRect();


    const gameRect =
        document
        .getElementById("game")
        .getBoundingClientRect();


    explosionEl.style.left =
        (
            rect.left -
            gameRect.left +
            rect.width / 2
        ) + "px";


    explosionEl.style.top =
        (
            rect.top -
            gameRect.top +
            rect.height / 2
        ) + "px";


    explosionEl.classList.remove(
        "show"
    );


    void explosionEl.offsetWidth;


    explosionEl.classList.add(
        "show"
    );


    jetEl.style.display =
        "none";


    joinBtn.disabled =
        true;


    let seconds = 10;


    roundInfo.textContent =
        `دور بعدی ${seconds} ثانیه دیگر`;


    const timer =
        setInterval(
            () => {

                seconds--;


                if(seconds > 0){

                    roundInfo.textContent =
                        `دور بعدی ${seconds} ثانیه دیگر`;

                }
                else{

                    clearInterval(timer);


                    resetEntry();


                    multiplierEl.textContent =
                        "1.00x";


                    statusEl.textContent =
                        "در انتظار شروع...";


                    roundInfo.textContent =
                        "دور جدید شروع شد";


                    joinBtn.disabled =
                        false;


                    startRound();

                }

            },
            1000
        );

}


/* ================= INITIAL ================= */

saveBalance();

createPlayers();

renderPlayers();


/*
   شروع خودکار اولین دور
*/

setTimeout(
    () => {

        startRound();

    },
    1200
);

</script>
