<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050b14">

<title>UTRUX ROCKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050b14;
    --bg2:#02060c;
    --panel:#0a1625;
    --line:rgba(255,255,255,.07);

    --blue:#278cff;
    --blue2:#5ab1ff;

    --green:#20d486;
    --green2:#57efaa;

    --red:#ff4f68;
    --red2:#ff7889;

    --yellow:#ffc94d;

    --muted:#7c8ca2;
}

html,
body{
    min-height:100%;
}

body{
    min-height:100vh;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -15%,
            #1b416f 0%,
            transparent 43%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );

    overflow-x:hidden;
}

button,
input{
    font:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    background:
        rgba(3,9,17,.94);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:
        blur(18px);

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;

    padding:
        7px
        12px;

    border-radius:50px;

    background:#0d1928;

    border:
        1px solid
        rgba(255,255,255,.06);

    font-size:15px;
    font-weight:900;
}


/* =====================================================
   TON COIN

   لوگوی هندسی شبیه TON
   و دیگر T ساده ندارد.
===================================================== */

.coin{
    width:23px;
    height:23px;
    flex:none;
}

.container{
    width:min(900px,100%);
    margin:auto;
    padding:12px;
}


/* =====================================================
   GAME
===================================================== */

.game{
    position:relative;

    width:100%;
    height:480px;

    overflow:hidden;

    border-radius:23px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 50% 52%,
            rgba(39,140,255,.19),
            transparent 36%
        ),
        linear-gradient(
            180deg,
            #08192d,
            #040a12
        );
}


/* =====================================================
   STARS
===================================================== */

.stars{
    position:absolute;
    inset:0;

    opacity:.21;

    background-image:
        radial-gradient(
            circle,
            #fff 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            #5eb4ff 1px,
            transparent 1px
        );

    background-size:
        89px 93px,
        143px 127px;

    background-position:
        10px 20px,
        43px 62px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
    position:absolute;

    left:-20%;
    right:-20%;

    bottom:-130px;

    height:340px;

    opacity:.13;

    transform:
        perspective(380px)
        rotateX(58deg);

    background-image:

        linear-gradient(
            rgba(39,140,255,.6)
            1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(39,140,255,.6)
            1px,
            transparent 1px
        );

    background-size:
        45px 45px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    position:absolute;

    top:18px;
    left:50%;

    transform:
        translateX(-50%);

    color:
        var(--muted);

    font-size:11px;

    font-weight:900;

    letter-spacing:1.5px;

    z-index:30;

    white-space:nowrap;
}


/* =====================================================
   CENTER MULTIPLIER
===================================================== */

.multiplier{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:76px;

    font-weight:900;

    line-height:1;

    letter-spacing:-3px;

    color:#fff;

    z-index:35;

    text-shadow:
        0 0 25px
        rgba(39,140,255,.25),

        0 0 60px
        rgba(39,140,255,.13);
}

.multiplier.crashed{
    color:
        var(--red);

    text-shadow:
        0 0 30px
        rgba(255,79,104,.55),

        0 0 60px
        rgba(255,79,104,.2);
}


/* =====================================================
   ROCKET
===================================================== */

/*
    شروع واقعی:
    پایین چپ

    سپس:
    پایین چپ -> مرکز

    بعد:
    در مرکز می‌ماند
*/

.rocket-wrap{

    position:absolute;

    left:50%;
    top:50%;

    width:120px;
    height:120px;

    z-index:25;

    opacity:0;

    transform:
        translate(-50%,-50%)
        translate(-340px,185px);

    transition:
        transform 1.8s
        cubic-bezier(.18,.82,.22,1),

        opacity .35s;
}


/*
    حرکت از پایین چپ به مرکز
*/

.rocket-wrap.fly{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translate(0,0);
}


/*
    وقتی به مرکز رسید
*/

.rocket-wrap.hover{

    opacity:1;
}


.rocket-flight{

    width:100%;
    height:100%;

    transform-origin:center;
}


/*
    لرزش ظریف در مرکز
*/

.rocket-wrap.hover .rocket-flight{

    animation:
        rocketFloat
        .75s
        ease-in-out
        infinite;
}


/* =====================================================
   ROCKET BODY
===================================================== */

.rocket{

    position:absolute;

    left:39px;
    top:22px;

    width:42px;
    height:91px;

    border-radius:
        50%
        50%
        44%
        44%;

    /*
        راکت به سمت بالا راست
    */

    transform:
        rotate(35deg);

    background:
        linear-gradient(
            90deg,
            #70879b 0%,
            #edf6ff 35%,
            #fff 54%,
            #8399aa 100%
        );

    box-shadow:

        inset
        -6px
        0
        10px
        rgba(0,0,0,.2),

        0
        0
        22px
        rgba(255,255,255,.12);
}


/*
    nose
*/

.rocket::before{

    content:"";

    position:absolute;

    left:0;
    top:-18px;

    width:42px;
    height:37px;

    border-radius:
        50%
        50%
        19%
        19%;

    background:
        linear-gradient(
            90deg,
            #91a6b7,
            #fff 50%,
            #8196a8
        );
}


/*
    پنجره
*/

.window{

    position:absolute;

    width:17px;
    height:17px;

    left:12px;
    top:21px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e7f8ff,
            #268fff 45%,
            #064b91
        );

    border:
        3px solid
        #526a81;

    box-shadow:
        0 0 13px
        rgba(38,140,255,.9);
}


/*
    بدنه
*/

.body-line{

    position:absolute;

    width:4px;
    height:57px;

    left:19px;
    top:17px;

    border-radius:10px;

    background:
        rgba(80,110,135,.32);
}


/*
    بال چپ
*/

.fin-left{

    position:absolute;

    left:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            135deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}


/*
    بال راست
*/

.fin-right{

    position:absolute;

    right:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            225deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}


/*
    موتور
*/

.engine{

    position:absolute;

    left:8px;
    bottom:-9px;

    width:26px;
    height:17px;

    border-radius:
        0 0 12px 12px;

    background:#354b60;
}


/*
    شعله موتور
*/

.flame{

    position:absolute;

    left:8px;
    bottom:-65px;

    width:27px;
    height:67px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe15a 20%,
            #ff9c21 52%,
            #ff3d5d
        );

    clip-path:
        polygon(
            50% 100%,
            5% 35%,
            30% 48%,
            39% 0,
            61% 48%,
            95% 35%
        );

    filter:
        drop-shadow(
            0 0 13px
            #ff7b28
        );

    animation:
        flame .07s
        infinite
        alternate;
}


/* =====================================================
   ROCKET ANIMATION
===================================================== */

@keyframes rocketFloat{

    0%{
        transform:
            translate(0,1px)
            rotate(-1deg);
    }

    25%{
        transform:
            translate(2px,-3px)
            rotate(.6deg);
    }

    50%{
        transform:
            translate(1px,-6px)
            rotate(1deg);
    }

    75%{
        transform:
            translate(-2px,-2px)
            rotate(-.6deg);
    }

    100%{
        transform:
            translate(0,1px)
            rotate(-1deg);
    }
}


@keyframes flame{

    from{
        transform:
            scaleY(.88);
    }

    to{
        transform:
            scaleY(1.12);
    }
}


/* =====================================================
   EXPLOSION
===================================================== */

.explosion{

    position:absolute;

    left:50%;
    top:50%;

    width:205px;
    height:205px;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    border-radius:50%;

    z-index:70;

    background:
        radial-gradient(
            circle,
            #fff 0 5%,
            #ffe56c 8%,
            #ff9d22 25%,
            #ff4e3d 45%,
            rgba(255,55,65,.15) 67%,
            transparent 73%
        );
}

.explosion.active{

    animation:
        explode
        .9s
        ease-out
        forwards;
}

@keyframes explode{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    45%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.9);
    }
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(2,7,13,.52);

    backdrop-filter:
        blur(5px);

    z-index:90;
}

.count-number{

    font-size:145px;

    font-weight:900;

    text-shadow:
        0 0 55px
        rgba(39,140,255,.75);
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    margin-top:10px;
}


/*
    BETTING
    سپس WITHDRAW
*/

.betting-btn{

    width:100%;

    border:0;

    border-radius:15px;

    padding:17px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #268cff,
            #1767ca
        );

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 28px
        rgba(38,140,255,.18);

    transition:
        transform .15s,
        opacity .15s;
}

.betting-btn:active{

    transform:
        scale(.99);
}

.betting-btn.withdraw{

    background:
        linear-gradient(
            135deg,
            #ffc94d,
            #e89a13
        );

    color:#241700;
}

.betting-btn:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* =====================================================
   INPUT
===================================================== */

.bet-panel{

    display:none;

    margin-top:8px;

    padding:13px;

    border-radius:16px;

    background:
        #0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.bet-panel.show{

    display:block;
}

.bet-row{

    display:flex;

    gap:8px;
}

.amount{

    flex:1;

    min-width:0;

    padding:14px;

    border-radius:11px;

    border:
        1px solid
        #263c55;

    outline:none;

    color:white;

    background:#050c15;

    font-weight:800;
}

.amount:focus{

    border-color:
        var(--blue);
}

.start{

    min-width:100px;

    border:0;

    border-radius:11px;

    background:
        var(--green);

    color:#03140c;

    font-weight:900;

    cursor:pointer;
}

.message{

    min-height:20px;

    padding-top:8px;

    text-align:center;

    font-size:12px;

    color:var(--muted);
}


/* =====================================================
   PLAYERS
===================================================== */

.players{

    margin-top:10px;

    overflow:hidden;

    border-radius:18px;

    background:
        #0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.players-head,
.player{

    display:grid;

    grid-template-columns:
        1fr
        95px
        125px;

    gap:8px;

    align-items:center;

    padding:
        13px
        14px;
}

.players-head{

    color:
        #617087;

    font-size:10px;

    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.player{

    font-size:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);

    transition:
        background .25s,
        color .25s;
}

.player:last-child{

    border-bottom:0;
}


/* YOU */

.player.you{

    background:
        rgba(38,140,255,.08);
}


/* GREEN */

.player.cashed{

    background:
        rgba(32,212,134,.10);
}

.player.cashed .player-name,
.player.cashed .player-value{

    color:
        var(--green2);
}


/* RED */

.player.crashed{

    background:
        rgba(255,77,100,.10);
}

.player.crashed .player-name,
.player.crashed .player-value{

    color:
        var(--red2);
}


.player-name{

    font-weight:900;
}

.player-bet{

    color:#a4b1c0;

    text-align:right;
}

.player-value{

    color:
        var(--blue2);

    text-align:right;

    font-weight:900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .game{
        height:425px;
    }

    .multiplier{
        font-size:58px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{

        grid-template-columns:
            1fr
            72px
            105px;

        padding:
            12px
            10px;

        font-size:11px;
    }

}
</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        UTRUX
    </div>


    <div class="balance">

        <span id="balance">
            100.00
        </span>


        <!-- TON -->

        <svg
            class="coin"
            viewBox="0 0 100 100"
            aria-label="TON">

            <defs>

                <linearGradient
                    id="tonBlue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0%"
                        stop-color="#38a9ff"/>

                    <stop
                        offset="100%"
                        stop-color="#0874d8"/>

                </linearGradient>

            </defs>


            <circle
                cx="50"
                cy="50"
                r="47"
                fill="url(#tonBlue)"/>


            <!--
                شکل هندسی TON
                به جای T ساده
            -->

            <path
                d="
                    M22 29
                    L37 29
                    L50 51
                    L63 29
                    L78 29
                    L50 76
                    Z
                "
                fill="#ffffff"/>


            <path
                d="
                    M37 29
                    L50 51
                    L50 76
                    L22 29
                    Z
                "
                fill="#dcefff"/>


            <path
                d="
                    M63 29
                    L50 51
                    L50 76
                    L78 29
                    Z
                "
                fill="#b9ddff"/>

        </svg>

    </div>

</header>


<main class="container">


<!-- =====================================================
     GAME
===================================================== -->

<section class="game">


    <div class="stars"></div>

    <div class="grid"></div>


    <div
        class="status"
        id="status">

        BETTING OPEN

    </div>


    <!-- همیشه وسط -->

    <div
        class="multiplier"
        id="multiplier">

        1.00x

    </div>


    <!-- =================================================
         ROCKET
    ================================================== -->

    <div
        class="rocket-wrap"
        id="rocketWrap">


        <div class="rocket-flight">


            <div class="rocket">


                <div
                    class="body-line">
                </div>


                <div
                    class="window">
                </div>


                <div
                    class="fin-left">
                </div>


                <div
                    class="fin-right">
                </div>


                <div
                    class="engine">
                </div>


                <div
                    class="flame">
                </div>


            </div>

        </div>

    </div>


    <!-- EXPLOSION -->

    <div
        class="explosion"
        id="explosion">
    </div>


    <!-- COUNTDOWN -->

    <div
        class="countdown"
        id="countdown">


        <div
            class="count-number"
            id="countNumber">

            10

        </div>


    </div>


</section>


<!-- =====================================================
     BET
===================================================== -->

<section class="controls">


    <!--
        این دکمه در ابتدا:
        BETTING

        بعد از START:
        WITHDRAW
    -->

    <button
        id="bettingBtn"
        class="betting-btn">

        BETTING

    </button>


    <!--
        این قسمت فقط
        با BETTING باز می‌شود
    -->

    <div
        id="betPanel"
        class="bet-panel">


        <div class="bet-row">


            <input
                id="amountInput"
                class="amount"
                type="number"
                min="0.1"
                step="0.1"
                placeholder="Amount TON">


            <button
                id="startBtn"
                class="start">

                START

            </button>


        </div>


        <div
            id="message"
            class="message">
        </div>


    </div>


</section>


<!-- =====================================================
     PLAYERS
===================================================== -->

<section class="players">


    <div class="players-head">

        <div>
            PLAYER
        </div>


        <div
            style="text-align:right">

            BET

        </div>


        <div
            style="text-align:right">

            VALUE

        </div>

    </div>


    <div
        id="playersList">
    </div>


</section>


</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
    document.getElementById(
        "balance"
    );

const bettingBtn =
    document.getElementById(
        "bettingBtn"
    );

const betPanel =
    document.getElementById(
        "betPanel"
    );

const amountInput =
    document.getElementById(
        "amountInput"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const multiplierEl =
    document.getElementById(
        "multiplier"
    );

const playersList =
    document.getElementById(
        "playersList"
    );

const rocketWrap =
    document.getElementById(
        "rocketWrap"
    );

const explosion =
    document.getElementById(
        "explosion"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const countNumber =
    document.getElementById(
        "countNumber"
    );


/* =====================================================
   BALANCE
===================================================== */

let balance =
    parseFloat(
        localStorage.getItem(
            "utruxRocketBalance"
        )
    );


if(
    !Number.isFinite(balance)
){

    balance = 100;

}


function saveBalance(){

    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );

}


function updateBalance(){

    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();

}


updateBalance();


/* =====================================================
   STATE
===================================================== */

let phase =
    "betting";

let multiplier =
    1;

let crashPoint =
    0;

let roundTimer =
    null;

let waitTimer =
    null;

let countdownTimer =
    null;

let hasBet =
    false;

let betAmount =
    0;


/* =====================================================
   PLAYER DATA
===================================================== */

const names = [

    "Dark",
    "Nexus",
    "Hunter",
    "Titan",
    "Neo",
    "Storm",
    "Viper",
    "Alex",
    "Shadow",
    "Phoenix",
    "Nova",
    "Ghost",
    "Zero",
    "Wolf",
    "Blaze",
    "Lucky",
    "King",
    "Max"

];


let players = [];


/* =====================================================
   FAKE BET AMOUNT
===================================================== */

function fakeBet(){

    const r =
        Math.random();


    /*
        80%
        0.1 - 1
    */

    if(
        r < .80
    ){

        return (
            .1 +
            Math.random() * .9
        );

    }


    /*
        13%
        1 - 10
    */

    if(
        r < .93
    ){

        return (
            1 +
            Math.random() * 9
        );

    }


    /*
        5%
        10 - 100
    */

    if(
        r < .98
    ){

        return (
            10 +
            Math.random() * 90
        );

    }


    /*
        2%
        100 - 1000
    */

    return (
        100 +
        Math.random() * 900
    );

}


/* =====================================================
   FAKE CASHOUT
===================================================== */

function fakeCashoutPoint(){

    const r =
        Math.random();


    /*
        بعضی‌ها خیلی زود
    */

    if(
        r < .18
    ){

        return (
            1.15 +
            Math.random() * .55
        );

    }


    /*
        متوسط
    */

    if(
        r < .43
    ){

        return (
            1.7 +
            Math.random() * 1.1
        );

    }


    /*
        کمی دیرتر
    */

    if(
        r < .68
    ){

        return (
            2.5 +
            Math.random() * 1.8
        );

    }


    /*
        دیر
    */

    if(
        r < .85
    ){

        return (
            4.5 +
            Math.random() * 3
        );

    }


    /*
        بعضی‌ها اصلاً برداشت نمی‌کنند
    */

    return null;

}


/* =====================================================
   CRASH POINT
===================================================== */

function generateCrash(){

    const r =
        Math.random();


    /*
        40%
        1.00 - 1.30
    */

    if(
        r < .40
    ){

        return (
            1 +
            Math.random() * .30
        );

    }


    /*
        35%
        1.30 - 2.50
    */

    if(
        r < .75
    ){

        return (
            1.30 +
            Math.random() * 1.20
        );

    }


    /*
        9.5%
        2.50 - 5
    */

    if(
        r < .845
    ){

        return (
            2.50 +
            Math.random() * 2.50
        );

    }


    /*
        10%
        5 - 7
    */

    if(
        r < .945
    ){

        return (
            5 +
            Math.random() * 2
        );

    }


    /*
        0.5%
        100+
    */

    if(
        r < .95
    ){

        return (
            100 +
            Math.random() * 100
        );

    }


    /*
        بقیه:
        7 - 25
    */

    return (
        7 +
        Math.random() * 18
    );

}


/* =====================================================
   CREATE PLAYERS
===================================================== */

function createPlayers(){

    players = [];


    const shuffled =
        [...names].sort(
            () =>
                Math.random() -
                .5
        );


    for(
        let i = 0;
        i < 7;
        i++
    ){

        players.push({

            name:
                shuffled[i],

            bet:
                fakeBet(),

            cashoutAt:
                fakeCashoutPoint(),

            cashed:
                false,

            crashed:
                false,

            finalMultiplier:
                0,

            finalValue:
                0

        });

    }


    renderPlayers();

}


/* =====================================================
   RENDER PLAYERS
===================================================== */

function renderPlayers(){

    let html = "";


    /*
        USER
    */

    if(
        hasBet
    ){

        html += `

        <div class="player you">

            <div class="player-name">
                YOU
            </div>


            <div class="player-bet">
                ${betAmount.toFixed(2)}
            </div>


            <div
                class="player-value"
                id="userValue">

                ${(betAmount * multiplier).toFixed(2)}

            </div>

        </div>

        `;

    }


    /*
        FAKE PLAYERS
    */

    players.forEach(
        (
            player,
            index
        ) => {


            let rowClass =
                "player";


            /*
                سبز
            */

            if(
                player.cashed
            ){

                rowClass +=
                    " cashed";

            }


            /*
                قرمز
            */

            if(
                player.crashed
            ){

                rowClass +=
                    " crashed";

            }


            let value;


            /*
                CASHED
            */

            if(
                player.cashed
            ){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · "
                    +
                    player.finalMultiplier.toFixed(2)
                    +
                    "x";

            }


            /*
                CRASHED
            */

            else if(
                player.crashed
            ){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · CRASH";

            }


            /*
                ACTIVE
            */

            else{

                value =
                    (
                        player.bet *
                        multiplier
                    ).toFixed(2);

            }


            html += `

            <div
                class="${rowClass}"
                id="player-${index}">

                <div class="player-name">
                    ${player.name}
                </div>


                <div class="player-bet">
                    ${player.bet.toFixed(2)}
                </div>


                <div class="player-value">

                    ${value}

                </div>

            </div>

            `;

        }
    );


    playersList.innerHTML =
        html;

}


/* =====================================================
   UPDATE PLAYERS
===================================================== */

function updatePlayers(){

    players.forEach(
        player => {


            /*
                کسانی که قبلاً
                برداشت یا Crash شده‌اند
            */

            if(
                player.cashed ||
                player.crashed
            ){

                return;

            }


            /*
                برداشت تصادفی
            */

            if(

                player.cashoutAt !== null &&

                multiplier >=
                player.cashoutAt

            ){

                player.cashed =
                    true;


                player.finalMultiplier =
                    player.cashoutAt;


                player.finalValue =
                    player.bet *
                    player.cashoutAt;

            }

        }
    );


    renderPlayers();


    /*
        مقدار کاربر
    */

    const userValue =
        document.getElementById(
            "userValue"
        );


    if(
        userValue &&
        hasBet
    ){

        userValue.textContent =
            (
                betAmount *
                multiplier
            ).toFixed(2);

    }

}


/* =====================================================
   BETTING BUTTON
===================================================== */

bettingBtn.addEventListener(
    "click",
    () => {


        /*
            اگر کاربر شرط فعال دارد:

            BETTING
            ↓
            WITHDRAW
        */

        if(
            hasBet
        ){

            withdraw();

            return;

        }


        /*
            اگر زمان Betting تمام شده
        */

        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Wait for the next round.";

            return;

        }


        /*
            باز/بسته کردن پنل
        */

        betPanel.classList.toggle(
            "show"
        );


        if(
            betPanel.classList.contains(
                "show"
            )
        ){

            amountInput.focus();

        }

    }
);


/* =====================================================
   START
===================================================== */

startBtn.addEventListener(
    "click",
    () => {


        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Betting is closed.";

            return;

        }


        const amount =
            parseFloat(
                amountInput.value
            );


        /*
            مقدار اشتباه
        */

        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.textContent =
                "Enter a valid amount.";

            return;

        }


        /*
            موجودی کافی نیست
        */

        if(
            amount >
            balance
        ){

            message.textContent =
                "Not enough TON.";

            return;

        }


        /*
            کم کردن مبلغ
        */

        balance -=
            amount;


        betAmount =
            amount;


        hasBet =
            true;


        updateBalance();


        /*
            پنل مقدار محو شود
        */

        betPanel.classList.remove(
            "show"
        );


        /*
            BETTING -> WITHDRAW
        */

        bettingBtn.textContent =
            "WITHDRAW";


        bettingBtn.classList.add(
            "withdraw"
        );


        renderPlayers();

    }
);


/* =====================================================
   WITHDRAW
===================================================== */

function withdraw(){

    if(
        !hasBet
    ){

        return;

    }


    /*
        مقدار فعلی
    */

    const value =
        betAmount *
        multiplier;


    balance +=
        value;


    hasBet =
        false;


    betAmount =
        0;


    updateBalance();


    /*
        دوباره BETTING
    */

    bettingBtn.textContent =
        "BETTING";


    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value =
        "";


    message.textContent =
        "Withdraw " +
        value.toFixed(2) +
        " TON";


    renderPlayers();

}


/* =====================================================
   RESET AFTER CRASH
===================================================== */

function resetForNextRound(){

    /*
        اگر کاربر برداشت نکرده،
        اصل مبلغ دمو برمی‌گردد.
    */

    if(
        hasBet
    ){

        balance +=
            betAmount;

    }


    hasBet =
        false;


    betAmount =
        0;


    updateBalance();


    bettingBtn.textContent =
        "BETTING";


    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value =
        "";


    renderPlayers();

}


/* =====================================================
   START NEW ROUND
===================================================== */

function startRound(){

    clearInterval(
        roundTimer
    );

    clearInterval(
        waitTimer
    );


    phase =
        "betting";


    multiplier =
        1;


    crashPoint =
        generateCrash();


    /*
        ضریب را ریست کن
    */

    multiplierEl.textContent =
        "1.00x";


    multiplierEl.classList.remove(
        "crashed"
    );


    statusEl.textContent =
        "BETTING OPEN";


    /*
        راکت:
        دوباره پایین چپ
    */

    rocketWrap.classList.remove(
        "fly"
    );

    rocketWrap.classList.remove(
        "hover"
    );


    rocketWrap.style.opacity =
        "0";


    /*
        انفجار قبلی
    */

    explosion.classList.remove(
        "active"
    );


    /*
        بازیکن‌های جدید
    */

    createPlayers();


    message.textContent =
        "";


    /*
        5 ثانیه Betting
    */

    let seconds =
        5;


    waitTimer =
        setInterval(
            () => {

                seconds--;


                if(
                    seconds <= 0
                ){

                    clearInterval(
                        waitTimer
                    );


                    startFlight();

                }

            },
            1000
        );

}


/* =====================================================
   START FLIGHT
===================================================== */

function startFlight(){

    phase =
        "running";


    statusEl.textContent =
        "ROCKET FLYING";


    betPanel.classList.remove(
        "show"
    );


    /*
        راکت:
        پایین چپ -> مرکز
    */

    rocketWrap.classList.add(
        "fly"
    );


    /*
        بعد از زمان حرکت،
        در مرکز حالت پرواز بگیرد
    */

    setTimeout(
        () => {

            if(
                phase ===
                "running"
            ){

                rocketWrap.classList.add(
                    "hover"
                );

            }

        },
        1850
    );


    /*
        ==============================================
        SPEED SYSTEM
        ==============================================

        1x تا 5x:
        متوسط و قابل مشاهده

        5x به بالا:
        شتاب تدریجی

        10x به بالا:
        باز هم سریع‌تر

        ==============================================
    */


    roundTimer =
        setInterval(
            () => {


                let speed;


                /*
                    پایه
                    حدود 0.28x در ثانیه
                */

                speed =
                    0.0085;


                /*
                    2x+
                    کمی سریع‌تر
                */

                if(
                    multiplier >= 2
                ){

                    speed =
                        0.0095;

                }


                /*
                    3x+
                */

                if(
                    multiplier >= 3
                ){

                    speed =
                        0.0105;

                }


                /*
                    4x+
                */

                if(
                    multiplier >= 4
                ){

                    speed =
                        0.0115;

                }


                /*
                    ==================================
                    از 5x به بعد:
                    شتاب واقعی اما تدریجی
                    ==================================
                */

                if(
                    multiplier >= 5
                ){

                    const over5 =
                        multiplier - 5;


                    speed =
                        0.0125 +
                        (
                            over5 *
                            0.0022
                        );

                }


                /*
                    10x+
                    سرعت بیشتر می‌شود
                */

                if(
                    multiplier >= 10
                ){

                    const over10 =
                        multiplier - 10;


                    speed =
                        0.0235 +
                        (
                            over10 *
                            0.0035
                        );

                }


                /*
                    جلوگیری از پرش
                */

                speed =
                    Math.min(
                        speed,
                        0.075
                    );


                /*
                    چون تایمر 30ms است
                */

                multiplier +=
                    speed;


                /*
                    نمایش ضریب
                */

                multiplierEl.textContent =
                    multiplier.toFixed(2) +
                    "x";


                /*
                    بازیکن‌ها
                */

                updatePlayers();


                /*
                    Crash
                */

                if(
                    multiplier >=
                    crashPoint
                ){

                    crash();

                }


            },
            30
        );

}


/* =====================================================
   CRASH
===================================================== */

function crash(){

    clearInterval(
        roundTimer
    );


    phase =
        "crashed";


    statusEl.textContent =
        "CRASH";


    multiplierEl.classList.add(
        "crashed"
    );


    /*
        راکت در مرکز ناپدید می‌شود
        و انفجار همان مرکز است.
    */

    rocketWrap.style.opacity =
        "0";


    /*
        همه کسانی که
        برداشت نکردند:

        قرمز
    */

    players.forEach(
        player => {

            if(
                !player.cashed
            ){

                player.crashed =
                    true;


                player.finalMultiplier =
                    multiplier;


                player.finalValue =
                    player.bet *
                    multiplier;

            }

        }
    );


    renderPlayers();


    /*
        انفجار
    */

    explosion.classList.remove(
        "active"
    );


    void explosion.offsetWidth;


    explosion.classList.add(
        "active"
    );


    /*
        Countdown
    */

    setTimeout(
        startCountdown,
        900
    );

}


/* =====================================================
   COUNTDOWN 10 -> 1
===================================================== */

function startCountdown(){

    countdown.style.display =
        "flex";


    let number =
        10;


    countNumber.textContent =
        number;


    countdownTimer =
        setInterval(
            () => {


                number--;


                if(
                    number >= 1
                ){

                    countNumber.textContent =
                        number;

                }
                else{

                    clearInterval(
                        countdownTimer
                    );


                    countdown.style.display =
                        "none";


                    /*
                        شرط برداشت نشده:
                        اصل مبلغ دمو برگردد.
                    */

                    if(
                        hasBet
                    ){

                        balance +=
                            betAmount;

                    }


                    hasBet =
                        false;


                    betAmount =
                        0;


                    updateBalance();


                    bettingBtn.textContent =
                        "BETTING";


                    bettingBtn.classList.remove(
                        "withdraw"
                    );


                    amountInput.value =
                        "";


                    /*
                        دور بعد
                    */

                    startRound();

                }

            },
            1000
        );

}


/* =====================================================
   INITIAL
===================================================== */

startRound();

</script>
