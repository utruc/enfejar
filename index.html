<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UTRUX — CRASH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 50% 20%,#142b52 0%,#071426 42%,#02060d 100%);
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:14px;
}

/* HEADER */
.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.mode{
    direction:ltr;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    padding:9px 14px;
    border-radius:12px;
}

/* BALANCE */
.balance{
    display:flex;
    align-items:center;
    gap:9px;
    direction:ltr;
}

.balance-number{
    font-size:23px;
    font-weight:900;
}

.coin{
    width:31px;
    height:31px;
    border-radius:50%;
    background:linear-gradient(145deg,#48d7ff,#1684db);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
    box-shadow:0 0 18px rgba(40,180,255,.35);
}

/* GAME */
.game{
    position:relative;
    height:450px;
    overflow:hidden;
    border-radius:22px;
    background:
        linear-gradient(
            to bottom,
            rgba(20,43,72,.72),
            rgba(3,10,19,.95)
        );
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 0 80px rgba(0,0,0,.35);
}

/* GRID */
.game::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
    pointer-events:none;
}

/* MULTIPLIER */
.multiplier{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:54px;
    font-weight:900;
    direction:ltr;
    z-index:10;
    text-shadow:0 5px 25px rgba(0,0,0,.6);
}

.status{
    position:absolute;
    top:91px;
    left:50%;
    transform:translateX(-50%);
    color:#9eacbb;
    font-size:14px;
    z-index:10;
}

/* JET */
.jet{
    position:absolute;
    width:105px;
    height:44px;
    left:18px;
    bottom:25px;
    z-index:5;
    transform-origin:center;
    transition:none;
}

.jet-body{
    position:absolute;
    width:75px;
    height:17px;
    background:linear-gradient(180deg,#dfe7ed,#667482);
    border-radius:70% 15% 15% 70%;
    left:15px;
    top:14px;
    transform:skewX(-10deg);
}

.jet-nose{
    position:absolute;
    right:0;
    top:14px;
    width:28px;
    height:17px;
    background:#dce4ea;
    clip-path:polygon(0 0,100% 50%,0 100%);
}

.jet-wing{
    position:absolute;
    width:54px;
    height:18px;
    background:#758493;
    left:29px;
    top:4px;
    clip-path:polygon(0 100%,100% 0,65% 100%);
}

.jet-wing2{
    position:absolute;
    width:48px;
    height:17px;
    background:#536170;
    left:27px;
    bottom:2px;
    clip-path:polygon(0 0,100% 100%,55% 100%);
}

.jet-tail{
    position:absolute;
    width:19px;
    height:27px;
    background:#687684;
    left:19px;
    top:3px;
    clip-path:polygon(0 100%,55% 0,100% 100%);
}

.jet-window{
    position:absolute;
    width:18px;
    height:8px;
    background:#132b42;
    border-radius:50%;
    left:47px;
    top:15px;
    transform:skewX(-15deg);
}

.flame{
    position:absolute;
    left:0;
    top:18px;
    width:24px;
    height:11px;
    background:linear-gradient(90deg,#ffb300,#ff5b00,transparent);
    clip-path:polygon(0 50%,100% 0,75% 50%,100% 100%);
    animation:flame .08s infinite alternate;
}

@keyframes flame{
    from{transform:scaleX(.7)}
    to{transform:scaleX(1.15)}
}

/* EXPLOSION */
.explosion{
    position:absolute;
    display:none;
    width:130px;
    height:130px;
    z-index:20;
    transform:translate(-50%,-50%);
}

.explosion.show{
    display:block;
    animation:explode .8s forwards;
}

.explosion::before{
    content:"";
    position:absolute;
    inset:15px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        #fff 0 7%,
        #ffe600 8% 23%,
        #ff7b00 24% 48%,
        #ef2700 49% 66%,
        transparent 67%);
    filter:blur(1px);
}

.explosion::after{
    content:"";
    position:absolute;
    inset:-30px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        transparent 30%,
        rgba(255,120,0,.45) 31%,
        transparent 55%);
}

@keyframes explode{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.3);
    }
    45%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.5);
    }
}

/* CONTROLS */
.controls{
    margin-top:12px;
    padding:13px;
    border-radius:18px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

.control-row{
    display:flex;
    gap:9px;
}

.amount-box{
    flex:1;
    min-width:0;
}

.amount-box input{
    width:100%;
    height:48px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    background:#081321;
    color:#fff;
    outline:none;
    padding:0 14px;
    font-size:17px;
    direction:ltr;
}

.amount-box input:focus{
    border-color:#238bd1;
}

.join{
    height:48px;
    border:0;
    border-radius:13px;
    padding:0 22px;
    background:linear-gradient(135deg,#1689d8,#1764c0);
    color:white;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
}

.join:active{
    transform:scale(.97);
}

.join:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    color:#8999aa;
    font-size:12px;
}

.your-entry{
    color:#55c9ff;
}

/* PLAYERS */
.players{
    margin-top:12px;
    border-radius:18px;
    overflow:hidden;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
}

.players-head{
    padding:14px;
    font-weight:900;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.player{
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid rgba(255,255,255,.045);
}

.player:last-child{
    border-bottom:0;
}

.player-name{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:31px;
    height:31px;
    border-radius:50%;
    background:linear-gradient(135deg,#263e5b,#101b29);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
}

.me .avatar{
    background:linear-gradient(135deg,#168bd8,#1b4d9a);
}

.amount{
    direction:ltr;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:800;
}

.mini-coin{
    width:19px;
    height:19px;
    border-radius:50%;
    background:#25aee7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
}

/* MOBILE */
@media(max-width:600px){

    .app{
        padding:9px;
    }

    .game{
        height:390px;
    }

    .multiplier{
        font-size:43px;
    }

    .header{
        height:55px;
    }

    .logo{
        font-size:21px;
    }

    .balance-number{
        font-size:19px;
    }

    .coin{
        width:27px;
        height:27px;
    }

    .control-row{
        flex-direction:column;
    }

    .join{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">UTRUX</div>

        <div class="balance">
            <span class="balance-number" id="balance">100</span>
            <div class="coin">G</div>
        </div>

        <div class="mode">CRASH</div>

    </header>


    <main class="game" id="game">

        <div class="multiplier" id="multiplier">1.00x</div>

        <div class="status" id="status">در انتظار شروع...</div>

        <div class="jet" id="jet">

            <div class="flame"></div>
            <div class="jet-body"></div>
            <div class="jet-nose"></div>
            <div class="jet-wing"></div>
            <div class="jet-wing2"></div>
            <div class="jet-tail"></div>
            <div class="jet-window"></div>

        </div>

        <div class="explosion" id="explosion"></div>

    </main>


    <section class="controls">

        <div class="control-row">

            <div class="amount-box">
                <input
                    id="amount"
                    type="number"
                    min="1"
                    step="1"
                    value="10"
                    placeholder="مقدار"
                >
            </div>

            <button class="join" id="join">
                ورود به دور
            </button>

        </div>

        <div class="info">
            <span id="roundInfo">دور بعدی به‌زودی</span>
            <span class="your-entry" id="entryText">بدون ورود</span>
        </div>

    </section>


    <section class="players">

        <div class="players-head">
            بازیکنان
        </div>

        <div id="playersList"></div>

    </section>

</div>


<script>

const balanceEl = document.getElementById("balance");
const amountEl = document.getElementById("amount");
const joinBtn = document.getElementById("join");
const multiplierEl = document.getElementById("multiplier");
const statusEl = document.getElementById("status");
const jetEl = document.getElementById("jet");
const explosionEl = document.getElementById("explosion");
const playersList = document.getElementById("playersList");
const entryText = document.getElementById("entryText");
const roundInfo = document.getElementById("roundInfo");

let balance = Number(localStorage.getItem("utruxBalance"));

if(!Number.isFinite(balance)){
    balance = 100;
}

let joinedAmount = 0;
let running = false;
let multiplier = 1;
let crashPoint = 1.2;
let animationFrame = null;

const fakePlayers = [
    ["ShadowX", 7],
    ["Ali_Pro", 15],
    ["DarkWolf", 4],
    ["Nima", 22],
    ["UTRUX_777", 9],
    ["Armin", 31],
    ["Ghost", 6]
];


/* BALANCE */

function saveBalance(){
    localStorage.setItem("utruxBalance", String(balance));
    balanceEl.textContent = Math.floor(balance);
}


/* CRASH DISTRIBUTION */

function generateCrash(){

    const r = Math.random();

    if(r < 0.40){
        return 1.00 + Math.random() * 0.30;
    }

    if(r < 0.75){
        return 1.30 + Math.random() * 1.20;
    }

    if(r < 0.845){
        return 2.50 + Math.random() * 2.50;
    }

    if(r < 0.945){
        return 5.00 + Math.random() * 2.00;
    }

    /* حدود 0.5٪ برای 100x+ */
    if(Math.random() < 0.091){
        return 100 + Math.random() * 100;
    }

    return 7 + Math.random() * 18;
}


/* PLAYERS */

function renderPlayers(){

    let html = "";

    if(joinedAmount > 0){

        html += `
        <div class="player me">

            <div class="player-name">
                <div class="avatar">U</div>
                <span>شما</span>
            </div>

            <div class="amount">
                ${joinedAmount}
                <span class="mini-coin">G</span>
            </div>

        </div>
        `;

    }else{

        html += `
        <div class="player me">

            <div class="player-name">
                <div class="avatar">U</div>
                <span>شما</span>
            </div>

            <div class="amount">
                —
            </div>

        </div>
        `;

    }


    fakePlayers.forEach(player => {

        html += `
        <div class="player">

            <div class="player-name">
                <div class="avatar">
                    ${player[0].charAt(0).toUpperCase()}
                </div>

                <span>${player[0]}</span>
            </div>

            <div class="amount">
                ${player[1]}
                <span class="mini-coin">G</span>
            </div>

        </div>
        `;

    });

    playersList.innerHTML = html;
}


/* JOIN */

joinBtn.addEventListener("click", () => {

    if(running){

        alert("این دور شروع شده؛ برای دور بعد وارد شوید.");
        return;

    }

    const amount = Number(amountEl.value);

    if(!Number.isFinite(amount) || amount <= 0){

        alert("یک مقدار معتبر وارد کن.");
        return;

    }

    if(amount > balance){

        alert("موجودی کافی نیست.");
        return;

    }

    /*
      فقط مقدار نمایشی/امتیازی دور را ثبت می‌کنیم.
      هیچ پرداخت یا برداشت واقعی وجود ندارد.
    */

    if(joinedAmount > 0){

        balance += joinedAmount;

    }

    balance -= amount;
    joinedAmount = amount;

    saveBalance();

    entryText.textContent = `ورود: ${amount} G`;

    renderPlayers();

});


/* RESET ENTRY AFTER ROUND */

function resetEntry(){

    if(joinedAmount > 0){

        balance += joinedAmount;
        joinedAmount = 0;

        saveBalance();

    }

    entryText.textContent = "بدون ورود";
    renderPlayers();

}


/* MOVE JET */

function animateJet(){

    const gameWidth = document.getElementById("game").clientWidth;
    const gameHeight = document.getElementById("game").clientHeight;

    const maxX = gameWidth - 120;
    const maxY = gameHeight - 110;

    const progress = Math.min(
        1,
        Math.max(
            0,
            (multiplier - 1) / Math.max(.5, crashPoint - 1)
        )
    );

    const x = 18 + progress * maxX;
    const y = gameHeight - 55 - progress * maxY;

    jetEl.style.left = x + "px";
    jetEl.style.bottom = (gameHeight - y - 45) + "px";

}


/* START ROUND */

function startRound(){

    running = true;
    multiplier = 1;
    crashPoint = generateCrash();

    explosionEl.classList.remove("show");

    jetEl.style.left = "18px";
    jetEl.style.bottom = "25px";
    jetEl.style.display = "block";

    statusEl.textContent = "در حال پرواز...";
    roundInfo.textContent = "دور در حال اجرا";

    joinBtn.disabled = true;

    const start = performance.now();

    function frame(now){

        if(!running){
            return;
        }

        const elapsed = (now - start) / 1000;

        /*
          رشد نرم ضریب
        */
        multiplier =
            Math.pow(1.115, elapsed);

        multiplier = Math.max(1, multiplier);

        multiplierEl.textContent =
            multiplier.toFixed(2) + "x";

        animateJet();

        if(multiplier >= crashPoint){

            crash();

            return;

        }

        animationFrame =
            requestAnimationFrame(frame);

    }

    animationFrame =
        requestAnimationFrame(frame);

}


/* CRASH */

function crash(){

    running = false;

    if(animationFrame){
        cancelAnimationFrame(animationFrame);
    }

    multiplierEl.textContent =
        crashPoint.toFixed(2) + "x";

    statusEl.textContent = "CRASH";

    const rect =
        jetEl.getBoundingClientRect();

    const gameRect =
        document.getElementById("game").getBoundingClientRect();

    explosionEl.style.left =
        (rect.left - gameRect.left + rect.width / 2) + "px";

    explosionEl.style.top =
        (rect.top - gameRect.top + rect.height / 2) + "px";

    explosionEl.classList.remove("show");

    void explosionEl.offsetWidth;

    explosionEl.classList.add("show");

    jetEl.style.display = "none";

    joinBtn.disabled = true;

    let seconds = 10;

    roundInfo.textContent =
        `دور بعدی ${seconds} ثانیه دیگر`;

    statusEl.textContent =
        "CRASH";


    const timer = setInterval(() => {

        seconds--;

        if(seconds > 0){

            roundInfo.textContent =
                `دور بعدی ${seconds} ثانیه دیگر`;

        }else{

            clearInterval(timer);

            resetEntry();

            multiplierEl.textContent = "1.00x";

            statusEl.textContent =
                "در انتظار شروع...";

            roundInfo.textContent =
                "دور جدید شروع شد";

            joinBtn.disabled = false;

            startRound();

        }

    },1000);

}


/* INIT */

saveBalance();
renderPlayers();

/*
  شروع خودکار
*/
setTimeout(() => {

    startRound();

},1200);

</script>

</body>
</html>
