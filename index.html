<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UTRUX ROCKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#268cff;
    --blue2:#55adff;
    --green:#20d486;
    --green2:#55efa9;
    --red:#ff4d64;
    --red2:#ff7182;
    --yellow:#ffc94d;
    --bg:#030811;
    --panel:#091522;
    --line:rgba(255,255,255,.065);
    --muted:#73859b;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(
            circle at 50% -10%,
            #183c69 0%,
            transparent 43%
        ),
        linear-gradient(
            #050b14,
            #02060c
        );
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;

    background:rgba(4,10,19,.93);
    border-bottom:1px solid var(--line);

    backdrop-filter:blur(18px);

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 12px;

    border-radius:50px;

    background:#0d1928;
    border:1px solid rgba(255,255,255,.07);

    font-weight:900;
}

.coin{
    width:22px;
    height:22px;
}


/* =====================================================
   MAIN
===================================================== */

.container{
    width:min(100%,900px);
    margin:auto;
    padding:12px;
}


/* =====================================================
   GAME
===================================================== */

.game{
    position:relative;
    height:480px;
    overflow:hidden;

    border-radius:23px;
    border:1px solid rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 50% 52%,
            rgba(38,140,255,.20),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #08192d,
            #040a12
        );
}


/* stars */

.stars{
    position:absolute;
    inset:0;
    opacity:.21;

    background-image:
        radial-gradient(
            circle,
            #fff 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            #72baff 1px,
            transparent 1px
        );

    background-size:
        87px 91px,
        143px 127px;

    background-position:
        12px 22px,
        45px 65px;
}


/* grid */

.grid{
    position:absolute;

    left:-20%;
    right:-20%;
    bottom:-125px;

    height:330px;

    opacity:.13;

    transform:
        perspective(380px)
        rotateX(58deg);

    background-image:
        linear-gradient(
            rgba(38,140,255,.65) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(38,140,255,.65) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    color:var(--muted);

    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;

    z-index:30;
}


/* =====================================================
   MULTIPLIER
===================================================== */

.multiplier{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:76px;
    line-height:1;

    font-weight:900;
    letter-spacing:-3px;

    z-index:25;

    color:#fff;

    text-shadow:
        0 0 25px rgba(38,140,255,.25),
        0 0 55px rgba(38,140,255,.15);

    transition:
        color .15s;
}

.multiplier.crashed{
    color:var(--red);

    text-shadow:
        0 0 25px rgba(255,77,100,.5),
        0 0 60px rgba(255,77,100,.25);
}


/* =====================================================
   ROCKET CENTER
===================================================== */

/*
    خود کانتینر دقیقاً مرکز بازی است.

    راکت از مرکز بیرون نمی‌رود.
    اما با rotate و translate
    طوری حرکت می‌کند که انگار
    به سمت بالا-راست پرواز می‌کند.
*/

.rocket-wrap{

    position:absolute;

    left:50%;
    top:50%;

    width:115px;
    height:115px;

    z-index:22;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    transition:
        opacity .2s;
}


/*
    مسیر ظاهری پرواز:
    حرکت خیلی کوچک بالا-راست
    و برگشت به مرکز.
*/

.rocket-flight{

    position:absolute;

    inset:0;

    animation:
        flightMotion
        .75s
        ease-in-out
        infinite;

}


/*
    خود راکت
    دماغه به سمت بالا-راست
*/

.rocket{

    position:absolute;

    left:38px;
    top:22px;

    width:42px;
    height:92px;

    border-radius:
        50%
        50%
        44%
        44%;

    transform:
        rotate(35deg);

    background:
        linear-gradient(
            90deg,
            #71879a 0%,
            #edf6ff 35%,
            #ffffff 53%,
            #8a9eaf 100%
        );

    box-shadow:
        inset -6px 0 10px rgba(0,0,0,.2),
        0 0 20px rgba(255,255,255,.13);
}


/*
    nose
*/

.rocket::before{

    content:"";

    position:absolute;

    width:42px;
    height:36px;

    left:0;
    top:-18px;

    border-radius:
        50%
        50%
        20%
        20%;

    background:
        linear-gradient(
            90deg,
            #91a5b7,
            #ffffff 50%,
            #8195a7
        );
}


/*
    پنجره
*/

.window{

    position:absolute;

    width:17px;
    height:17px;

    left:12px;
    top:21px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e5f7ff,
            #268fff 45%,
            #064b91
        );

    border:
        3px solid #526a81;

    box-shadow:
        0 0 13px rgba(38,140,255,.9);
}


/*
    خط بدنه
*/

.body-line{

    position:absolute;

    width:4px;
    height:57px;

    left:19px;
    top:17px;

    border-radius:10px;

    background:
        rgba(80,110,135,.32);
}


/*
    بال‌ها
*/

.fin-left{

    position:absolute;

    left:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            135deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.fin-right{

    position:absolute;

    right:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            225deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}


/*
    موتور
*/

.engine{

    position:absolute;

    left:8px;
    bottom:-9px;

    width:26px;
    height:17px;

    border-radius:
        0 0 12px 12px;

    background:#354b60;
}


/*
    شعله
*/

.flame{

    position:absolute;

    left:8px;
    bottom:-64px;

    width:27px;
    height:66px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #ffe15a 20%,
            #ff9c21 52%,
            #ff3d5d 100%
        );

    clip-path:
        polygon(
            50% 100%,
            5% 35%,
            30% 48%,
            39% 0,
            61% 48%,
            95% 35%
        );

    filter:
        drop-shadow(
            0 0 13px #ff7b28
        );

    animation:
        flame .07s
        infinite
        alternate;
}


/*
    حرکت ظاهری راکت
*/

@keyframes flightMotion{

    0%{
        transform:
            translate(7px,7px);
    }

    25%{
        transform:
            translate(-2px,-6px);
    }

    50%{
        transform:
            translate(8px,-13px);
    }

    75%{
        transform:
            translate(-5px,-5px);
    }

    100%{
        transform:
            translate(7px,7px);
    }
}


@keyframes flame{

    from{
        transform:
            scaleY(.88);
    }

    to{
        transform:
            scaleY(1.12);
    }
}


/* =====================================================
   EXPLOSION
===================================================== */

.explosion{

    position:absolute;

    left:50%;
    top:50%;

    width:200px;
    height:200px;

    transform:
        translate(-50%,-50%)
        scale(.1);

    border-radius:50%;

    opacity:0;

    z-index:60;

    background:
        radial-gradient(
            circle,
            #fff 0 5%,
            #ffe56c 8%,
            #ff9d22 25%,
            #ff4e3d 45%,
            rgba(255,55,65,.15) 67%,
            transparent 73%
        );
}

.explosion.active{

    animation:
        explode .9s
        ease-out
        forwards;
}

@keyframes explode{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    45%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.9);
    }
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown{

    position:absolute;

    inset:0;

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(2,7,13,.5);

    backdrop-filter:blur(5px);
}

.count-number{

    font-size:145px;

    font-weight:900;

    text-shadow:
        0 0 55px
        rgba(38,140,255,.75);
}


/* =====================================================
   BETTING
===================================================== */

.controls{
    margin-top:10px;
}

.betting-btn{

    width:100%;

    border:0;

    border-radius:15px;

    padding:17px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #268cff,
            #1767ca
        );

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 28px
        rgba(38,140,255,.2);

    transition:.2s;
}

.betting-btn.withdraw{

    background:
        linear-gradient(
            135deg,
            #ffc94d,
            #ed9e14
        );

    color:#241700;
}

.betting-btn:disabled{

    opacity:.45;

    cursor:not-allowed;
}


/* =====================================================
   INPUT PANEL
===================================================== */

.bet-panel{

    display:none;

    margin-top:8px;

    padding:13px;

    border-radius:16px;

    background:#0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.bet-panel.show{
    display:block;
}

.bet-row{

    display:flex;

    gap:8px;
}

.amount{

    flex:1;

    min-width:0;

    padding:14px;

    border-radius:11px;

    border:
        1px solid #263c55;

    outline:none;

    background:#050c15;

    color:white;

    font-weight:800;
}

.amount:focus{

    border-color:
        var(--blue);
}

.start{

    min-width:100px;

    border:0;

    border-radius:11px;

    background:
        var(--green);

    color:#03140c;

    font-weight:900;

    cursor:pointer;
}

.message{

    min-height:20px;

    padding-top:8px;

    text-align:center;

    font-size:12px;

    color:var(--muted);
}


/* =====================================================
   PLAYERS
===================================================== */

.players{

    margin-top:10px;

    overflow:hidden;

    border-radius:18px;

    background:#0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.players-head,
.player{

    display:grid;

    grid-template-columns:
        1fr
        95px
        125px;

    gap:8px;

    align-items:center;

    padding:
        13px
        14px;
}

.players-head{

    color:#617087;

    font-size:10px;

    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.player{

    font-size:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);

    transition:
        background .3s,
        color .3s;
}

.player:last-child{
    border-bottom:0;
}


/* =====================================================
   USER
===================================================== */

.player.you{

    background:
        rgba(38,140,255,.09);
}


/* =====================================================
   GREEN = CASHED OUT
===================================================== */

.player.cashed{

    background:
        rgba(32,212,134,.10);
}

.player.cashed .player-name{

    color:
        var(--green2);
}

.player.cashed .player-value{

    color:
        var(--green2);
}


/* =====================================================
   RED = CRASHED
===================================================== */

.player.crashed{

    background:
        rgba(255,77,100,.10);
}

.player.crashed .player-name{

    color:
        var(--red2);
}

.player.crashed .player-bet{

    color:
        #e98995;
}

.player.crashed .player-value{

    color:
        var(--red2);
}


/* =====================================================
   PLAYER TEXT
===================================================== */

.player-name{
    font-weight:900;
}

.player-bet{

    color:#a4b1c0;

    text-align:right;
}

.player-value{

    color:
        var(--blue2);

    text-align:right;

    font-weight:900;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .game{
        height:425px;
    }

    .multiplier{
        font-size:58px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{

        grid-template-columns:
            1fr
            70px
            105px;

        padding:
            12px 10px;

        font-size:11px;
    }

}

</style>
</head>


<body>


<header class="header">

    <div class="logo">
        UTRUX
    </div>


    <div class="balance">

        <span id="balance">
            100.00
        </span>


        <svg
            class="coin"
            viewBox="0 0 100 100">

            <circle
                cx="50"
                cy="50"
                r="47"
                fill="#1689e8"/>

            <circle
                cx="50"
                cy="50"
                r="38"
                fill="#0b70c7"/>

            <path
                d="M35 24h30v9H56v35h-9V33H35zM30 45h40v9H30z"
                fill="white"/>

        </svg>

    </div>

</header>


<main class="container">


<section class="game">


    <div class="stars"></div>

    <div class="grid"></div>


    <div
        class="status"
        id="status">

        BETTING OPEN

    </div>


    <!-- ضریب همیشه مرکز بازی -->

    <div
        class="multiplier"
        id="multiplier">

        1.00x

    </div>


    <!--
        راکت:
        مرکز صفحه
        ولی رو به بالا-راست
    -->

    <div
        class="rocket-wrap"
        id="rocketWrap">

        <div class="rocket-flight">

            <div class="rocket">

                <div class="body-line"></div>

                <div class="window"></div>

                <div class="fin-left"></div>

                <div class="fin-right"></div>

                <div class="engine"></div>

                <div class="flame"></div>

            </div>

        </div>

    </div>


    <!-- EXPLOSION -->

    <div
        class="explosion"
        id="explosion">
    </div>


    <!-- COUNTDOWN -->

    <div
        class="countdown"
        id="countdown">

        <div
            class="count-number"
            id="countNumber">

            10

        </div>

    </div>


</section>


<!-- =================================================
     CONTROLS
================================================== -->

<section class="controls">


    <button
        id="bettingBtn"
        class="betting-btn">

        BETTING

    </button>


    <div
        id="betPanel"
        class="bet-panel">


        <div class="bet-row">

            <input
                id="amountInput"
                class="amount"
                type="number"
                min="0.1"
                step="0.1"
                placeholder="Amount TON">


            <button
                id="startBtn"
                class="start">

                START

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>


    </div>


</section>


<!-- =================================================
     PLAYERS
================================================== -->

<section class="players">


    <div class="players-head">

        <div>
            PLAYER
        </div>

        <div
            style="text-align:right">

            BET

        </div>

        <div
            style="text-align:right">

            VALUE

        </div>

    </div>


    <div id="playersList"></div>


</section>


</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
    document.getElementById("balance");

const bettingBtn =
    document.getElementById("bettingBtn");

const betPanel =
    document.getElementById("betPanel");

const amountInput =
    document.getElementById("amountInput");

const startBtn =
    document.getElementById("startBtn");

const message =
    document.getElementById("message");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const explosion =
    document.getElementById("explosion");

const countdown =
    document.getElementById("countdown");

const countNumber =
    document.getElementById("countNumber");

const playersList =
    document.getElementById("playersList");


/* =====================================================
   BALANCE
===================================================== */

let balance =
    parseFloat(
        localStorage.getItem(
            "utruxRocketBalance"
        )
    );

if(!Number.isFinite(balance)){
    balance = 100;
}


function saveBalance(){

    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );

}


function updateBalance(){

    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();

}

updateBalance();


/* =====================================================
   GAME STATE
===================================================== */

let phase =
    "betting";

let multiplier =
    1;

let crashPoint =
    0;

let roundTimer =
    null;

let waitTimer =
    null;

let countdownTimer =
    null;

let hasBet =
    false;

let betAmount =
    0;


/* =====================================================
   FAKE PLAYERS
===================================================== */

const names = [
    "Dark",
    "Nexus",
    "Hunter",
    "Titan",
    "Neo",
    "Storm",
    "Viper",
    "Alex",
    "Shadow",
    "Phoenix",
    "Nova",
    "Ghost",
    "Zero",
    "Wolf",
    "Blaze",
    "Lucky",
    "King",
    "Max"
];

let players = [];


/* =====================================================
   FAKE BET
===================================================== */

function fakeBet(){

    const r =
        Math.random();


    if(r < .80){

        return (
            .1 +
            Math.random() * .9
        );

    }


    if(r < .93){

        return (
            1 +
            Math.random() * 9
        );

    }


    if(r < .98){

        return (
            10 +
            Math.random() * 90
        );

    }


    return (
        100 +
        Math.random() * 900
    );

}


/* =====================================================
   FAKE CASHOUT
===================================================== */

function fakeCashoutPoint(){

    const r =
        Math.random();


    if(r < .15){

        return (
            1.10 +
            Math.random() * .50
        );

    }


    if(r < .40){

        return (
            1.50 +
            Math.random() * 1.00
        );

    }


    if(r < .65){

        return (
            2.00 +
            Math.random() * 2.00
        );

    }


    if(r < .85){

        return (
            4.00 +
            Math.random() * 4.00
        );

    }


    /*
       این بازیکن تا Crash می‌ماند
    */

    return null;

}


/* =====================================================
   CRASH POINT
===================================================== */

function generateCrash(){

    const r =
        Math.random();


    if(r < .40){

        return (
            1 +
            Math.random() * .30
        );

    }


    if(r < .75){

        return (
            1.30 +
            Math.random() * 1.20
        );

    }


    if(r < .845){

        return (
            2.50 +
            Math.random() * 2.50
        );

    }


    if(r < .945){

        return (
            5 +
            Math.random() * 2
        );

    }


    if(r < .95){

        return (
            100 +
            Math.random() * 100
        );

    }


    return (
        7 +
        Math.random() * 18
    );

}


/* =====================================================
   CREATE PLAYERS
===================================================== */

function createPlayers(){

    players = [];


    const shuffled =
        [...names].sort(
            () =>
                Math.random() -
                .5
        );


    for(
        let i = 0;
        i < 7;
        i++
    ){

        players.push({

            name:
                shuffled[i],

            bet:
                fakeBet(),

            cashoutAt:
                fakeCashoutPoint(),

            cashed:
                false,

            crashed:
                false,

            finalMultiplier:
                0,

            finalValue:
                0

        });

    }


    renderPlayers();

}


/* =====================================================
   RENDER PLAYERS
===================================================== */

function renderPlayers(){

    let html = "";


    /*
       USER
    */

    if(hasBet){

        html += `

        <div class="player you">

            <div class="player-name">
                YOU
            </div>

            <div class="player-bet">
                ${betAmount.toFixed(2)}
            </div>

            <div
                class="player-value"
                id="userValue">

                ${(betAmount * multiplier).toFixed(2)}

            </div>

        </div>

        `;

    }


    /*
       FAKE USERS
    */

    players.forEach(
        (player,index) => {


            let rowClass =
                "player";


            if(player.cashed){

                rowClass +=
                    " cashed";

            }


            if(player.crashed){

                rowClass +=
                    " crashed";

            }


            let value;


            /*
               سبز = برداشت
            */

            if(player.cashed){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · "
                    +
                    player.finalMultiplier.toFixed(2)
                    +
                    "x";

            }


            /*
               قرمز = Crash
            */

            else if(player.crashed){

                value =
                    player.finalValue.toFixed(2)
                    +
                    " · CRASH";

            }


            /*
               عادی
            */

            else{

                value =
                    (
                        player.bet *
                        multiplier
                    ).toFixed(2);

            }


            html += `

            <div
                class="${rowClass}"
                id="player-${index}">

                <div class="player-name">
                    ${player.name}
                </div>

                <div class="player-bet">
                    ${player.bet.toFixed(2)}
                </div>

                <div class="player-value">
                    ${value}
                </div>

            </div>

            `;

        }
    );


    playersList.innerHTML =
        html;

}


/* =====================================================
   UPDATE PLAYERS
===================================================== */

function updatePlayers(){

    /*
       بازیکن‌هایی که هنوز
       تصمیم نگرفته‌اند.
    */

    players.forEach(
        player => {


            if(
                player.cashed ||
                player.crashed
            ){

                return;

            }


            /*
               برداشت شانسی
            */

            if(
                player.cashoutAt !== null &&
                multiplier >=
                player.cashoutAt
            ){

                player.cashed =
                    true;


                player.finalMultiplier =
                    player.cashoutAt;


                player.finalValue =
                    player.bet *
                    player.cashoutAt;

            }

        }
    );


    renderPlayers();


    /*
       USER VALUE
    */

    const userValue =
        document.getElementById(
            "userValue"
        );


    if(
        userValue &&
        hasBet
    ){

        userValue.textContent =
            (
                betAmount *
                multiplier
            ).toFixed(2);

    }

}


/* =====================================================
   BETTING BUTTON
===================================================== */

bettingBtn.addEventListener(
    "click",
    () => {


        /*
           اگر شرط فعال است:
           WITHDRAW
        */

        if(hasBet){

            withdraw();

            return;

        }


        /*
           BETTING
        */

        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Wait for the next round.";

            return;

        }


        betPanel.classList.toggle(
            "show"
        );


        if(
            betPanel.classList.contains(
                "show"
            )
        ){

            amountInput.focus();

        }

    }
);


/* =====================================================
   START BET
===================================================== */

startBtn.addEventListener(
    "click",
    () => {


        if(
            phase !==
            "betting"
        ){

            message.textContent =
                "Betting is closed.";

            return;

        }


        const amount =
            parseFloat(
                amountInput.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.textContent =
                "Enter a valid amount.";

            return;

        }


        if(amount > balance){

            message.textContent =
                "Not enough TON.";

            return;

        }


        balance -=
            amount;


        betAmount =
            amount;


        hasBet =
            true;


        updateBalance();


        betPanel.classList.remove(
            "show"
        );


        bettingBtn.textContent =
            "WITHDRAW";


        bettingBtn.classList.add(
            "withdraw"
        );


        renderPlayers();

    }
);


/* =====================================================
   WITHDRAW
===================================================== */

function withdraw(){

    if(!hasBet)
        return;


    const value =
        betAmount *
        multiplier;


    balance +=
        value;


    hasBet =
        false;


    betAmount =
        0;


    updateBalance();


    bettingBtn.textContent =
        "BETTING";


    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value =
        "";


    message.textContent =
        "Withdraw " +
        value.toFixed(2) +
        " TON";


    renderPlayers();

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

    clearInterval(roundTimer);
    clearInterval(waitTimer);


    phase =
        "betting";


    multiplier =
        1;


    crashPoint =
        generateCrash();


    multiplierEl.textContent =
        "1.00x";


    multiplierEl.classList.remove(
        "crashed"
    );


    statusEl.textContent =
        "BETTING OPEN";


    bettingBtn.disabled =
        false;


    createPlayers();


    message.textContent =
        "";


    /*
       5 seconds betting
    */

    let seconds =
        5;


    waitTimer =
        setInterval(
            () => {

                seconds--;


                if(seconds <= 0){

                    clearInterval(
                        waitTimer
                    );

                    startFlight();

                }

            },
            1000
        );

}


/* =====================================================
   START FLIGHT
===================================================== */

function startFlight(){

    phase =
        "running";


    statusEl.textContent =
        "ROCKET FLYING";


    if(!hasBet){

        bettingBtn.disabled =
            true;

    }


    betPanel.classList.remove(
        "show"
    );


    /*
       ضریب از ابتدا شروع می‌شود.

       سرعت افزایش ضریب
       خودش با ضریب بیشتر می‌شود.
    */

    let lastTime =
        performance.now();


    roundTimer =
        setInterval(
            () => {

                const now =
                    performance.now();


                const delta =
                    now -
                    lastTime;


                lastTime =
                    now;


                /*
                   سرعت پویا

                   ضریب پایین:
                   آرام

                   ضریب بالا:
                   سریع‌تر

                */

                const acceleration =
                    0.0000045;


                const baseSpeed =
                    0.0028;


                const speed =
                    baseSpeed +
                    (
                        multiplier *
                        multiplier *
                        acceleration
                    );


                multiplier +=
                    speed *
                    delta;


                /*
                   نمایش ضریب
                */

                multiplierEl.textContent =
                    multiplier.toFixed(2) +
                    "x";


                /*
                   بازیکن‌ها
                */

                updatePlayers();


                /*
                   Crash
                */

                if(
                    multiplier >=
                    crashPoint
                ){

                    crash();

                }

            },
            30
        );

}


/* =====================================================
   CRASH
===================================================== */

function crash(){

    clearInterval(
        roundTimer
    );


    phase =
        "crashed";


    statusEl.textContent =
        "CRASH";


    multiplierEl.classList.add(
        "crashed"
    );


    /*
       هر بازیکنی که برداشت نکرده:
       قرمز می‌شود.
    */

    players.forEach(
        player => {

            if(
                !player.cashed
            ){

                player.crashed =
                    true;

                player.finalMultiplier =
                    multiplier;

                player.finalValue =
                    player.bet *
                    multiplier;

            }

        }
    );


    renderPlayers();


    /*
       انفجار در مرکز
    */

    explosion.classList.remove(
        "active"
    );


    void explosion.offsetWidth;


    explosion.classList.add(
        "active"
    );


    /*
       بعد از انفجار
       Countdown
    */

    setTimeout(
        () => {

            startCountdown();

        },
        850
    );

}


/* =====================================================
   COUNTDOWN 10 -> 1
===================================================== */

function startCountdown(){

    countdown.style.display =
        "flex";


    let n =
        10;


    countNumber.textContent =
        n;


    countdownTimer =
        setInterval(
            () => {

                n--;


                if(n >= 1){

                    countNumber.textContent =
                        n;

                }

                else{

                    clearInterval(
                        countdownTimer
                    );


                    countdown.style.display =
                        "none";


                    /*
                       اگر کاربر Withdraw نکرده،
                       اصل شرط دمو برمی‌گردد.
                    */

                    if(hasBet){

                        balance +=
                            betAmount;

                    }


                    hasBet =
                        false;


                    betAmount =
                        0;


                    updateBalance();


                    bettingBtn.textContent =
                        "BETTING";


                    bettingBtn.classList.remove(
                        "withdraw"
                    );


                    amountInput.value =
                        "";


                    /*
                       دور جدید
                    */

                    startRound();

                }

            },
            1000
        );

}


/* =====================================================
   INITIAL
===================================================== */

startRound();

</script>
