<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTRUX — CRASH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at 50% 30%, #132d5c 0%, #07152d 45%, #020817 100%);
    color:white;
    font-family:Arial, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(2,8,23,.7);
    backdrop-filter:blur(12px);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:18px;
    font-weight:bold;
}

.coin{
    width:25px;
    height:25px;
}

.crash-title{
    font-weight:900;
    letter-spacing:2px;
    color:#60a5fa;
}

.main{
    max-width:1200px;
    margin:auto;
    padding:18px;
}

.game{
    height:500px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.08);
    background:
        radial-gradient(circle at 50% 80%,rgba(37,99,235,.18),transparent 40%),
        linear-gradient(180deg,#081a35,#020817);
}

.grid{
    position:absolute;
    inset:0;
    opacity:.16;
    background-image:
        linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(400px) rotateX(55deg) scale(1.5);
    transform-origin:bottom;
}

.multiplier{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:65px;
    font-weight:900;
    text-shadow:0 0 30px rgba(96,165,250,.35);
    z-index:5;
}

.status{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:#94a3b8;
    font-size:14px;
    z-index:6;
}

.jet{
    position:absolute;
    left:35px;
    bottom:35px;
    width:115px;
    height:45px;
    z-index:4;
    transition:none;
}

.jet-body{
    position:absolute;
    width:90px;
    height:18px;
    top:12px;
    left:10px;
    background:linear-gradient(90deg,#dbeafe,#64748b 55%,#e2e8f0);
    border-radius:50% 15px 15px 50%;
    transform:skewX(-12deg);
}

.jet-nose{
    position:absolute;
    right:2px;
    top:12px;
    width:30px;
    height:18px;
    background:#e2e8f0;
    clip-path:polygon(0 0,100% 50%,0 100%);
}

.jet-wing{
    position:absolute;
    left:35px;
    top:3px;
    width:48px;
    height:20px;
    background:#64748b;
    clip-path:polygon(0 0,100% 50%,0 100%);
}

.jet-tail{
    position:absolute;
    left:8px;
    top:2px;
    width:25px;
    height:30px;
    background:#475569;
    clip-path:polygon(100% 0,100% 100%,0 65%);
}

.flame{
    position:absolute;
    left:0;
    top:15px;
    width:25px;
    height:13px;
    background:linear-gradient(90deg,#f97316,#facc15,transparent);
    clip-path:polygon(100% 50%,0 0,20% 50%,0 100%);
    filter:blur(1px);
}

.explosion{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    width:180px;
    height:180px;
    border-radius:50%;
    background:
        radial-gradient(circle,#fff 0 8%,#facc15 10% 25%,#f97316 35%,#ef4444 50%,transparent 70%);
    opacity:0;
    z-index:20;
}

.explosion.active{
    animation:boom .8s ease-out forwards;
}

@keyframes boom{
    0%{
        transform:translate(-50%,-50%) scale(.2);
        opacity:1;
    }
    70%{
        transform:translate(-50%,-50%) scale(1.5);
        opacity:.9;
    }
    100%{
        transform:translate(-50%,-50%) scale(2);
        opacity:0;
    }
}

.countdown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.3);
    backdrop-filter:blur(3px);
    z-index:30;
}

.countdown-number{
    font-size:150px;
    font-weight:900;
    text-shadow:0 0 50px rgba(96,165,250,.7);
    animation:countPop .8s ease;
}

@keyframes countPop{
    from{
        transform:scale(1.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* BET PANEL */

.controls{
    margin-top:15px;
    display:flex;
    justify-content:center;
}

.betting-btn,
.start-btn,
.withdraw-btn{
    border:0;
    border-radius:12px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s;
}

.betting-btn{
    min-width:230px;
    padding:16px 35px;
    background:#2563eb;
    color:white;
    font-size:17px;
}

.betting-btn:hover{
    background:#3b82f6;
    transform:translateY(-2px);
}

.bet-panel{
    display:none;
    width:100%;
    max-width:500px;
    margin:auto;
    padding:18px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(15,23,42,.9);
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.bet-panel.active{
    display:block;
}

.bet-title{
    text-align:center;
    font-weight:900;
    margin-bottom:13px;
    letter-spacing:1px;
}

.bet-row{
    display:flex;
    gap:10px;
}

.amount-input{
    flex:1;
    min-width:0;
    padding:15px;
    border-radius:11px;
    border:1px solid #334155;
    background:#020817;
    color:white;
    outline:none;
    font-size:17px;
    font-weight:bold;
}

.amount-input:focus{
    border-color:#3b82f6;
}

.start-btn{
    padding:0 25px;
    background:#22c55e;
    color:#04120a;
}

.start-btn:hover{
    background:#4ade80;
}

.withdraw-btn{
    padding:0 25px;
    background:#f59e0b;
    color:#211000;
}

.withdraw-btn:hover{
    background:#fbbf24;
}

.bet-message{
    min-height:22px;
    text-align:center;
    margin-top:10px;
    color:#94a3b8;
    font-size:13px;
}

.players{
    margin-top:15px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(2,8,23,.7);
}

.players-header,
.player{
    display:grid;
    grid-template-columns:1fr 110px 110px;
    align-items:center;
    gap:10px;
    padding:13px 16px;
}

.players-header{
    color:#64748b;
    font-size:12px;
    text-transform:uppercase;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.player{
    border-bottom:1px solid rgba(255,255,255,.05);
}

.player:last-child{
    border-bottom:0;
}

.player-name{
    font-weight:bold;
}

.player-amount{
    text-align:right;
    color:#cbd5e1;
}

.player-value{
    text-align:right;
    color:#60a5fa;
    font-weight:bold;
}

.user-row{
    background:rgba(37,99,235,.09);
}

@media(max-width:600px){

    .header{
        padding:0 12px;
    }

    .logo{
        font-size:20px;
    }

    .crash-title{
        font-size:13px;
    }

    .game{
        height:420px;
    }

    .multiplier{
        font-size:50px;
    }

    .countdown-number{
        font-size:110px;
    }

    .players-header,
    .player{
        grid-template-columns:1fr 85px 90px;
        padding:12px 10px;
        font-size:12px;
    }

    .bet-row{
        flex-direction:column;
    }

    .start-btn,
    .withdraw-btn{
        height:48px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">UTRUX</div>

    <div class="balance">
        <span id="balance">100.00</span>

        <svg class="coin" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="#1689e8"/>
            <circle cx="50" cy="50" r="38" fill="#0b6fc2"/>
            <path
                d="M35 25h30v8H56v35h-9V33H35z
                   M30 45h40v8H30z"
                fill="white"/>
        </svg>
    </div>

    <div class="crash-title">CRASH</div>

</header>


<main class="main">

    <section class="game">

        <div class="grid"></div>

        <div class="status" id="status">
            WAITING
        </div>

        <div class="multiplier" id="multiplier">
            1.00x
        </div>

        <div class="jet" id="jet">

            <div class="flame"></div>
            <div class="jet-body"></div>
            <div class="jet-nose"></div>
            <div class="jet-wing"></div>
            <div class="jet-tail"></div>

        </div>

        <div class="explosion" id="explosion"></div>

        <div class="countdown" id="countdown">
            <div class="countdown-number" id="countdownNumber">
                10
            </div>
        </div>

    </section>


    <!-- BETTING -->

    <section class="controls">

        <button
            class="betting-btn"
            id="bettingBtn">
            BETTING
        </button>

        <div
            class="bet-panel"
            id="betPanel">

            <div class="bet-title">
                ENTER AMOUNT
            </div>

            <div class="bet-row">

                <input
                    id="amountInput"
                    class="amount-input"
                    type="number"
                    min="0.1"
                    step="0.1"
                    placeholder="Amount TON">

                <button
                    id="startBtn"
                    class="start-btn">
                    START
                </button>

            </div>

            <div
                class="bet-message"
                id="betMessage">
            </div>

        </div>

    </section>


    <!-- PLAYERS -->

    <section class="players">

        <div class="players-header">
            <div>PLAYER</div>
            <div style="text-align:right">BET</div>
            <div style="text-align:right">VALUE</div>
        </div>

        <div id="playersList"></div>

    </section>

</main>


<script>

const balanceEl = document.getElementById("balance");
const bettingBtn = document.getElementById("bettingBtn");
const betPanel = document.getElementById("betPanel");
const amountInput = document.getElementById("amountInput");
const startBtn = document.getElementById("startBtn");
const betMessage = document.getElementById("betMessage");

const multiplierEl = document.getElementById("multiplier");
const statusEl = document.getElementById("status");
const jet = document.getElementById("jet");

const explosion = document.getElementById("explosion");

const countdown = document.getElementById("countdown");
const countdownNumber = document.getElementById("countdownNumber");

const playersList = document.getElementById("playersList");


/* =========================
   BALANCE
========================= */

let balance = parseFloat(
    localStorage.getItem("utruxBalance")
);

if(!Number.isFinite(balance)){
    balance = 100;
}

function saveBalance(){
    localStorage.setItem(
        "utruxBalance",
        balance.toFixed(2)
    );
}

function updateBalance(){
    balanceEl.textContent = balance.toFixed(2);
    saveBalance();
}

updateBalance();


/* =========================
   GAME STATE
========================= */

let phase = "waiting";

let multiplier = 1;

let crashPoint = 0;

let roundTimer = null;

let countdownTimer = null;

let joinedAmount = 0;

let hasBet = false;

let players = [];


/* =========================
   FAKE NAMES
========================= */

const names = [
    "Alex",
    "Shadow",
    "CryptoX",
    "Nexus",
    "Arman",
    "Storm",
    "Hunter",
    "Zero",
    "Phoenix",
    "Dark",
    "Nova",
    "Titan",
    "Ghost",
    "Max",
    "Viper",
    "Wolf",
    "King",
    "Blaze",
    "Neo",
    "Lucky"
];


/* =========================
   FAKE AMOUNT
========================= */

function fakeAmount(){

    const r = Math.random();

    if(r < 0.80){

        return 0.1 + Math.random() * 0.9;

    }

    if(r < 0.93){

        return 1 + Math.random() * 9;

    }

    if(r < 0.98){

        return 10 + Math.random() * 90;

    }

    return 100 + Math.random() * 900;
}


/* =========================
   CRASH POINT
========================= */

function generateCrashPoint(){

    const r = Math.random();

    if(r < 0.40){

        return 1 + Math.random() * 0.30;

    }

    if(r < 0.75){

        return 1.30 + Math.random() * 1.20;

    }

    if(r < 0.845){

        return 2.50 + Math.random() * 2.50;

    }

    if(r < 0.945){

        return 5 + Math.random() * 2;

    }

    if(r < 0.95){

        return 100 + Math.random() * 100;

    }

    return 7 + Math.random() * 18;
}


/* =========================
   CREATE PLAYERS
========================= */

function createPlayers(){

    players = [];

    const shuffled = [...names]
        .sort(() => Math.random() - 0.5);

    for(let i = 0; i < 7; i++){

        players.push({
            name: shuffled[i],
            amount: fakeAmount()
        });

    }

    renderPlayers();
}


/* =========================
   RENDER PLAYERS
========================= */

function renderPlayers(){

    let html = "";

    if(hasBet){

        html += `
            <div class="player user-row">

                <div class="player-name">
                    YOU
                </div>

                <div class="player-amount">
                    ${joinedAmount.toFixed(2)} TON
                </div>

                <div
                    class="player-value"
                    id="userValue">
                    ${joinedAmount.toFixed(2)} TON
                </div>

            </div>
        `;

    }

    players.forEach(player => {

        html += `
            <div class="player">

                <div class="player-name">
                    ${player.name}
                </div>

                <div class="player-amount">
                    ${player.amount.toFixed(2)} TON
                </div>

                <div
                    class="player-value"
                    data-base="${player.amount}">
                    ${player.amount.toFixed(2)} TON
                </div>

            </div>
        `;

    });

    playersList.innerHTML = html;
}


/* =========================
   UPDATE VALUES
========================= */

function updatePlayerValues(){

    document
        .querySelectorAll("[data-base]")
        .forEach(el => {

            const base =
                parseFloat(el.dataset.base);

            el.textContent =
                (base * multiplier).toFixed(2) + " TON";

        });


    const userValue =
        document.getElementById("userValue");

    if(userValue && hasBet){

        userValue.textContent =
            (joinedAmount * multiplier).toFixed(2)
            + " TON";

    }
}


/* =========================
   BETTING BUTTON
========================= */

bettingBtn.addEventListener("click", () => {

    if(hasBet){

        betMessage.textContent =
            "You already joined this round.";

        return;

    }

    betPanel.classList.toggle("active");

    if(betPanel.classList.contains("active")){

        amountInput.focus();

    }

});


/* =========================
   START / WITHDRAW
========================= */

startBtn.addEventListener("click", () => {

    /* WITHDRAW */

    if(hasBet){

        withdraw();

        return;

    }


    /* START */

    if(phase !== "waiting"){

        betMessage.textContent =
            "Wait for the next round.";

        return;

    }

    const amount =
        parseFloat(amountInput.value);


    if(!Number.isFinite(amount) || amount <= 0){

        betMessage.textContent =
            "Enter a valid amount.";

        return;

    }


    if(amount > balance){

        betMessage.textContent =
            "Not enough TON.";

        return;

    }


    /* DEDUCT */

    balance -= amount;

    joinedAmount = amount;

    hasBet = true;

    updateBalance();


    /* CHANGE START TO WITHDRAW */

    startBtn.textContent = "WITHDRAW";

    startBtn.classList.remove("start-btn");

    startBtn.classList.add("withdraw-btn");

    amountInput.disabled = true;

    betMessage.textContent =
        "Bet accepted.";

    renderPlayers();

});


/* =========================
   WITHDRAW
========================= */

function withdraw(){

    if(!hasBet){

        return;

    }


    /*
       Demo only:
       The current displayed value is returned
       to the virtual balance.
    */

    const value =
        joinedAmount * multiplier;


    balance += value;

    joinedAmount = 0;

    hasBet = false;


    updateBalance();


    amountInput.disabled = false;

    amountInput.value = "";

    startBtn.textContent = "START";

    startBtn.classList.remove("withdraw-btn");

    startBtn.classList.add("start-btn");

    betMessage.textContent =
        "Withdraw completed.";


    renderPlayers();

}


/* =========================
   RESET BET FOR NEW ROUND
========================= */

function resetBet(){

    /*
       If player did not withdraw before crash,
       the original amount is returned.
       No real-money payout exists.
    */

    if(hasBet){

        balance += joinedAmount;

    }

    joinedAmount = 0;

    hasBet = false;

    amountInput.disabled = false;

    amountInput.value = "";

    startBtn.textContent = "START";

    startBtn.classList.remove("withdraw-btn");

    startBtn.classList.add("start-btn");

    updateBalance();

    renderPlayers();

}


/* =========================
   JET POSITION
========================= */

function resetJet(){

    jet.style.left = "35px";
    jet.style.bottom = "35px";

}


function updateJet(){

    const progress =
        Math.min(
            1,
            (multiplier - 1) /
            Math.max(1, crashPoint - 1)
        );

    const x =
        35 + progress * 700;

    const y =
        35 + progress * 300;

    jet.style.left = x + "px";

    jet.style.bottom = y + "px";

}


/* =========================
   START ROUND
========================= */

function startRound(){

    clearInterval(roundTimer);

    phase = "waiting";

    multiplier = 1;

    crashPoint = generateCrashPoint();

    resetJet();

    multiplierEl.textContent =
        "1.00x";

    statusEl.textContent =
        "BETTING OPEN";

    createPlayers();


    /*
       5 seconds for betting.
    */

    let wait = 5;

    bettingBtn.disabled = false;

    betMessage.textContent =
        "Betting is open.";

    const waitTimer =
        setInterval(() => {

            wait--;

            if(wait <= 0){

                clearInterval(waitTimer);

                beginFlight();

            }

        },1000);

}


/* =========================
   FLIGHT
========================= */

function beginFlight(){

    phase = "running";

    statusEl.textContent =
        "FLYING";

    bettingBtn.disabled = true;

    betPanel.classList.remove("active");

    let speed = 0.012;

    roundTimer = setInterval(() => {

        multiplier += speed;

        speed += 0.00025;

        multiplierEl.textContent =
            multiplier.toFixed(2) + "x";

        updatePlayerValues();

        updateJet();


        if(multiplier >= crashPoint){

            crash();

        }

    },50);

}


/* =========================
   CRASH
========================= */

function crash(){

    clearInterval(roundTimer);

    phase = "crashed";

    statusEl.textContent =
        "CRASH";

    explosion.classList.remove("active");

    void explosion.offsetWidth;

    explosion.classList.add("active");


    setTimeout(() => {

        startCountdown();

    },800);

}


/* =========================
   COUNTDOWN 10 → 1
========================= */

function startCountdown(){

    countdown.style.display =
        "flex";

    let number = 10;

    countdownNumber.textContent =
        number;


    countdownTimer =
        setInterval(() => {

            number--;

            if(number >= 1){

                countdownNumber.textContent =
                    number;

                countdownNumber.style.animation =
                    "none";

                void countdownNumber.offsetWidth;

                countdownNumber.style.animation =
                    "countPop .8s ease";

            }
            else{

                clearInterval(countdownTimer);

                countdown.style.display =
                    "none";


                /*
                   Return old bet if it wasn't withdrawn.
                */

                resetBet();

                /*
                   New round
                */

                startRound();

            }

        },1000);

}


/* =========================
   INITIAL
========================= */

renderPlayers();

startRound();

</script>

</body>
</html>
