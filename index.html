<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UTRUX Rocket</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07111f;
    --panel:#0c1828;
    --panel2:#101f32;
    --line:rgba(255,255,255,.07);
    --text:#fff;
    --muted:#8190a5;
    --blue:#238cff;
    --green:#27d17f;
    --red:#ff4d67;
    --gold:#ffc857;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#183b68 0%,transparent 42%),
        #050c16;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

/* HEADER */

.header{
    height:64px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:rgba(5,12,22,.88);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    font-weight:900;
    font-size:20px;
    letter-spacing:1.5px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;
    background:#0d1a2a;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 11px;
    font-weight:800;
}

.coin{
    width:22px;
    height:22px;
}

/* MAIN */

.container{
    width:min(100%,850px);
    margin:auto;
    padding:12px;
}

/* GAME */

.game{
    height:470px;
    border:1px solid var(--line);
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:
        radial-gradient(circle at 50% 70%,rgba(35,140,255,.16),transparent 35%),
        linear-gradient(180deg,#08182a,#050b14);
}

/* stars */

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#8fc8ff 1px,transparent 1px);
    background-size:91px 83px,137px 121px;
    background-position:10px 20px,40px 70px;
    opacity:.18;
}

/* grid */

.grid{
    position:absolute;
    left:-20%;
    right:-20%;
    bottom:-120px;
    height:300px;
    opacity:.14;
    transform:perspective(350px) rotateX(58deg);
    background-image:
        linear-gradient(rgba(50,150,255,.5) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,150,255,.5) 1px,transparent 1px);
    background-size:45px 45px;
}

/* status */

.status{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    z-index:10;
}

/* multiplier */

.multiplier{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    font-size:72px;
    font-weight:900;
    letter-spacing:-3px;
    text-shadow:0 0 35px rgba(35,140,255,.35);
    z-index:10;
}

.multiplier.crashed{
    color:var(--red);
    text-shadow:0 0 35px rgba(255,77,103,.35);
}

/* rocket */

.rocket-wrap{
    position:absolute;
    left:35px;
    bottom:45px;
    width:92px;
    height:150px;
    transform:rotate(-28deg);
    z-index:8;
    will-change:left,bottom;
}

.rocket{
    position:absolute;
    width:45px;
    height:100px;
    left:23px;
    top:15px;
    border-radius:50% 50% 42% 42%;
    background:linear-gradient(90deg,#d8e7f5,#fff 48%,#8da4bd);
    box-shadow:
        inset -7px 0 12px rgba(0,0,0,.2),
        0 0 18px rgba(255,255,255,.15);
}

.rocket:before{
    content:"";
    position:absolute;
    top:-18px;
    left:0;
    width:45px;
    height:38px;
    background:#f1f7fc;
    border-radius:50% 50% 15% 15%;
}

.window{
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#228cff;
    border:3px solid #31506d;
    left:15px;
    top:22px;
    box-shadow:0 0 10px rgba(35,140,255,.8);
}

.fin-left,
.fin-right{
    position:absolute;
    bottom:13px;
    width:25px;
    height:38px;
    background:#55708c;
}

.fin-left{
    left:-20px;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.fin-right{
    right:-20px;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.flame{
    position:absolute;
    left:8px;
    bottom:-45px;
    width:29px;
    height:65px;
    background:linear-gradient(
        180deg,
        #fff 0%,
        #ffdd45 25%,
        #ff8a21 55%,
        #ff3658 100%
    );
    clip-path:polygon(
        50% 100%,
        0 25%,
        30% 40%,
        38% 0,
        62% 40%,
        100% 25%
    );
    filter:drop-shadow(0 0 12px #ff6b2c);
    animation:flame .08s infinite alternate;
}

@keyframes flame{
    from{
        transform:scaleY(.9);
    }
    to{
        transform:scaleY(1.1);
    }
}

/* explosion */

.explosion{
    position:absolute;
    width:180px;
    height:180px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.1);
    border-radius:50%;
    opacity:0;
    z-index:30;
    background:
        radial-gradient(circle,
        #fff 0 5%,
        #ffe16b 8%,
        #ff9f1c 24%,
        #ff4d3d 42%,
        rgba(255,50,60,.2) 65%,
        transparent 72%);
}

.explosion.active{
    animation:explode .9s forwards;
}

@keyframes explode{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.15);
    }
    45%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.8);
    }
}

/* countdown */

.countdown{
    position:absolute;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,9,17,.48);
    backdrop-filter:blur(5px);
}

.count-number{
    font-size:145px;
    font-weight:900;
    text-shadow:0 0 50px rgba(35,140,255,.7);
}

/* controls */

.control-area{
    margin-top:10px;
}

.betting{
    width:100%;
    border:0;
    border-radius:15px;
    padding:17px;
    background:var(--blue);
    color:white;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(35,140,255,.18);
}

.betting:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.panel{
    display:none;
    padding:13px;
    margin-top:9px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:17px;
}

.panel.show{
    display:block;
}

.input-row{
    display:flex;
    gap:8px;
}

.amount{
    flex:1;
    min-width:0;
    background:#07111d;
    border:1px solid #23364c;
    border-radius:11px;
    color:white;
    padding:14px;
    outline:none;
}

.amount:focus{
    border-color:var(--blue);
}

.action{
    min-width:105px;
    border:0;
    border-radius:11px;
    background:var(--green);
    color:#03140b;
    font-weight:900;
    cursor:pointer;
}

.action.withdraw{
    background:var(--gold);
}

.message{
    min-height:20px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding-top:8px;
}

/* players */

.players{
    margin-top:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
}

.players-head,
.player{
    display:grid;
    grid-template-columns:1fr 95px 105px;
    gap:8px;
    align-items:center;
    padding:13px 14px;
}

.players-head{
    color:#607086;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
}

.player{
    border-bottom:1px solid rgba(255,255,255,.045);
    font-size:13px;
}

.player:last-child{
    border-bottom:0;
}

.player.you{
    background:rgba(35,140,255,.09);
}

.player-name{
    font-weight:800;
}

.bet-value{
    text-align:right;
    color:#a6b5c7;
}

.current-value{
    text-align:right;
    color:#54a8ff;
    font-weight:900;
}

/* mobile */

@media(max-width:600px){

    .game{
        height:420px;
        border-radius:19px;
    }

    .multiplier{
        font-size:57px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{
        grid-template-columns:1fr 80px 90px;
        padding:12px 10px;
        font-size:11px;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="brand">UTRUX</div>

    <div class="balance">
        <span id="balance">100.00</span>

        <svg class="coin" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="#1689e8"/>
            <circle cx="50" cy="50" r="38" fill="#0c72c8"/>
            <path
                d="M35 24h30v9H56v34h-9V33H35zM30 45h40v9H30z"
                fill="white"/>
        </svg>
    </div>

</header>


<main class="container">

    <section class="game">

        <div class="stars"></div>
        <div class="grid"></div>

        <div
            class="status"
            id="status">
            BETTING OPEN
        </div>

        <div
            class="multiplier"
            id="multiplier">
            1.00x
        </div>


        <div
            class="rocket-wrap"
            id="rocketWrap">

            <div class="rocket">

                <div class="window"></div>

                <div class="fin-left"></div>
                <div class="fin-right"></div>

                <div class="flame"></div>

            </div>

        </div>


        <div
            class="explosion"
            id="explosion">
        </div>


        <div
            class="countdown"
            id="countdown">

            <div
                class="count-number"
                id="countNumber">
                10
            </div>

        </div>

    </section>


    <section class="control-area">

        <button
            class="betting"
            id="bettingBtn">
            BETTING
        </button>


        <div
            class="panel"
            id="panel">

            <div class="input-row">

                <input
                    class="amount"
                    id="amount"
                    type="number"
                    min="0.1"
                    step="0.1"
                    placeholder="Amount">

                <button
                    class="action"
                    id="actionBtn">
                    START
                </button>

            </div>

            <div
                class="message"
                id="message">
            </div>

        </div>

    </section>


    <section class="players">

        <div class="players-head">
            <div>PLAYER</div>
            <div style="text-align:right">BET</div>
            <div style="text-align:right">VALUE</div>
        </div>

        <div id="playersList"></div>

    </section>

</main>


<script>

/* ================================
   ELEMENTS
================================ */

const balanceEl =
    document.getElementById("balance");

const bettingBtn =
    document.getElementById("bettingBtn");

const panel =
    document.getElementById("panel");

const amountInput =
    document.getElementById("amount");

const actionBtn =
    document.getElementById("actionBtn");

const message =
    document.getElementById("message");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const rocket =
    document.getElementById("rocketWrap");

const explosion =
    document.getElementById("explosion");

const countdown =
    document.getElementById("countdown");

const countNumber =
    document.getElementById("countNumber");

const playersList =
    document.getElementById("playersList");


/* ================================
   BALANCE
================================ */

let balance =
    parseFloat(localStorage.getItem("utruxRocketBalance"));

if(!Number.isFinite(balance)){
    balance = 100;
}

function saveBalance(){
    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );
}

function updateBalance(){
    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();
}

updateBalance();


/* ================================
   STATE
================================ */

let phase = "betting";

let multiplier = 1;

let crashPoint = 0;

let roundTimer = null;

let countdownTimer = null;

let waitTimer = null;

let hasBet = false;

let betAmount = 0;

let cashedValue = 0;


/* ================================
   NAMES
================================ */

const names = [
    "Alex",
    "Shadow",
    "Nexus",
    "Phoenix",
    "Nova",
    "Ghost",
    "Titan",
    "Viper",
    "Storm",
    "Zero",
    "Wolf",
    "Neo",
    "Blaze",
    "Lucky",
    "Hunter",
    "Max",
    "Dark",
    "King"
];


/* ================================
   FAKE BET
================================ */

function fakeBet(){

    const r = Math.random();

    if(r < .80){
        return .1 + Math.random() * .9;
    }

    if(r < .93){
        return 1 + Math.random() * 9;
    }

    if(r < .98){
        return 10 + Math.random() * 90;
    }

    return 100 + Math.random() * 900;
}


/* ================================
   CRASH
================================ */

function getCrashPoint(){

    const r = Math.random();

    if(r < .40)
        return 1 + Math.random() * .3;

    if(r < .75)
        return 1.3 + Math.random() * 1.2;

    if(r < .845)
        return 2.5 + Math.random() * 2.5;

    if(r < .945)
        return 5 + Math.random() * 2;

    if(r < .95)
        return 100 + Math.random() * 100;

    return 7 + Math.random() * 18;
}


/* ================================
   PLAYERS
================================ */

let players = [];

function createPlayers(){

    players = [];

    const shuffled =
        [...names].sort(() => Math.random() - .5);

    for(let i=0;i<7;i++){

        players.push({
            name:shuffled[i],
            bet:fakeBet()
        });

    }

    renderPlayers();
}


function renderPlayers(){

    let html = "";

    if(hasBet){

        html += `
        <div class="player you">

            <div class="player-name">
                YOU
            </div>

            <div class="bet-value">
                ${betAmount.toFixed(2)}
            </div>

            <div
                class="current-value"
                id="userValue">
                ${betAmount.toFixed(2)}
            </div>

        </div>
        `;

    }


    players.forEach(p => {

        html += `
        <div class="player">

            <div class="player-name">
                ${p.name}
            </div>

            <div class="bet-value">
                ${p.bet.toFixed(2)}
            </div>

            <div
                class="current-value"
                data-bet="${p.bet}">
                ${p.bet.toFixed(2)}
            </div>

        </div>
        `;

    });


    playersList.innerHTML = html;

}


/* ================================
   VALUES
================================ */

function updateValues(){

    document
        .querySelectorAll("[data-bet]")
        .forEach(el => {

            const bet =
                parseFloat(el.dataset.bet);

            el.textContent =
                (bet * multiplier).toFixed(2);

        });


    const userValue =
        document.getElementById("userValue");

    if(userValue && hasBet){

        userValue.textContent =
            (betAmount * multiplier).toFixed(2);

    }

}


/* ================================
   ROCKET
================================ */

function resetRocket(){

    rocket.style.left = "35px";
    rocket.style.bottom = "45px";

}


function moveRocket(){

    const progress =
        Math.min(
            1,
            (multiplier - 1) /
            Math.max(.5,crashPoint - 1)
        );

    const x =
        35 + progress * 690;

    const y =
        45 + progress * 300;

    rocket.style.left = x + "px";
    rocket.style.bottom = y + "px";

}


/* ================================
   BETTING
================================ */

bettingBtn.addEventListener(
    "click",
    () => {

        if(phase !== "betting"){

            message.textContent =
                "Wait for the next round.";

            panel.classList.add("show");

            return;

        }


        panel.classList.toggle("show");

        if(panel.classList.contains("show")){
            amountInput.focus();
        }

    }
);


/* ================================
   START / WITHDRAW
================================ */

actionBtn.addEventListener(
    "click",
    () => {

        /* WITHDRAW */

        if(hasBet){

            withdraw();

            return;

        }


        /* START */

        if(phase !== "betting"){

            message.textContent =
                "Betting is closed.";

            return;

        }


        const value =
            parseFloat(amountInput.value);


        if(!Number.isFinite(value) || value <= 0){

            message.textContent =
                "Enter a valid amount.";

            return;

        }


        if(value > balance){

            message.textContent =
                "Not enough TON.";

            return;

        }


        balance -= value;

        betAmount = value;

        hasBet = true;

        updateBalance();


        actionBtn.textContent =
            "WITHDRAW";

        actionBtn.classList.add(
            "withdraw"
        );

        amountInput.disabled = true;

        message.textContent =
            "Bet accepted.";

        renderPlayers();

    }
);


/* ================================
   WITHDRAW
================================ */

function withdraw(){

    if(!hasBet)
        return;


    const value =
        betAmount * multiplier;


    balance += value;

    cashedValue = value;

    hasBet = false;

    betAmount = 0;


    updateBalance();


    amountInput.disabled = false;
    amountInput.value = "";

    actionBtn.textContent =
        "START";

    actionBtn.classList.remove(
        "withdraw"
    );

    message.textContent =
        "Withdraw: " +
        cashedValue.toFixed(2) +
        " TON";


    renderPlayers();

}


/* ================================
   RESET BET
================================ */

function resetBet(){

    /*
      If the player did not withdraw,
      return only the original entry amount.
    */

    if(hasBet){

        balance += betAmount;

    }

    hasBet = false;

    betAmount = 0;

    amountInput.disabled = false;
    amountInput.value = "";

    actionBtn.textContent =
        "START";

    actionBtn.classList.remove(
        "withdraw"
    );

    updateBalance();

    renderPlayers();

}


/* ================================
   START ROUND
================================ */

function startRound(){

    clearInterval(roundTimer);
    clearInterval(waitTimer);

    phase = "betting";

    multiplier = 1;

    crashPoint =
        getCrashPoint();

    resetRocket();

    multiplierEl.textContent =
        "1.00x";

    multiplierEl.classList.remove(
        "crashed"
    );

    statusEl.textContent =
        "BETTING OPEN";

    bettingBtn.disabled = false;

    createPlayers();


    let seconds = 5;

    message.textContent =
        "Betting is open";


    waitTimer =
        setInterval(() => {

            seconds--;

            if(seconds <= 0){

                clearInterval(waitTimer);

                startFlight();

            }

        },1000);

}


/* ================================
   FLIGHT
================================ */

function startFlight(){

    phase = "running";

    statusEl.textContent =
        "ROCKET FLYING";

    bettingBtn.disabled = true;

    panel.classList.remove("show");


    let acceleration = .012;


    roundTimer =
        setInterval(() => {

            multiplier += acceleration;

            acceleration += .00025;


            multiplierEl.textContent =
                multiplier.toFixed(2) + "x";


            updateValues();

            moveRocket();


            if(multiplier >= crashPoint){

                crash();

            }

        },50);

}


/* ================================
   CRASH
================================ */

function crash(){

    clearInterval(roundTimer);

    phase = "crashed";

    statusEl.textContent =
        "CRASHED";

    multiplierEl.classList.add(
        "crashed"
    );

    explosion.classList.remove(
        "active"
    );

    void explosion.offsetWidth;

    explosion.classList.add(
        "active"
    );


    setTimeout(() => {

        startCountdown();

    },700);

}


/* ================================
   COUNTDOWN
================================ */

function startCountdown(){

    countdown.style.display =
        "flex";

    let n = 10;

    countNumber.textContent = n;


    countdownTimer =
        setInterval(() => {

            n--;

            if(n >= 1){

                countNumber.textContent = n;

            }
            else{

                clearInterval(
                    countdownTimer
                );

                countdown.style.display =
                    "none";


                resetBet();

                startRound();

            }

        },1000);

}


/* ================================
   START
================================ */

createPlayers();

resetRocket();

startRound();

</script>

</body>
</html>
