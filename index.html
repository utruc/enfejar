<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTRUX ROCKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%,#183b66,transparent 45%),
        linear-gradient(#040a12,#02050a);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit;
}

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(3,9,17,.95);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    border-radius:50px;
    background:#0d1928;
    font-weight:900;
}

.coin{
    width:22px;
    height:22px;
}

.container{
    width:min(900px,100%);
    margin:auto;
    padding:12px;
}


/* ================= GAME ================= */

.game{
    position:relative;
    height:480px;
    overflow:hidden;
    border-radius:23px;
    border:1px solid rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(38,140,255,.18),
            transparent 38%
        ),
        linear-gradient(#08192d,#040a12);
}

.stars{
    position:absolute;
    inset:0;
    opacity:.2;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#4faaff 1px,transparent 1px);

    background-size:90px 90px,145px 130px;
}

.grid{
    position:absolute;
    left:-20%;
    right:-20%;
    bottom:-130px;
    height:340px;
    opacity:.13;

    transform:
        perspective(380px)
        rotateX(58deg);

    background-image:
        linear-gradient(rgba(38,140,255,.6) 1px,transparent 1px),
        linear-gradient(90deg,rgba(38,140,255,.6) 1px,transparent 1px);

    background-size:45px 45px;
}

.status{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:#73859b;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    z-index:40;
}


/* ================= MULTIPLIER ================= */

.multiplier{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    font-size:76px;
    font-weight:900;
    letter-spacing:-3px;

    z-index:35;

    text-shadow:
        0 0 25px rgba(38,140,255,.25),
        0 0 55px rgba(38,140,255,.15);
}

.multiplier.crashed{
    color:#ff4d64;

    text-shadow:
        0 0 30px rgba(255,77,100,.6);
}


/* ================= ROCKET ================= */

/*
    این کانتینر با JS از پایین چپ
    به مرکز حرکت می‌کند.
*/

.rocket-wrap{
    position:absolute;

    left:50%;
    top:50%;

    width:120px;
    height:120px;

    z-index:20;

    opacity:0;

    transform:
        translate(-50%,-50%)
        translate(-330px,180px);

    transition:
        transform 1.8s cubic-bezier(.18,.8,.25,1),
        opacity .35s;
}


/*
    وقتی پرواز شروع شد:
    پایین چپ → مرکز
*/

.rocket-wrap.fly-to-center{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translate(0,0);
}


/*
    بعد از رسیدن به مرکز،
    راکت همانجا شناور می‌ماند.
*/

.rocket-wrap.hovering .rocket-flight{
    animation:
        rocketHover
        .65s
        ease-in-out
        infinite;
}

.rocket-flight{
    position:absolute;
    inset:0;
}


/*
    دماغه راکت رو به بالا راست
*/

.rocket{
    position:absolute;

    left:39px;
    top:22px;

    width:42px;
    height:90px;

    border-radius:
        50%
        50%
        44%
        44%;

    transform:rotate(35deg);

    background:
        linear-gradient(
            90deg,
            #70879b,
            #f5faff 38%,
            #fff 55%,
            #8196a8
        );

    box-shadow:
        inset -6px 0 10px rgba(0,0,0,.2),
        0 0 20px rgba(255,255,255,.12);
}

.rocket::before{
    content:"";

    position:absolute;

    left:0;
    top:-18px;

    width:42px;
    height:36px;

    border-radius:
        50%
        50%
        20%
        20%;

    background:
        linear-gradient(
            90deg,
            #91a5b7,
            #fff 50%,
            #8195a7
        );
}

.window{
    position:absolute;

    width:17px;
    height:17px;

    left:12px;
    top:21px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e5f7ff,
            #268fff 45%,
            #064b91
        );

    border:3px solid #526a81;

    box-shadow:
        0 0 13px rgba(38,140,255,.9);
}

.body-line{
    position:absolute;

    width:4px;
    height:57px;

    left:19px;
    top:17px;

    border-radius:10px;

    background:rgba(80,110,135,.32);
}

.fin-left{
    position:absolute;

    left:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            135deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.fin-right{
    position:absolute;

    right:-21px;
    bottom:8px;

    width:28px;
    height:41px;

    background:
        linear-gradient(
            225deg,
            #3c566d,
            #7890a5
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.engine{
    position:absolute;

    left:8px;
    bottom:-9px;

    width:26px;
    height:17px;

    border-radius:
        0 0 12px 12px;

    background:#354b60;
}

.flame{
    position:absolute;

    left:8px;
    bottom:-64px;

    width:27px;
    height:66px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe15a 20%,
            #ff9c21 52%,
            #ff3d5d
        );

    clip-path:
        polygon(
            50% 100%,
            5% 35%,
            30% 48%,
            39% 0,
            61% 48%,
            95% 35%
        );

    filter:
        drop-shadow(0 0 13px #ff7b28);

    animation:
        flame .07s
        infinite
        alternate;
}


/*
    لرزش خیلی کم راکت در مرکز
*/

@keyframes rocketHover{

    0%{
        transform:
            translate(0,0)
            rotate(-1deg);
    }

    50%{
        transform:
            translate(3px,-4px)
            rotate(1deg);
    }

    100%{
        transform:
            translate(-2px,2px)
            rotate(-1deg);
    }
}

@keyframes flame{

    from{
        transform:scaleY(.88);
    }

    to{
        transform:scaleY(1.12);
    }
}


/* ================= EXPLOSION ================= */

.explosion{
    position:absolute;

    left:50%;
    top:50%;

    width:190px;
    height:190px;

    transform:
        translate(-50%,-50%)
        scale(.1);

    opacity:0;

    z-index:60;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0 5%,
            #ffe56c 8%,
            #ff9d22 25%,
            #ff4e3d 45%,
            rgba(255,55,65,.15) 67%,
            transparent 73%
        );
}

.explosion.active{
    animation:
        explode .9s
        ease-out
        forwards;
}

@keyframes explode{

    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    45%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.9);
    }
}


/* ================= COUNTDOWN ================= */

.countdown{
    position:absolute;
    inset:0;

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(2,7,13,.52);

    backdrop-filter:blur(5px);
}

.count-number{
    font-size:145px;
    font-weight:900;

    text-shadow:
        0 0 55px rgba(38,140,255,.75);
}


/* ================= BUTTONS ================= */

.controls{
    margin-top:10px;
}

.betting-btn{
    width:100%;

    border:0;
    border-radius:15px;

    padding:17px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #268cff,
            #1767ca
        );

    font-size:17px;
    font-weight:900;

    cursor:pointer;
}

.betting-btn.withdraw{
    background:
        linear-gradient(
            135deg,
            #ffc94d,
            #ed9e14
        );

    color:#241700;
}

.betting-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* ================= BET PANEL ================= */

.bet-panel{
    display:none;

    margin-top:8px;

    padding:13px;

    border-radius:16px;

    background:#0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.bet-panel.show{
    display:block;
}

.bet-row{
    display:flex;
    gap:8px;
}

.amount{
    flex:1;
    min-width:0;

    padding:14px;

    border-radius:11px;
    border:1px solid #263c55;

    outline:none;

    background:#050c15;
    color:white;

    font-weight:800;
}

.start{
    min-width:100px;

    border:0;
    border-radius:11px;

    background:#20d486;

    color:#03140c;

    font-weight:900;

    cursor:pointer;
}

.message{
    min-height:20px;

    padding-top:8px;

    text-align:center;

    font-size:12px;

    color:#73859b;
}


/* ================= PLAYERS ================= */

.players{
    margin-top:10px;

    overflow:hidden;

    border-radius:18px;

    background:#0b1625;

    border:
        1px solid
        rgba(255,255,255,.07);
}

.players-head,
.player{
    display:grid;

    grid-template-columns:
        1fr
        95px
        125px;

    gap:8px;

    align-items:center;

    padding:13px 14px;
}

.players-head{
    color:#617087;
    font-size:10px;
    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.player{
    font-size:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);
}

.player:last-child{
    border-bottom:0;
}

.player-name{
    font-weight:900;
}

.player-bet{
    color:#a4b1c0;
    text-align:right;
}

.player-value{
    color:#55adff;
    text-align:right;
    font-weight:900;
}

.player.you{
    background:rgba(38,140,255,.08);
}

.player.cashed{
    background:rgba(32,212,134,.10);
}

.player.cashed .player-name,
.player.cashed .player-value{
    color:#55efa9;
}

.player.crashed{
    background:rgba(255,77,100,.10);
}

.player.crashed .player-name,
.player.crashed .player-value{
    color:#ff7182;
}

@media(max-width:600px){

    .game{
        height:425px;
    }

    .multiplier{
        font-size:58px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{
        grid-template-columns:
            1fr
            70px
            105px;

        padding:
            12px 10px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        UTRUX
    </div>

    <div class="balance">

        <span id="balance">
            100.00
        </span>

        <svg class="coin" viewBox="0 0 100 100">

            <circle
                cx="50"
                cy="50"
                r="47"
                fill="#1689e8"/>

            <circle
                cx="50"
                cy="50"
                r="38"
                fill="#0b70c7"/>

            <path
                d="M35 24h30v9H56v35h-9V33H35zM30 45h40v9H30z"
                fill="white"/>

        </svg>

    </div>

</header>


<main class="container">

<section class="game">

    <div class="stars"></div>

    <div class="grid"></div>

    <div
        class="status"
        id="status">

        BETTING OPEN

    </div>


    <div
        class="multiplier"
        id="multiplier">

        1.00x

    </div>


    <!-- ROCKET -->

    <div
        class="rocket-wrap"
        id="rocketWrap">

        <div class="rocket-flight">

            <div class="rocket">

                <div class="body-line"></div>

                <div class="window"></div>

                <div class="fin-left"></div>

                <div class="fin-right"></div>

                <div class="engine"></div>

                <div class="flame"></div>

            </div>

        </div>

    </div>


    <div
        class="explosion"
        id="explosion">
    </div>


    <div
        class="countdown"
        id="countdown">

        <div
            class="count-number"
            id="countNumber">

            10

        </div>

    </div>

</section>


<section class="controls">

    <button
        id="bettingBtn"
        class="betting-btn">

        BETTING

    </button>


    <div
        id="betPanel"
        class="bet-panel">

        <div class="bet-row">

            <input
                id="amountInput"
                class="amount"
                type="number"
                min="0.1"
                step="0.1"
                placeholder="Amount TON">

            <button
                id="startBtn"
                class="start">

                START

            </button>

        </div>

        <div
            id="message"
            class="message">
        </div>

    </div>

</section>


<section class="players">

    <div class="players-head">

        <div>PLAYER</div>

        <div style="text-align:right">
            BET
        </div>

        <div style="text-align:right">
            VALUE
        </div>

    </div>

    <div id="playersList"></div>

</section>

</main>


<script>

/* ================= ELEMENTS ================= */

const balanceEl =
    document.getElementById("balance");

const bettingBtn =
    document.getElementById("bettingBtn");

const betPanel =
    document.getElementById("betPanel");

const amountInput =
    document.getElementById("amountInput");

const startBtn =
    document.getElementById("startBtn");

const message =
    document.getElementById("message");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const explosion =
    document.getElementById("explosion");

const countdown =
    document.getElementById("countdown");

const countNumber =
    document.getElementById("countNumber");

const playersList =
    document.getElementById("playersList");

const rocketWrap =
    document.getElementById("rocketWrap");


/* ================= BALANCE ================= */

let balance =
    parseFloat(
        localStorage.getItem(
            "utruxRocketBalance"
        )
    );

if(!Number.isFinite(balance)){
    balance = 100;
}

function saveBalance(){

    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );

}

function updateBalance(){

    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();

}

updateBalance();


/* ================= STATE ================= */

let phase =
    "betting";

let multiplier =
    1;

let crashPoint =
    0;

let roundTimer =
    null;

let waitTimer =
    null;

let countdownTimer =
    null;

let hasBet =
    false;

let betAmount =
    0;


/* ================= PLAYERS ================= */

const names = [
    "Dark",
    "Nexus",
    "Hunter",
    "Titan",
    "Neo",
    "Storm",
    "Viper",
    "Alex",
    "Shadow",
    "Phoenix",
    "Nova",
    "Ghost",
    "Zero",
    "Wolf",
    "Blaze",
    "Lucky",
    "King",
    "Max"
];

let players = [];


/* ================= FAKE BET ================= */

function fakeBet(){

    const r =
        Math.random();

    if(r < .80){
        return .1 + Math.random() * .9;
    }

    if(r < .93){
        return 1 + Math.random() * 9;
    }

    if(r < .98){
        return 10 + Math.random() * 90;
    }

    return 100 + Math.random() * 900;
}


/* ================= FAKE CASHOUT ================= */

function fakeCashoutPoint(){

    const r =
        Math.random();

    if(r < .18){
        return 1.15 + Math.random() * .55;
    }

    if(r < .43){
        return 1.7 + Math.random() * 1.1;
    }

    if(r < .68){
        return 2.5 + Math.random() * 1.8;
    }

    if(r < .85){
        return 4.5 + Math.random() * 3;
    }

    return null;
}


/* ================= CRASH POINT ================= */

function generateCrash(){

    const r =
        Math.random();

    if(r < .40){
        return 1 + Math.random() * .30;
    }

    if(r < .75){
        return 1.30 + Math.random() * 1.20;
    }

    if(r < .845){
        return 2.50 + Math.random() * 2.50;
    }

    if(r < .945){
        return 5 + Math.random() * 2;
    }

    if(r < .95){
        return 100 + Math.random() * 100;
    }

    return 7 + Math.random() * 18;
}


/* ================= CREATE PLAYERS ================= */

function createPlayers(){

    players = [];

    const shuffled =
        [...names].sort(
            () => Math.random() - .5
        );

    for(let i=0;i<7;i++){

        players.push({

            name:shuffled[i],

            bet:fakeBet(),

            cashoutAt:
                fakeCashoutPoint(),

            cashed:false,

            crashed:false,

            finalMultiplier:0,

            finalValue:0
        });
    }

    renderPlayers();
}


/* ================= RENDER ================= */

function renderPlayers(){

    let html = "";


    if(hasBet){

        html += `

        <div class="player you">

            <div class="player-name">
                YOU
            </div>

            <div class="player-bet">
                ${betAmount.toFixed(2)}
            </div>

            <div
                class="player-value"
                id="userValue">

                ${(betAmount * multiplier).toFixed(2)}

            </div>

        </div>

        `;
    }


    players.forEach((player,index)=>{

        let rowClass =
            "player";

        if(player.cashed){
            rowClass += " cashed";
        }

        if(player.crashed){
            rowClass += " crashed";
        }


        let value;


        if(player.cashed){

            value =
                player.finalValue.toFixed(2)
                +
                " · "
                +
                player.finalMultiplier.toFixed(2)
                +
                "x";

        }
        else if(player.crashed){

            value =
                player.finalValue.toFixed(2)
                +
                " · CRASH";

        }
        else{

            value =
                (
                    player.bet *
                    multiplier
                ).toFixed(2);

        }


        html += `

        <div
            class="${rowClass}"
            id="player-${index}">

            <div class="player-name">
                ${player.name}
            </div>

            <div class="player-bet">
                ${player.bet.toFixed(2)}
            </div>

            <div class="player-value">
                ${value}
            </div>

        </div>

        `;

    });


    playersList.innerHTML =
        html;
}


/* ================= UPDATE PLAYERS ================= */

function updatePlayers(){

    players.forEach(player=>{

        if(
            player.cashed ||
            player.crashed
        ){
            return;
        }


        if(
            player.cashoutAt !== null &&
            multiplier >= player.cashoutAt
        ){

            player.cashed = true;

            player.finalMultiplier =
                player.cashoutAt;

            player.finalValue =
                player.bet *
                player.cashoutAt;
        }

    });


    renderPlayers();


    const userValue =
        document.getElementById(
            "userValue"
        );


    if(
        userValue &&
        hasBet
    ){

        userValue.textContent =
            (
                betAmount *
                multiplier
            ).toFixed(2);

    }

}


/* ================= BETTING ================= */

bettingBtn.addEventListener(
    "click",
    ()=>{

        if(hasBet){

            withdraw();

            return;
        }


        if(phase !== "betting"){

            message.textContent =
                "Wait for the next round.";

            return;
        }


        betPanel.classList.toggle(
            "show"
        );


        if(
            betPanel.classList.contains("show")
        ){

            amountInput.focus();

        }

    }
);


/* ================= START BET ================= */

startBtn.addEventListener(
    "click",
    ()=>{

        if(phase !== "betting"){

            message.textContent =
                "Betting is closed.";

            return;
        }


        const amount =
            parseFloat(
                amountInput.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.textContent =
                "Enter a valid amount.";

            return;
        }


        if(amount > balance){

            message.textContent =
                "Not enough TON.";

            return;
        }


        balance -= amount;

        betAmount =
            amount;

        hasBet =
            true;

        updateBalance();


        betPanel.classList.remove(
            "show"
        );


        bettingBtn.textContent =
            "WITHDRAW";

        bettingBtn.classList.add(
            "withdraw"
        );


        renderPlayers();

    }
);


/* ================= WITHDRAW ================= */

function withdraw(){

    if(!hasBet)
        return;


    const value =
        betAmount *
        multiplier;


    balance += value;

    hasBet = false;

    betAmount = 0;


    updateBalance();


    bettingBtn.textContent =
        "BETTING";

    bettingBtn.classList.remove(
        "withdraw"
    );


    message.textContent =
        "Withdraw " +
        value.toFixed(2) +
        " TON";


    renderPlayers();

}


/* ================= START ROUND ================= */

function startRound(){

    clearInterval(roundTimer);
    clearInterval(waitTimer);


    phase =
        "betting";


    multiplier =
        1;


    crashPoint =
        generateCrash();


    multiplierEl.textContent =
        "1.00x";

    multiplierEl.classList.remove(
        "crashed"
    );


    statusEl.textContent =
        "BETTING OPEN";


    /*
       راکت دوباره
       پایین چپ
    */

    rocketWrap.classList.remove(
        "fly-to-center"
    );

    rocketWrap.classList.remove(
        "hovering"
    );


    /*
       انفجار قبلی پاک شود
    */

    explosion.classList.remove(
        "active"
    );


    /*
       بازیکن‌ها
    */

    createPlayers();


    /*
       5 ثانیه زمان ورود
    */

   roundTimer = setInterval(() => {

    // سرعت پایه
    let speed = 0.085;

    // از 2x به بعد کمی سریع‌تر
    if (multiplier >= 2) {
        speed = 0.105;
    }

    // از 5x به بعد شتاب تدریجی
    if (multiplier >= 5) {
        const over5 = multiplier - 5;

        speed =
            0.13 +
            (over5 * 0.018);
    }

    // از 10x به بعد سریع‌تر
    if (multiplier >= 10) {
        const over10 = multiplier - 10;

        speed =
            0.22 +
            (over10 * 0.025);
    }

    // جلوگیری از پرش خیلی شدید
    speed = Math.min(speed, 0.75);

    multiplier += speed * 0.03;

    multiplierEl.textContent =
        multiplier.toFixed(2) + "x";

    updatePlayers();

    if (multiplier >= crashPoint) {
        crash();
    }

}, 30);
/* ================= ROCKET FLIGHT ================= */

function startFlight(){

    phase =
        "running";


    statusEl.textContent =
        "ROCKET FLYING";


    betPanel.classList.remove(
        "show"
    );


    /*
       راکت:
       پایین چپ → مرکز
    */

    rocketWrap.classList.add(
        "fly-to-center"
    );


    /*
       بعد از رسیدن به مرکز،
       حالت پرواز را فعال می‌کنیم.
    */

    setTimeout(
        ()=>{

            if(
                phase === "running"
            ){

                rocketWrap.classList.add(
                    "hovering"
                );

            }

        },
        1800
    );


    /*
       =====================================
       ضریب جدید
       =====================================

       1 تا 5:
       خیلی آرام

       بالای 5:
       کم کم سریع‌تر

       دیگر مثل قبل
       در یک ثانیه 2x نمی‌شود.
    */


    const startTime =
        performance.now();


    roundTimer =
        setInterval(
            ()=>{

                const elapsed =
                    (
                        performance.now() -
                        startTime
                    ) / 1000;


                /*
                   سرعت پایه بسیار آرام
                */

                let rate =
                    0.055;


                /*
                   فقط از 5x به بالا
                   شتاب اضافه می‌شود.
                */

                if(multiplier > 5){

                    const over =
                        multiplier - 5;


                    /*
                       شتاب نرم

                       هرچه بیشتر شود،
                       سرعت بیشتر می‌شود.
                    */

                    rate =
                        0.055 +
                        (
                            over *
                            0.012
                        );

                }


                /*
                   محدودیت منطقی
                   برای اینکه ناگهان
                   منفجر نشود.
                */

                rate =
                    Math.min(
                        rate,
                        0.30
                    );


                /*
                   افزایش ضریب
                */

                multiplier +=
                    rate *
                    0.03;


                multiplierEl.textContent =
                    multiplier.toFixed(2) +
                    "x";


                updatePlayers();


                if(
                    multiplier >=
                    crashPoint
                ){

                    crash();

                }

            },
            30
        );

}


/* ================= CRASH ================= */

function crash(){

    clearInterval(
        roundTimer
    );


    phase =
        "crashed";


    statusEl.textContent =
        "CRASH";


    multiplierEl.classList.add(
        "crashed"
    );


    /*
       راکت در مرکز می‌ترکد
    */

    rocketWrap.style.opacity =
        "0";


    /*
       بازیکن‌های بدون برداشت
       قرمز می‌شوند.
    */

    players.forEach(player=>{

        if(!player.cashed){

            player.crashed =
                true;

            player.finalMultiplier =
                multiplier;

            player.finalValue =
                player.bet *
                multiplier;

        }

    });


    renderPlayers();


    /*
       انفجار مرکز
    */

    explosion.classList.remove(
        "active"
    );

    void explosion.offsetWidth;

    explosion.classList.add(
        "active"
    );


    /*
       بعد از انفجار
       شمارش شروع شود.
    */

    setTimeout(
        startCountdown,
        900
    );

}


/* ================= COUNTDOWN ================= */

function startCountdown(){

    countdown.style.display =
        "flex";


    let n = 10;


    countNumber.textContent =
        n;


    countdownTimer =
        setInterval(
            ()=>{

                n--;


                if(n >= 1){

                    countNumber.textContent =
                        n;

                }
                else{

                    clearInterval(
                        countdownTimer
                    );


                    countdown.style.display =
                        "none";


                    /*
                       شرط فعال اگر
                       برداشت نشده بود،
                       در این دمو برگردانده می‌شود.
                    */

                    if(hasBet){

                        balance +=
                            betAmount;

                    }


                    hasBet =
                        false;

                    betAmount =
                        0;


                    updateBalance();


                    bettingBtn.textContent =
                        "BETTING";

                    bettingBtn.classList.remove(
                        "withdraw"
                    );


                    amountInput.value =
                        "";


                    /*
                       راکت دوباره
                       از پایین چپ شروع می‌کند.
                    */

                    rocketWrap.style.opacity =
                        "0";


                    startRound();

                }

            },
            1000
        );

}


/* ================= INITIAL ================= */

startRound();

</script>
