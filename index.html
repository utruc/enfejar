<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UTRUX ROCKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050b14;
    --panel:#0b1625;
    --panel2:#101d2f;
    --blue:#268cff;
    --blue2:#54a9ff;
    --green:#20d486;
    --yellow:#ffc94d;
    --red:#ff4e68;
    --muted:#8291a6;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%,#173b69 0%,transparent 42%),
        linear-gradient(#050b14,#02060c);
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

/* ================= HEADER ================= */

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(4,10,19,.9);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(16px);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    border-radius:50px;
    background:#0d1928;
    border:1px solid rgba(255,255,255,.07);
    font-weight:900;
}

.coin{
    width:22px;
    height:22px;
}

/* ================= MAIN ================= */

.container{
    width:min(100%,900px);
    margin:auto;
    padding:12px;
}

/* ================= GAME ================= */

.game{
    position:relative;
    height:480px;
    overflow:hidden;
    border-radius:23px;
    border:1px solid rgba(255,255,255,.07);
    background:
        radial-gradient(circle at 50% 75%,rgba(38,140,255,.17),transparent 36%),
        linear-gradient(180deg,#08192d,#040a12);
}

.stars{
    position:absolute;
    inset:0;
    opacity:.22;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#72baff 1px,transparent 1px);
    background-size:87px 91px,143px 127px;
    background-position:12px 22px,45px 65px;
}

.grid{
    position:absolute;
    left:-20%;
    right:-20%;
    bottom:-125px;
    height:330px;
    opacity:.13;
    transform:perspective(380px) rotateX(58deg);
    background-image:
        linear-gradient(rgba(38,140,255,.65) 1px,transparent 1px),
        linear-gradient(90deg,rgba(38,140,255,.65) 1px,transparent 1px);
    background-size:45px 45px;
}

/* ================= STATUS ================= */

.status{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:#8291a6;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    z-index:20;
}

/* ================= MULTIPLIER ================= */

.multiplier{
    position:absolute;
    left:50%;
    top:47%;
    transform:translate(-50%,-50%);
    font-size:74px;
    line-height:1;
    font-weight:900;
    letter-spacing:-3px;
    z-index:15;
    text-shadow:0 0 35px rgba(38,140,255,.35);
}

.multiplier.crashed{
    color:var(--red);
    text-shadow:0 0 35px rgba(255,78,104,.45);
}

/* ================= ROCKET ================= */

/*
   راکت کاملاً عمودی است.
   هنگام حرکت کمی به سمت بالا می‌رود
   ولی دیگر کج نمی‌شود.
*/

.rocket-wrap{
    position:absolute;
    left:45px;
    bottom:32px;
    width:90px;
    height:155px;
    z-index:12;
    will-change:left,bottom;
}

.rocket{
    position:absolute;
    left:24px;
    top:15px;
    width:42px;
    height:100px;
    border-radius:50% 50% 45% 45%;
    background:
        linear-gradient(
            90deg,
            #8297aa 0%,
            #eef6ff 35%,
            #ffffff 55%,
            #8499ad 100%
        );
    box-shadow:
        inset -6px 0 10px rgba(0,0,0,.2),
        0 0 22px rgba(255,255,255,.12);
}

/* نوک راکت */

.rocket::before{
    content:"";
    position:absolute;
    width:42px;
    height:38px;
    top:-19px;
    left:0;
    border-radius:50% 50% 18% 18%;
    background:
        linear-gradient(
            90deg,
            #9db0c1,
            #ffffff 50%,
            #8fa4b7
        );
}

/* پنجره */

.window{
    position:absolute;
    width:17px;
    height:17px;
    left:12px;
    top:22px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#dff4ff,#258fff 45%,#064d96);
    border:3px solid #526b82;
    box-shadow:0 0 13px rgba(38,140,255,.9);
}

/* خط بدنه */

.body-line{
    position:absolute;
    width:4px;
    height:62px;
    left:19px;
    top:17px;
    border-radius:10px;
    background:rgba(90,120,145,.35);
}

/* بال چپ */

.fin-left{
    position:absolute;
    left:-22px;
    bottom:10px;
    width:27px;
    height:42px;
    background:linear-gradient(135deg,#415b73,#7890a5);
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

/* بال راست */

.fin-right{
    position:absolute;
    right:-22px;
    bottom:10px;
    width:27px;
    height:42px;
    background:linear-gradient(225deg,#415b73,#7890a5);
    clip-path:polygon(0 0,100% 100%,0 100%);
}

/* موتور */

.engine{
    position:absolute;
    left:8px;
    bottom:-9px;
    width:26px;
    height:17px;
    border-radius:0 0 12px 12px;
    background:#3c5267;
}

/* شعله */

.flame{
    position:absolute;
    left:8px;
    bottom:-62px;
    width:27px;
    height:64px;
    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #ffe15a 20%,
            #ff9b22 52%,
            #ff3d5d 100%
        );
    clip-path:polygon(
        50% 100%,
        5% 35%,
        30% 48%,
        39% 0,
        61% 48%,
        95% 35%
    );
    filter:drop-shadow(0 0 13px #ff7b28);
    animation:flame .08s infinite alternate;
}

@keyframes flame{
    from{
        transform:scaleY(.9);
    }
    to{
        transform:scaleY(1.1);
    }
}

/* ================= EXPLOSION ================= */

.explosion{
    position:absolute;
    left:50%;
    top:50%;
    width:190px;
    height:190px;
    transform:translate(-50%,-50%) scale(.1);
    border-radius:50%;
    opacity:0;
    z-index:50;
    background:
        radial-gradient(
            circle,
            #fff 0 5%,
            #ffe56c 8%,
            #ff9d22 25%,
            #ff4e3d 45%,
            rgba(255,55,65,.15) 67%,
            transparent 73%
        );
}

.explosion.active{
    animation:explode .9s ease-out forwards;
}

@keyframes explode{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.1);
    }
    45%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.9);
    }
}

/* ================= COUNTDOWN ================= */

.countdown{
    position:absolute;
    inset:0;
    z-index:60;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,7,13,.5);
    backdrop-filter:blur(5px);
}

.count-number{
    font-size:145px;
    font-weight:900;
    text-shadow:0 0 55px rgba(38,140,255,.75);
}

/* ================= CONTROLS ================= */

.controls{
    margin-top:10px;
}

/* BETTING */

.betting-btn{
    width:100%;
    border:0;
    border-radius:15px;
    padding:17px;
    color:#fff;
    background:linear-gradient(135deg,#268cff,#1767ca);
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 28px rgba(38,140,255,.2);
}

.betting-btn.withdraw{
    background:linear-gradient(135deg,#ffc94d,#ed9e14);
    color:#241700;
}

.betting-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* ================= BET PANEL ================= */

.bet-panel{
    display:none;
    margin-top:8px;
    padding:13px;
    border-radius:16px;
    background:#0b1625;
    border:1px solid rgba(255,255,255,.07);
}

.bet-panel.show{
    display:block;
}

.bet-row{
    display:flex;
    gap:8px;
}

.amount{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:11px;
    border:1px solid #263c55;
    outline:none;
    background:#050c15;
    color:white;
    font-weight:800;
}

.amount:focus{
    border-color:#268cff;
}

.start{
    min-width:100px;
    border:0;
    border-radius:11px;
    background:var(--green);
    color:#03140c;
    font-weight:900;
    cursor:pointer;
}

.start:disabled{
    opacity:.5;
}

.message{
    min-height:20px;
    padding-top:8px;
    text-align:center;
    font-size:12px;
    color:#8491a5;
}

/* ================= PLAYERS ================= */

.players{
    margin-top:10px;
    overflow:hidden;
    border-radius:18px;
    background:#0b1625;
    border:1px solid rgba(255,255,255,.07);
}

.players-head,
.player{
    display:grid;
    grid-template-columns:1fr 95px 105px;
    gap:8px;
    align-items:center;
    padding:13px 14px;
}

.players-head{
    color:#617087;
    font-size:10px;
    font-weight:900;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.player{
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,.045);
}

.player:last-child{
    border-bottom:0;
}

.player.you{
    background:rgba(38,140,255,.09);
}

.player-name{
    font-weight:900;
}

.player-bet{
    color:#a4b1c0;
    text-align:right;
}

.player-value{
    color:#54a9ff;
    text-align:right;
    font-weight:900;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .game{
        height:425px;
    }

    .multiplier{
        font-size:58px;
    }

    .count-number{
        font-size:110px;
    }

    .players-head,
    .player{
        grid-template-columns:1fr 75px 88px;
        padding:12px 10px;
        font-size:11px;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        UTRUX
    </div>

    <div class="balance">

        <span id="balance">
            100.00
        </span>

        <svg class="coin" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="#1689e8"/>
            <circle cx="50" cy="50" r="38" fill="#0b70c7"/>
            <path
                d="M35 24h30v9H56v35h-9V33H35zM30 45h40v9H30z"
                fill="white"/>
        </svg>

    </div>

</header>


<main class="container">

    <section class="game">

        <div class="stars"></div>
        <div class="grid"></div>

        <div
            class="status"
            id="status">
            BETTING OPEN
        </div>

        <div
            class="multiplier"
            id="multiplier">
            1.00x
        </div>


        <!-- ROCKET -->

        <div
            class="rocket-wrap"
            id="rocketWrap">

            <div class="rocket">

                <div class="body-line"></div>

                <div class="window"></div>

                <div class="fin-left"></div>
                <div class="fin-right"></div>

                <div class="engine"></div>

                <div class="flame"></div>

            </div>

        </div>


        <div
            class="explosion"
            id="explosion">
        </div>


        <!-- 10 -> 1 -->

        <div
            class="countdown"
            id="countdown">

            <div
                class="count-number"
                id="countNumber">
                10
            </div>

        </div>

    </section>


    <!-- =========================
         BET AREA
    ========================== -->

    <section class="controls">

        <!--
            IMPORTANT:
            This is the main button.

            Before START:
            BETTING

            After START:
            WITHDRAW
        -->

        <button
            id="bettingBtn"
            class="betting-btn">

            BETTING

        </button>


        <!--
            This panel ONLY appears after
            clicking BETTING.
        -->

        <div
            id="betPanel"
            class="bet-panel">

            <div class="bet-row">

                <input
                    id="amountInput"
                    class="amount"
                    type="number"
                    min="0.1"
                    step="0.1"
                    placeholder="Amount TON">

                <button
                    id="startBtn"
                    class="start">

                    START

                </button>

            </div>

            <div
                id="message"
                class="message">
            </div>

        </div>

    </section>


    <!-- =========================
         PLAYERS
    ========================== -->

    <section class="players">

        <div class="players-head">

            <div>PLAYER</div>

            <div style="text-align:right">
                BET
            </div>

            <div style="text-align:right">
                VALUE
            </div>

        </div>

        <div id="playersList"></div>

    </section>

</main>


<script>

/* =========================================
   ELEMENTS
========================================= */

const balanceEl =
    document.getElementById("balance");

const bettingBtn =
    document.getElementById("bettingBtn");

const betPanel =
    document.getElementById("betPanel");

const amountInput =
    document.getElementById("amountInput");

const startBtn =
    document.getElementById("startBtn");

const message =
    document.getElementById("message");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const rocket =
    document.getElementById("rocketWrap");

const explosion =
    document.getElementById("explosion");

const countdown =
    document.getElementById("countdown");

const countNumber =
    document.getElementById("countNumber");

const playersList =
    document.getElementById("playersList");


/* =========================================
   BALANCE
========================================= */

let balance =
    parseFloat(
        localStorage.getItem(
            "utruxRocketBalance"
        )
    );

if(!Number.isFinite(balance)){
    balance = 100;
}

function saveBalance(){

    localStorage.setItem(
        "utruxRocketBalance",
        balance.toFixed(2)
    );

}

function updateBalance(){

    balanceEl.textContent =
        balance.toFixed(2);

    saveBalance();

}

updateBalance();


/* =========================================
   GAME STATE
========================================= */

let phase = "betting";

let multiplier = 1;

let crashPoint = 0;

let roundTimer = null;

let waitTimer = null;

let countdownTimer = null;

let hasBet = false;

let betAmount = 0;


/* =========================================
   FAKE PLAYERS
========================================= */

const names = [
    "Alex",
    "Shadow",
    "Nexus",
    "Phoenix",
    "Nova",
    "Ghost",
    "Titan",
    "Viper",
    "Storm",
    "Zero",
    "Wolf",
    "Neo",
    "Blaze",
    "Lucky",
    "Hunter",
    "Max",
    "Dark",
    "King"
];

let players = [];


/* =========================================
   RANDOM FAKE BET
========================================= */

function fakeBet(){

    const r = Math.random();

    if(r < 0.80){

        return 0.1 +
            Math.random() * 0.9;

    }

    if(r < 0.93){

        return 1 +
            Math.random() * 9;

    }

    if(r < 0.98){

        return 10 +
            Math.random() * 90;

    }

    return 100 +
        Math.random() * 900;

}


/* =========================================
   RANDOM CRASH
========================================= */

function generateCrash(){

    const r = Math.random();

    if(r < .40){

        return 1 +
            Math.random() * .30;

    }

    if(r < .75){

        return 1.30 +
            Math.random() * 1.20;

    }

    if(r < .845){

        return 2.50 +
            Math.random() * 2.50;

    }

    if(r < .945){

        return 5 +
            Math.random() * 2;

    }

    if(r < .95){

        return 100 +
            Math.random() * 100;

    }

    return 7 +
        Math.random() * 18;

}


/* =========================================
   CREATE PLAYERS
========================================= */

function createPlayers(){

    players = [];

    const shuffled =
        [...names].sort(
            () => Math.random() - .5
        );

    for(let i = 0; i < 7; i++){

        players.push({

            name:shuffled[i],

            bet:fakeBet()

        });

    }

    renderPlayers();

}


/* =========================================
   RENDER PLAYERS
========================================= */

function renderPlayers(){

    let html = "";


    if(hasBet){

        html += `

        <div class="player you">

            <div class="player-name">
                YOU
            </div>

            <div class="player-bet">
                ${betAmount.toFixed(2)}
            </div>

            <div
                class="player-value"
                id="userValue">

                ${betAmount.toFixed(2)}

            </div>

        </div>

        `;

    }


    players.forEach(player => {

        html += `

        <div class="player">

            <div class="player-name">
                ${player.name}
            </div>

            <div class="player-bet">
                ${player.bet.toFixed(2)}
            </div>

            <div
                class="player-value"
                data-base="${player.bet}">

                ${player.bet.toFixed(2)}

            </div>

        </div>

        `;

    });


    playersList.innerHTML = html;

}


/* =========================================
   UPDATE PLAYER VALUES
========================================= */

function updateValues(){

    document
        .querySelectorAll("[data-base]")
        .forEach(el => {

            const base =
                parseFloat(
                    el.dataset.base
                );

            el.textContent =
                (base * multiplier)
                .toFixed(2);

        });


    const userValue =
        document.getElementById(
            "userValue"
        );


    if(userValue && hasBet){

        userValue.textContent =
            (betAmount * multiplier)
            .toFixed(2);

    }

}


/* =========================================
   RESET ROCKET
========================================= */

function resetRocket(){

    rocket.style.left = "45px";

    rocket.style.bottom = "32px";

}


/* =========================================
   MOVE ROCKET
========================================= */

function moveRocket(){

    const progress =
        Math.min(
            1,
            (multiplier - 1) /
            Math.max(
                .5,
                crashPoint - 1
            )
        );


    const x =
        45 + progress * 690;

    const y =
        32 + progress * 310;


    rocket.style.left =
        x + "px";

    rocket.style.bottom =
        y + "px";

}


/* =========================================
   MAIN BETTING BUTTON
========================================= */

/*
   THIS BUTTON HAS TWO STATES:

   1. BETTING
   2. WITHDRAW

   After START it becomes WITHDRAW.
*/

bettingBtn.addEventListener(
    "click",
    () => {


        /* =========================
           WITHDRAW STATE
        ========================== */

        if(hasBet){

            withdraw();

            return;

        }


        /* =========================
           BETTING STATE
        ========================== */

        if(phase !== "betting"){

            message.textContent =
                "Wait for the next round.";

            betPanel.classList.add(
                "show"
            );

            return;

        }


        betPanel.classList.toggle(
            "show"
        );


        if(
            betPanel.classList.contains(
                "show"
            )
        ){

            amountInput.focus();

        }

    }
);


/* =========================================
   START BUTTON
========================================= */

startBtn.addEventListener(
    "click",
    () => {


        if(phase !== "betting"){

            message.textContent =
                "Betting is closed.";

            return;

        }


        if(hasBet){

            return;

        }


        const amount =
            parseFloat(
                amountInput.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            message.textContent =
                "Enter a valid amount.";

            return;

        }


        if(amount > balance){

            message.textContent =
                "Not enough TON.";

            return;

        }


        /*
           REMOVE TON FROM BALANCE
        */

        balance -= amount;

        betAmount = amount;

        hasBet = true;


        updateBalance();


        /*
           CLOSE INPUT PANEL
        */

        betPanel.classList.remove(
            "show"
        );


        /*
           CHANGE BETTING -> WITHDRAW
        */

        bettingBtn.textContent =
            "WITHDRAW";

        bettingBtn.classList.add(
            "withdraw"
        );


        /*
           UPDATE PLAYERS
        */

        renderPlayers();

    }
);


/* =========================================
   WITHDRAW
========================================= */

function withdraw(){

    if(!hasBet)
        return;


    /*
       Demo value:
       current amount × current multiplier
    */

    const value =
        betAmount * multiplier;


    balance += value;


    hasBet = false;

    betAmount = 0;


    updateBalance();


    /*
       RESTORE BETTING BUTTON
    */

    bettingBtn.textContent =
        "BETTING";

    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value = "";

    message.textContent =
        "Withdraw: " +
        value.toFixed(2) +
        " TON";


    renderPlayers();

}


/* =========================================
   RESET FOR NEXT ROUND
========================================= */

function resetForNextRound(){

    /*
       If user didn't withdraw,
       return only original amount.
    */

    if(hasBet){

        balance += betAmount;

    }


    hasBet = false;

    betAmount = 0;


    updateBalance();


    bettingBtn.textContent =
        "BETTING";

    bettingBtn.classList.remove(
        "withdraw"
    );


    amountInput.value = "";

    renderPlayers();

}


/* =========================================
   START NEW ROUND
========================================= */

function startRound(){

    clearInterval(roundTimer);

    clearInterval(waitTimer);


    phase = "betting";


    multiplier = 1;


    crashPoint =
        generateCrash();


    resetRocket();


    multiplierEl.textContent =
        "1.00x";


    multiplierEl.classList.remove(
        "crashed"
    );


    statusEl.textContent =
        "BETTING OPEN";


    bettingBtn.disabled = false;


    createPlayers();


    /*
       5 SECOND BETTING WINDOW
    */

    let seconds = 5;


    message.textContent =
        "";


    waitTimer =
        setInterval(
            () => {

                seconds--;


                if(seconds <= 0){

                    clearInterval(
                        waitTimer
                    );

                    startFlight();

                }

            },
            1000
        );

}


/* =========================================
   START FLIGHT
========================================= */

function startFlight(){

    phase = "running";


    statusEl.textContent =
        "ROCKET FLYING";


    /*
       IMPORTANT:
       If user has already started,
       WITHDRAW stays active.
    */

    if(!hasBet){

        bettingBtn.disabled = true;

    }


    /*
       Input panel is always closed
       once rocket starts.
    */

    betPanel.classList.remove(
        "show"
    );


    let speed = .012;


    roundTimer =
        setInterval(
            () => {


                multiplier += speed;

                speed += .00025;


                multiplierEl.textContent =
                    multiplier.toFixed(2) +
                    "x";


                updateValues();

                moveRocket();


                if(
                    multiplier >=
                    crashPoint
                ){

                    crash();

                }


            },
            50
        );

}


/* =========================================
   CRASH
========================================= */

function crash(){

    clearInterval(roundTimer);


    phase = "crashed";


    statusEl.textContent =
        "CRASH";


    multiplierEl.classList.add(
        "crashed"
    );


    explosion.classList.remove(
        "active"
    );


    void explosion.offsetWidth;


    explosion.classList.add(
        "active"
    );


    /*
       Explosion first,
       then countdown.
    */

    setTimeout(
        () => {

            startCountdown();

        },
        800
    );

}


/* =========================================
   COUNTDOWN 10 -> 1
========================================= */

function startCountdown(){

    countdown.style.display =
        "flex";


    let number = 10;


    countNumber.textContent =
        number;


    countdownTimer =
        setInterval(
            () => {

                number--;


                if(number >= 1){

                    countNumber.textContent =
                        number;

                }
                else{

                    clearInterval(
                        countdownTimer
                    );


                    countdown.style.display =
                        "none";


                    /*
                       NEW ROUND
                    */

                    resetForNextRound();

                    startRound();

                }


            },
            1000
        );

}


/* =========================================
   INITIAL LOAD
========================================= */

createPlayers();

resetRocket();

startRound();

</script>
