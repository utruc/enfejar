<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UTRUX — CRASH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#1d9bea;
    --blue2:#1267bb;
    --bg:#02060d;
    --panel:#071321;
    --text:#fff;
    --muted:#8190a0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(
            circle at 50% 10%,
            #123052 0%,
            #071524 38%,
            #02060d 100%
        );
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    max-width:1080px;
    margin:auto;
    padding:12px;
}

/* HEADER */

.header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
}

.logo{
    font-size:26px;
    font-weight:950;
    letter-spacing:2px;
    direction:ltr;
}

.mode{
    position:absolute;
    left:4px;
    top:5px;

    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    direction:ltr;

    padding:8px 12px;
    border-radius:10px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.09);
}

.balance{
    display:flex;
    align-items:center;
    gap:8px;
    direction:ltr;
}

.balance-number{
    font-size:23px;
    font-weight:950;
}

.coin{
    width:32px;
    height:32px;
}

.coin svg{
    width:100%;
    height:100%;
}

/* GAME */

.game{
    height:450px;
    position:relative;
    overflow:hidden;

    border-radius:23px;

    background:
        linear-gradient(
            180deg,
            rgba(16,38,63,.78),
            rgba(2,9,17,.97)
        );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        inset 0 0 100px rgba(0,0,0,.3);
}

.game::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

/* ضریب مشترک وسط */

.multiplier{
    position:absolute;
    z-index:50;

    left:50%;
    top:38%;

    transform:translate(-50%,-50%);

    font-size:58px;
    font-weight:950;

    direction:ltr;

    text-shadow:
        0 5px 30px rgba(0,0,0,.8);
}

.status{
    position:absolute;
    z-index:50;

    left:50%;
    top:52%;

    transform:translateX(-50%);

    color:#95a5b6;
    font-size:14px;
}

/* COUNTDOWN */

.countdown{
    position:absolute;
    z-index:100;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:95px;
    font-weight:950;

    direction:ltr;

    display:none;

    text-shadow:
        0 8px 35px rgba(0,0,0,.9);

    animation:
        countdownFade .9s ease;
}

.countdown.show{
    display:block;
}

@keyframes countdownFade{
    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.3);
    }

    25%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.8);
    }
}

/* JET */

.jet{
    position:absolute;

    width:128px;
    height:72px;

    left:20px;
    bottom:18px;

    z-index:20;
}

.jet-body{
    position:absolute;

    left:28px;
    top:29px;

    width:82px;
    height:17px;

    background:
        linear-gradient(
            180deg,
            #e8eef3,
            #8e9aa5 50%,
            #4c5864
        );

    border-radius:65% 15% 15% 65%;

    transform:skewX(-12deg);
}

.jet-nose{
    position:absolute;

    right:4px;
    top:29px;

    width:35px;
    height:17px;

    background:
        linear-gradient(
            180deg,
            #e9eef2,
            #75828d
        );

    clip-path:
        polygon(
            0 0,
            100% 50%,
            0 100%
        );
}

.jet-wing-top{
    position:absolute;

    left:41px;
    top:14px;

    width:70px;
    height:32px;

    background:
        linear-gradient(
            135deg,
            #9ba8b3,
            #4d5965
        );

    clip-path:
        polygon(
            0 100%,
            100% 0,
            62% 100%
        );
}

.jet-wing-bottom{
    position:absolute;

    left:39px;
    top:39px;

    width:66px;
    height:28px;

    background:
        linear-gradient(
            135deg,
            #66737f,
            #3b4651
        );

    clip-path:
        polygon(
            0 0,
            100% 100%,
            58% 100%
        );
}

.jet-tail{
    position:absolute;

    left:27px;
    top:12px;

    width:25px;
    height:38px;

    background:
        linear-gradient(
            135deg,
            #7c8994,
            #414c57
        );

    clip-path:
        polygon(
            0 100%,
            50% 0,
            100% 100%
        );
}

.jet-window{
    position:absolute;

    left:68px;
    top:30px;

    width:22px;
    height:8px;

    background:
        linear-gradient(
            90deg,
            #091b2d,
            #245d82
        );

    border-radius:70%;
}

.flame{
    position:absolute;

    left:3px;
    top:33px;

    width:34px;
    height:13px;

    background:
        linear-gradient(
            90deg,
            #ffbd00,
            #ff5a00,
            transparent
        );

    clip-path:
        polygon(
            0 50%,
            100% 0,
            72% 50%,
            100% 100%
        );

    animation:flame .08s infinite alternate;
}

@keyframes flame{
    from{
        transform:scaleX(.72);
    }

    to{
        transform:scaleX(1.18);
    }
}

/* EXPLOSION */

.explosion{
    position:absolute;

    width:140px;
    height:140px;

    display:none;

    z-index:60;

    transform:translate(-50%,-50%);
}

.explosion.show{
    display:block;
    animation:explode .8s forwards;
}

.explosion::before{
    content:"";

    position:absolute;
    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0 7%,
            #fff000 8% 22%,
            #ff8200 23% 47%,
            #f32d00 48% 65%,
            transparent 66%
        );
}

.explosion::after{
    content:"";

    position:absolute;
    inset:-35px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            transparent 28%,
            rgba(255,120,0,.5) 29%,
            transparent 55%
        );
}

@keyframes explode{
    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    45%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.55);
    }
}

/* CONTROLS */

.controls{
    margin-top:12px;
    padding:13px;

    border-radius:18px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);
}

.control-row{
    display:flex;
    gap:9px;
}

.amount-box{
    flex:1;
}

.amount-box input{
    width:100%;
    height:49px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;

    background:#081321;

    color:white;

    outline:none;

    padding:0 14px;

    font-size:17px;

    direction:ltr;
}

.join{
    height:49px;

    border:0;
    border-radius:13px;

    padding:0 23px;

    background:
        linear-gradient(
            135deg,
            #168bd9,
            #175fb7
        );

    color:white;

    font-weight:900;

    cursor:pointer;
}

.join:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.info{
    display:flex;
    justify-content:space-between;

    margin-top:10px;

    color:#8393a5;

    font-size:12px;
}

.your-entry{
    color:#4fc5ff;
}

/* PLAYERS */

.players{
    margin-top:12px;

    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);
}

.players-head{
    padding:14px;
    font-weight:900;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.player{
    height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);
}

.player:last-child{
    border-bottom:0;
}

.player-name{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:32px;
    height:32px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #263f5c,
            #101b29
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:900;
}

.me .avatar{
    background:
        linear-gradient(
            135deg,
            #168bd8,
            #194d98
        );
}

.amount{
    direction:ltr;

    display:flex;
    align-items:center;

    gap:6px;

    font-weight:850;
}

.mini-coin{
    width:20px;
    height:20px;
}

/* MOBILE */

@media(max-width:600px){

    .app{
        padding:9px;
    }

    .game{
        height:390px;
    }

    .multiplier{
        font-size:45px;
    }

    .countdown{
        font-size:78px;
    }

    .control-row{
        flex-direction:column;
    }

    .join{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        UTRUX
    </div>

    <div class="balance">

        <span
            class="balance-number"
            id="balance"
        >100</span>

        <div class="coin">

            <svg
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                        id="coinGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop
                            offset="0"
                            stop-color="#82eaff"
                        />

                        <stop
                            offset=".5"
                            stop-color="#20ace8"
                        />

                        <stop
                            offset="1"
                            stop-color="#086db5"
                        />
                    </linearGradient>

                </defs>

                <circle
                    cx="50"
                    cy="50"
                    r="47"
                    fill="#064c80"
                />

                <circle
                    cx="50"
                    cy="47"
                    r="42"
                    fill="url(#coinGradient)"
                />

                <circle
                    cx="50"
                    cy="47"
                    r="35"
                    fill="none"
                    stroke="#c5f5ff"
                    stroke-opacity=".35"
                    stroke-width="2"
                />

                <path
                    d="M31 29H69L61 44L50 67L39 44Z"
                    fill="none"
                    stroke="white"
                    stroke-width="5"
                    stroke-linejoin="round"
                />

                <path
                    d="M31 29L50 67L69 29"
                    fill="none"
                    stroke="white"
                    stroke-width="4"
                />

            </svg>

        </div>

    </div>

    <div class="mode">
        CRASH
    </div>

</header>


<main
    class="game"
    id="game"
>

    <!-- ضریب مشترک -->
    <div
        class="multiplier"
        id="multiplier"
    >
        1.00x
    </div>

    <div
        class="status"
        id="status"
    >
        در انتظار شروع...
    </div>

    <!-- شمارنده -->
    <div
        class="countdown"
        id="countdown"
    >
        10
    </div>

    <!-- جنگنده -->
    <div
        class="jet"
        id="jet"
    >

        <div class="flame"></div>
        <div class="jet-tail"></div>
        <div class="jet-wing-top"></div>
        <div class="jet-wing-bottom"></div>
        <div class="jet-body"></div>
        <div class="jet-nose"></div>
        <div class="jet-window"></div>

    </div>

    <div
        class="explosion"
        id="explosion"
    ></div>

</main>


<section class="controls">

    <div class="control-row">

        <div class="amount-box">

            <input
                id="amount"
                type="number"
                min="0.1"
                step="0.1"
                value="10"
                placeholder="TON"
            >

        </div>

        <button
            class="join"
            id="join"
        >
            ورود به دور
        </button>

    </div>

    <div class="info">

        <span id="roundInfo">
            دور بعدی به‌زودی
        </span>

        <span
            class="your-entry"
            id="entryText"
        >
            بدون ورود
        </span>

    </div>

</section>


<section class="players">

    <div class="players-head">
        بازیکنان
    </div>

    <div id="playersList"></div>

</section>

</div>


<script>

/* ELEMENTS */

const balanceEl =
    document.getElementById("balance");

const amountEl =
    document.getElementById("amount");

const joinBtn =
    document.getElementById("join");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const jetEl =
    document.getElementById("jet");

const explosionEl =
    document.getElementById("explosion");

const countdownEl =
    document.getElementById("countdown");

const playersList =
    document.getElementById("playersList");

const entryText =
    document.getElementById("entryText");

const roundInfo =
    document.getElementById("roundInfo");


/* BALANCE */

let balance =
    Number(
        localStorage.getItem("utruxBalance")
    );

/*
   اگر اولین بار باشد،
   100 TON رایگان.
*/

if(
    !Number.isFinite(balance)
){

    balance = 100;

    localStorage.setItem(
        "utruxBalance",
        "100"
    );
}

let joinedAmount = 0;

let running = false;

let multiplier = 1;

let crashPoint = 1.2;

let animationFrame = null;

let currentPlayers = [];


/* SAVE */

function saveBalance(){

    localStorage.setItem(
        "utruxBalance",
        String(balance)
    );

    balanceEl.textContent =
        balance
        .toFixed(1)
        .replace(".0","");
}


/* RANDOM NAMES */

const names = [

    "Shadow",
    "DarkX",
    "Ali",
    "Armin",
    "Nima",
    "Ghost",
    "Wolf",
    "Dragon",
    "Hunter",
    "Phoenix",
    "Neo",
    "Titan",
    "Viper",
    "Storm",
    "Rex",
    "Night",
    "Zero",
    "Cyber",
    "Max",
    "Legend",
    "Nova",
    "Blaze",
    "Alpha",
    "Omega",
    "Sina",
    "Amir",
    "Reza",
    "Sam",
    "UTRUX",
    "Master"
];


/* SHUFFLE */

function shuffle(array){

    return [...array].sort(
        () => Math.random() - .5
    );

}


/*
   مقدار بازیکن فیک

   0.1 - 1  => 80%
   1 - 10   => 13%
   10 - 100  => 5%
   100 - 1000 => 2%
*/

function fakeAmount(){

    const r =
        Math.random();

    if(r < .80){

        return (
            .1 +
            Math.random() * .9
        );

    }

    if(r < .93){

        return (
            1 +
            Math.random() * 9
        );

    }

    if(r < .98){

        return (
            10 +
            Math.random() * 90
        );

    }

    return (
        100 +
        Math.random() * 900
    );
}


/* CREATE PLAYERS */

function createPlayers(){

    const selected =
        shuffle(names).slice(0,7);

    currentPlayers =
        selected.map(name => ({

            name:name,

            base:fakeAmount()

        }));

}


/* RENDER PLAYERS */

function renderPlayers(){

    let html = "";

    /*
       USER
    */

    html += `

    <div class="player me">

        <div class="player-name">

            <div class="avatar">
                U
            </div>

            <span>
                شما
            </span>

        </div>

        <div
            class="amount"
            id="myAmount"
        >

            ${
                joinedAmount > 0
                ? joinedAmount.toFixed(2)
                : "—"
            }

            <svg
                class="mini-coin"
                viewBox="0 0 100 100"
            >

                <circle
                    cx="50"
                    cy="50"
                    r="44"
                    fill="#20aee8"
                />

                <path
                    d="M31 29H69L61 44L50 67L39 44Z"
                    fill="none"
                    stroke="white"
                    stroke-width="6"
                />

            </svg>

        </div>

    </div>

    `;


    /*
       FAKE PLAYERS
    */

    currentPlayers.forEach(
        (player,index) => {

            html += `

            <div class="player">

                <div class="player-name">

                    <div class="avatar">
                        ${player.name
                            .charAt(0)
                            .toUpperCase()}
                    </div>

                    <span>
                        ${player.name}
                    </span>

                </div>

                <div
                    class="amount"
                    id="fakeAmount${index}"
                >

                    ${player.base.toFixed(2)}

                    <svg
                        class="mini-coin"
                        viewBox="0 0 100 100"
                    >

                        <circle
                            cx="50"
                            cy="50"
                            r="44"
                            fill="#20aee8"
                        />

                        <path
                            d="M31 29H69L61 44L50 67L39 44Z"
                            fill="none"
                            stroke="white"
                            stroke-width="6"
                        />

                    </svg>

                </div>

            </div>

            `;

        }
    );


    playersList.innerHTML =
        html;

}


/*
   مقدارهای بازیکنان
   همراه ضریب بالا می‌روند.
*/

function updateFakePlayers(){

    currentPlayers.forEach(
        (player,index) => {

            const value =
                player.base *
                multiplier;

            const element =
                document.getElementById(
                    "fakeAmount" + index
                );

            if(element){

                const coin =
                    element.querySelector(
                        ".mini-coin"
                    );

                element.textContent =
                    value.toFixed(2);

                if(coin){
                    element.appendChild(coin);
                }

            }

        }
    );


    /*
       مقدار شما هم با همان ضریب
       فقط به‌صورت نمایشی نمایش داده می‌شود.
    */

    if(joinedAmount > 0){

        const myAmount =
            document.getElementById(
                "myAmount"
            );

        if(myAmount){

            const coin =
                myAmount.querySelector(
                    ".mini-coin"
                );

            myAmount.textContent =
                (
                    joinedAmount *
                    multiplier
                ).toFixed(2);

            if(coin){
                myAmount.appendChild(coin);
            }

        }

    }

}


/* CRASH POINT */

function generateCrash(){

    const r =
        Math.random();

    if(r < .40){

        return (
            1 +
            Math.random() * .30
        );

    }

    if(r < .75){

        return (
            1.3 +
            Math.random() * 1.2
        );

    }

    if(r < .845){

        return (
            2.5 +
            Math.random() * 2.5
        );

    }

    if(r < .945){

        return (
            5 +
            Math.random() * 2
        );

    }

    if(Math.random() < .091){

        return (
            100 +
            Math.random() * 100
        );

    }

    return (
        7 +
        Math.random() * 18
    );

}


/* JOIN */

joinBtn.addEventListener(
    "click",
    () => {

        /*
           اگر دور در حال اجراست،
           ورود برای دور بعد ثبت می‌شود.
        */

        if(running){

            alert(
                "این دور شروع شده؛ برای دور بعد وارد شوید."
            );

            return;
        }


        const amount =
            Number(
                amountEl.value
            );


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            alert(
                "مقدار TON را درست وارد کن."
            );

            return;
        }


        /*
           موجودی کافی نیست
        */

        if(amount > balance){

            alert(
                "TON کافی نداری؛ مقدار کمتری وارد کن و دور بعد دوباره امتحان کن."
            );

            return;
        }


        /*
           اگر قبلاً مقداری ثبت شده بود،
           اول برگردان.
        */

        if(joinedAmount > 0){

            balance +=
                joinedAmount;

        }


        balance -= amount;

        joinedAmount =
            amount;


        saveBalance();


        entryText.textContent =
            `ورود: ${amount} TON`;


        renderPlayers();

    }
);


/* RESET */

function resetEntry(){

    /*
       در این نسخه بعد از پایان دور،
       مقدار ورود دوباره به موجودی برمی‌گردد
       چون سیستم پرداخت/برداشت واقعی نیست.
    */

    if(joinedAmount > 0){

        balance +=
            joinedAmount;

        joinedAmount = 0;

        saveBalance();

    }


    entryText.textContent =
        "بدون ورود";

}


/* MOVE JET */

function animateJet(){

    const game =
        document.getElementById("game");

    const width =
        game.clientWidth;

    const height =
        game.clientHeight;

    const maxX =
        width - 150;

    const maxY =
        height - 125;


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (multiplier - 1) /
                Math.max(
                    .5,
                    crashPoint - 1
                )
            )
        );


    const x =
        20 +
        progress * maxX;

    const y =
        height -
        60 -
        progress * maxY;


    jetEl.style.left =
        x + "px";

    jetEl.style.bottom =
        (
            height -
            y -
            50
        ) + "px";

}


/* START ROUND */

function startRound(){

    running = true;

    multiplier = 1;

    crashPoint =
        generateCrash();


    createPlayers();

    renderPlayers();


    explosionEl.classList.remove(
        "show"
    );

    countdownEl.classList.remove(
        "show"
    );


    jetEl.style.display =
        "block";

    jetEl.style.left =
        "20px";

    jetEl.style.bottom =
        "18px";


    statusEl.textContent =
        "در حال پرواز...";

    roundInfo.textContent =
        "دور در حال اجرا";


    joinBtn.disabled =
        true;


    const start =
        performance.now();


    function frame(now){

        if(!running){
            return;
        }


        const elapsed =
            (now - start) / 1000;


        multiplier =
            Math.pow(
                1.115,
                elapsed
            );


        multiplier =
            Math.max(
                1,
                multiplier
            );


        /*
           همین یک ضریب
           وسط صفحه برای همه
        */

        multiplierEl.textContent =
            multiplier.toFixed(2) +
            "x";


        animateJet();

        updateFakePlayers();


        if(
            multiplier >=
            crashPoint
        ){

            crash();

            return;

        }


        animationFrame =
            requestAnimationFrame(
                frame
            );

    }


    animationFrame =
        requestAnimationFrame(
            frame
        );

}


/* CRASH */

function crash(){

    running = false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    multiplierEl.textContent =
        crashPoint.toFixed(2) +
        "x";


    statusEl.textContent =
        "CRASH";


    const rect =
        jetEl.getBoundingClientRect();

    const gameRect =
        document
        .getElementById("game")
        .getBoundingClientRect();


    explosionEl.style.left =
        (
            rect.left -
            gameRect.left +
            rect.width / 2
        ) + "px";


    explosionEl.style.top =
        (
            rect.top -
            gameRect.top +
            rect.height / 2
        ) + "px";


    explosionEl.classList.remove(
        "show"
    );


    void explosionEl.offsetWidth;


    explosionEl.classList.add(
        "show"
    );


    jetEl.style.display =
        "none";


    joinBtn.disabled =
        true;


    /*
       شمارنده 10 تا 1
    */

    setTimeout(
        () => {

            startCountdown();

        },
        900
    );

}


/* COUNTDOWN */

function startCountdown(){

    let number = 10;


    countdownEl.textContent =
        number;


    countdownEl.classList.add(
        "show"
    );


    const timer =
        setInterval(
            () => {

                number--;


                if(number <= 0){

                    clearInterval(timer);


                    countdownEl.classList.remove(
                        "show"
                    );


                    resetEntry();


                    multiplierEl.textContent =
                        "1.00x";


                    statusEl.textContent =
                        "در انتظار شروع...";


                    roundInfo.textContent =
                        "دور جدید شروع شد";


                    joinBtn.disabled =
                        false;


                    /*
                       دور جدید
                    */

                    setTimeout(
                        () => {

                            startRound();

                        },
                        250
                    );


                    return;
                }


                countdownEl.classList.remove(
                    "show"
                );


                /*
                   اجازه می‌دهیم انیمیشن
                   دوباره اجرا شود.
                */

                void countdownEl.offsetWidth;


                countdownEl.textContent =
                    number;


                countdownEl.classList.add(
                    "show"
                );

            },
            1000
        );

}


/* INIT */

saveBalance();

createPlayers();

renderPlayers();


/*
   شروع خودکار
*/

setTimeout(
    () => {

        startRound();

    },
    1200
);

</script>
